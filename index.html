<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화성시 공기관 예산통합 대시보드</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" />
<style>
@font-face {
  font-family: 'GmarketSans';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'GmarketSans';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'GmarketSans';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Isamanru';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-10@1.0/GongGothicMedium.woff') format('woff');
  font-weight: normal;
  font-display: swap;
}
:root {
  --bg: #F3F5FA;
  --bg-card: #ffffff;
  --bg-hover: #F0F3FA;
  --text: #10131C;
  --text-muted: #5B6373;
  --text-soft: #9AA2B1;
  --border: #E7EAF1;
  --border-strong: #D8DCE7;
  --accent: #3457D5;
  --accent-dark: #22348E;
  --accent-soft: #EAF0FE;
  --navy: #10182E;
  --navy-fill: #3D4560;
  --success: #16924F;
  --success-soft: #E6F6EC;
  --danger: #D6455A;
  --danger-soft: #FCEAEC;
  --r: 10px;
  --r-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(16,20,35,.04), 0 1px 1px rgba(16,20,35,.03);
  --shadow-md: 0 6px 20px rgba(16,20,35,.06), 0 1px 2px rgba(16,20,35,.04);
  --dept-culture: #5B84FF; --dept-culture-bg: #F0F4FE;
  --dept-library: #48BB78; --dept-library-bg: #F0F9F5;
  --dept-tour: #F6AD55; --dept-tour-bg: #FEF8EE;
  --dept-temp: #9B6BD6; --dept-temp-bg: #F5F0FC;
  --sidebar-bg: rgba(255,255,255,.55);
  --sidebar-text: #1B2036;
  --sidebar-text-muted: #5B6373;
  --sidebar-text-faint: #9AA2B1;
  --sidebar-hover-bg: rgba(16,23,42,.06);
  --sidebar-border: rgba(16,23,42,.09);
  --sidebar-tree-line: rgba(16,23,42,.14);
  --sidebar-accent: #3457D5;
  --page-gap: 16px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 16.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
/* 타이틀/제목 영역은 지마켓 산스, 나머지 본문/메뉴/숫자/테이블은 프리텐다드 */
h1, h2, h3, .eyebrow, .sidebar .brand-logotype, .sidebar .cat-badge,
.team-block h3, .line-hdr h3, .card .name,
.section-heading, .org-tab-name {
  font-family: 'GmarketSans', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
h1 { font-size: 23px; font-weight: 700; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 4px; }

.topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
  background:
    radial-gradient(circle at 10% 20%, rgba(91,141,255,.32), transparent 48%),
    radial-gradient(circle at 90% 90%, rgba(125,166,255,.28), transparent 55%),
    radial-gradient(circle at 55% -20%, rgba(52,211,153,.22), transparent 45%),
    linear-gradient(135deg, #EEF2FC, #FFFFFF);
  border-radius: var(--r-lg); padding: 28px 26px;
  box-shadow: var(--shadow-sm), inset 0 0 0 1px rgba(16,23,42,.05);
  position: relative; overflow: visible;
}
.dept-tabs { display: flex; gap: 6px; }
.dept-btn {
  border: none; border-radius: 999px; padding: 7px 16px; font-size: 15.5px; font-weight: 500; cursor: pointer;
  background: var(--bg-hover); color: var(--text-muted); transition: all .15s;
}
.dept-btn.active.dept-문화예술과 { background: var(--dept-culture-bg); color: var(--dept-culture); font-weight: 700; }
.dept-btn.active.dept-도서관정책과 { background: var(--dept-library-bg); color: var(--dept-library); font-weight: 700; }
.dept-btn.active.dept-관광진흥과 { background: var(--dept-tour-bg); color: var(--dept-tour); font-weight: 700; }

.fund-toggle { display: inline-flex; background: var(--bg-hover); padding: 3px; border-radius: 999px; margin-bottom: 20px; }
.fund-btn { border: none; padding: 7px 22px; font-size: 15.5px; font-weight: 600; cursor: pointer; background: transparent; color: var(--text-muted); border-radius: 999px; transition: all .15s; }
.fund-btn.active { background: var(--navy); color: #fff; box-shadow: var(--shadow-sm); }

.summary-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 20px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.summary-box h3 { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 18px; font-weight: 800; margin: 0 0 14px; color: var(--text); }
.section-heading {
  font-family: 'GmarketSans', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 16px; font-weight: 700; color: var(--text); margin: 4px 0 14px;
}
table.summary { width: 100%; border-collapse: collapse; font-size: 15px; table-layout: auto; }
table.summary th, table.summary td { padding: 7px 6px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; word-break: keep-all; }
table.summary th:first-child, table.summary td:first-child { text-align: center; color: var(--text-muted); font-variant-numeric: normal; white-space: normal; }
table.summary th { color: var(--navy); font-weight: 800; font-size: 13.5px; text-transform: uppercase; letter-spacing: .03em; background: var(--bg-hover); border-bottom: 1.5px solid var(--border-strong); text-align: center; }
table.summary th:first-child { text-align: center; color: var(--navy); }
table.summary tr.total td { font-weight: 700; border-bottom: 1.5px solid var(--border-strong); background: var(--bg-hover); }
table.summary td.diff { text-align: center; white-space: normal; word-break: keep-all; }
table.summary td.diff.up { color: var(--danger); }
table.summary td.diff.down { color: var(--accent); }
.summary-unit-note { font-size: 12.5px; color: var(--text-soft); margin: 8px 0 0; text-align: right; }
.summary-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 14px; }
.summary-title-row h3 { margin: 0; }
.summary-title-row .summary-unit-note { margin: 0; flex-shrink: 0; }
.summary-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: stretch; margin-bottom: 18px; }
.summary-grid .summary-box { margin-bottom: 0; width: 100%; min-width: 0; max-width: none; overflow: hidden; display: flex; flex-direction: column; }
.summary-box-body { flex: 0 1 auto; display: flex; flex-direction: column; justify-content: flex-start; }
.summary-box-body.donut-row { flex-direction: row; align-items: center; justify-content: center; gap: 22px; }
.summary-box-body.donut-row .donut-legend { width: auto; flex: 1 1 auto; max-width: 200px; margin-top: 0; }
.summary-grid .summary-box .table-scroll { width: 100%; overflow-x: auto; }
/* 결산 화면 */
.settle-title-row { padding-bottom: 16px; border-bottom: 2px solid var(--border-strong); margin-bottom: 22px !important; }
.settle-col-label { text-align: left !important; padding-left: 4px !important; }
.settle-col-amt { text-align: right !important; padding-right: 22px !important; }
.settle-col-rate { text-align: center !important; }
.settle-year-tab { border: 1px solid var(--border-strong); background: var(--bg-card); border-radius: 999px; padding: 5px 14px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text-muted); }
.settle-year-tab.selected { background: var(--navy); color: #fff; border-color: var(--navy); }
.settle-year-tab.disabled { cursor: not-allowed; opacity: .45; }
.settle-subheading { font-size: 15px; font-weight: 700; color: var(--navy); margin: 0 0 12px; }
.settle-kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.settle-kpi-grid.ov2-kpi-2col { grid-template-columns: repeat(2, 1fr); gap: 18px; }
.ov2-personnel-row .settle-kpi-grid.ov2-kpi-2col { height: 100%; grid-template-rows: repeat(2, 1fr); margin-bottom: 0; }
.ov2-personnel-row .settle-kpi-grid.ov2-kpi-2col .settle-kpi-card { height: 100%; padding: 16px 18px; }
.ov2-personnel-row .settle-kpi-grid.ov2-kpi-2col .icon-badge,
.ov2-personnel-row .settle-kpi-grid.ov2-kpi-2col .icon-badge svg,
.ov2-personnel-row .settle-kpi-grid.ov2-kpi-2col .icon-badge img { width: 50px; height: 50px; }
.ov2-personnel-row .settle-kpi-grid.ov2-kpi-2col .label { font-size: 16px; }
.ov2-personnel-row .settle-kpi-grid.ov2-kpi-2col .value { font-size: 25px; }
.ov2-personnel-row .settle-kpi-grid.ov2-kpi-2col .sub { font-size: 12.5px; }
.ov2-subhead { font-family: 'GmarketSans', 'Pretendard', sans-serif; font-size: 15px; font-weight: 800; color: var(--text); margin: 0 0 10px; }
.settle-kpi-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-radius: 16px; padding: 11px 14px; position: relative; overflow: hidden; background: #eef0f3; box-shadow: 6px 6px 14px rgba(163,172,196,.34), -6px -6px 14px #ffffff; transition: transform .15s, box-shadow .15s; }
.settle-kpi-card:hover { transform: translateY(-2px); box-shadow: 8px 8px 16px rgba(163,172,196,.38), -8px -8px 16px #ffffff; }
.settle-kpi-card .kpi-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.settle-kpi-card .label { font-size: 13.5px; font-weight: 700; color: var(--text-muted); white-space: nowrap; line-height: 1.3; }
.settle-kpi-card .value { font-size: 20px; font-weight: 800; color: var(--navy); letter-spacing: -0.01em; line-height: 1.25; }
.settle-kpi-card .sub { font-size: 11px; color: var(--text-soft); margin-top: 1px; }
.settle-kpi-card .icon-badge { flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
.settle-kpi-card .icon-badge svg { width: 36px; height: 36px; }
.settle-kpi-card .icon-badge img { width: 36px; height: 36px; }
.settle-kpi-card .icon-badge.icon-shortage svg { color: var(--accent-dark); }
.settle-rate-bar { width: 100%; height: 6px; border-radius: 4px; background: rgba(16,23,42,.10); overflow: hidden; margin-top: 3px; }
.settle-rate-bar .fill { height: 100%; border-radius: 5px; background: var(--accent-dark); }
.section-title-row.settle-section-gap { margin-top: 24px; }
.section-title-row.settle-section-gap-lg { margin-top: 96px; }
.settle-yoy-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--page-gap); margin-bottom: 32px; }
/* 상단 결산총괄 KPI 박스(.settle-kpi-card)와 동일한 뉴모피즘 톤으로 통일. 카드별(총수익/총비용/당기순손익) 색상은 --halo-accent로 고정 지정해 기관이 바뀌어도 항상 동일하게 유지 */
.halo-stat {
  position: relative;
  width: 100%;
  box-sizing: border-box;
  background: #eef0f3;
  box-shadow: 6px 6px 14px rgba(163,172,196,.34), -6px -6px 14px #ffffff;
  border-radius: 16px;
  padding: 9px 18px 8px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  overflow: hidden;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color: var(--navy);
  transition: transform .15s, box-shadow .15s;
}
.halo-stat:hover { transform: translateY(-2px); box-shadow: 8px 8px 16px rgba(163,172,196,.38), -8px -8px 16px #ffffff; }
.halo-stat::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 5px;
  background-color: var(--halo-accent, var(--accent));
}
.halo-stat-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.halo-stat-label { font-size: 19px; font-weight: 800; color: var(--text-muted); }
.halo-stat-value {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-weight: 800; font-size: 1.85rem; letter-spacing: -0.02em; line-height: 1.02;
  font-variant-numeric: tabular-nums; margin: 0; color: var(--navy);
}
.halo-stat-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 0; }
.halo-stat-delta {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; margin-top: 6px;
  background-color: color-mix(in srgb, var(--halo-accent, var(--accent)) 12%, transparent);
  color: var(--halo-accent, var(--accent));
  border-radius: 999px;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 15px; font-weight: 800;
}
.halo-stat-delta svg { width: 13px; height: 13px; }
.halo-stat-delta.down svg { transform: rotate(180deg); }
.halo-stat-spark { width: 34px; height: 34px; flex: none; color: var(--halo-accent, var(--accent)); }
.halo-stat-spark.down { transform: scaleY(-1); }
.halo-stat-sub { font-size: 14px; font-weight: 700; text-align: right; color: var(--text-soft); margin-top: -1px; }
@media (max-width: 980px) { .summary-grid { grid-template-columns: 1fr; } }
.section-heading-lg { font-size: 22px; margin: 0; padding-left: 13px; border-left: 4px solid var(--accent); }
.section-title-row { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; }
.section-title-row .section-heading-lg { margin: 0; }
.section-badge {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 12.5px; font-weight: 800; letter-spacing: .02em; color: var(--accent-dark);
  background: var(--accent-soft); border-radius: 999px; padding: 4px 13px; flex-shrink: 0;
}
.section-title-row .btn-sm { margin-left: auto; }
.download-menu-wrap { margin-left: auto; margin-right: 24px; position: relative; }
.button {
  display: inline-flex; align-items: center; gap: 10px; cursor: pointer; border: none;
  background: #e8e8e8; color: var(--accent-dark);
  border-radius: 12px; padding: 8px 20px 8px 14px;
  font-size: 14px; font-weight: 700; font-family: inherit; letter-spacing: .01em;
  transition: background .2s, color .2s;
}
.button__icon { flex-shrink: 0; width: 20px; height: 20px; transition: transform .25s ease; }
.button__text { position: relative; }
.button:hover { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; }
.button:hover .button__icon { transform: translateY(3px); }
.button:active .button__icon { transform: translateY(5px); }
.download-menu {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 20; min-width: 168px;
  background: #fff; border-radius: 12px; box-shadow: 0 10px 28px rgba(16,23,42,.2), 0 1px 3px rgba(16,23,42,.08);
  overflow: hidden; padding: 6px;
}
.download-menu-item { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; white-space: nowrap; transition: background .12s; }
.download-menu-item:hover { background: var(--bg-hover); }
.dl-icon { font-size: 14px; }
table.fc-summary th { font-size: 13.5px; text-transform: none; letter-spacing: 0; }
table.fc-summary td .dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 4px; margin-right: 6px;
  box-shadow: 0 1px 3px rgba(16,20,35,.25), inset 0 1px 1px rgba(255,255,255,.4);
}

/* 도넛 차트 범례 */
.donut-legend { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; width: 100%; }
.donut-legend .item { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--text-muted); }
.donut-legend .item .name { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.donut-legend .item .chip {
  width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0;
  box-shadow: 0 1px 3px rgba(16,20,35,.25), inset 0 1px 1px rgba(255,255,255,.4);
}
.donut-legend .item .pct { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }

/* 수입총괄 - 비중별 가로 막대 (도넛 대체) */
.ov2-propbar { width: 100%; margin: 4px 0 2px; }
.ov2-propbar-labels { display: flex; align-items: flex-end; margin-bottom: 6px; }
.ov2-propbar-label { display: flex; flex-direction: column; align-items: flex-start; overflow: hidden; padding-right: 6px; box-sizing: border-box; }
.ov2-propbar-label .name { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ov2-propbar-label .pct { font-size: 14.5px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ov2-propbar-track { display: flex; width: 100%; height: 22px; border-radius: 11px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(16,20,35,.12); }
.ov2-propbar-seg { height: 100%; box-shadow: inset 0 1px 1px rgba(255,255,255,.35); }
.ov2-propbar-seg + .ov2-propbar-seg { border-left: 1.5px solid var(--bg-card); }

.chip.personnel, .bg-personnel { background-color: #4C9AFF !important; }
.chip.operating, .bg-operating { background-color: #9E75FF !important; }
.chip.asset, .bg-asset { background-color: #FF7A85 !important; }

/* ===== 기관 현황 화면 v2 (직급별/부서별 정현원, 수입지출총괄, 집행실적, 예산편성현황) ===== */
.ov2-org-sub { font-size: 15px; color: var(--text-muted); font-weight: 600; margin: 0 0 14px; }
.ov2-org-shortage { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--danger); font-weight: 700; margin: 6px 2px 0; }
.ov2-org-shortage .ico { flex: none; line-height: 1; }
.ov2-section-sub { font-size: 18px; color: var(--text-muted); font-weight: 700; margin-left: 4px; }
.ov2-outside-detail { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight: 300; }
.ov2-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 18px; align-items: stretch; }
.ov2-two-col .summary-box { margin-bottom: 0; height: 100%; box-sizing: border-box; }
@media (max-width: 980px) { .ov2-two-col { grid-template-columns: 1fr; } }

.summary-box h3:has(+ .ov2-pbar-list) { margin-bottom: 4px; }
.ov2-pbar-list { display: flex; flex-direction: column; gap: 6px; }
.ov2-pbar-row { display: grid; grid-template-columns: 150px 1fr 44px; align-items: start; gap: 10px; min-height: 34px; position: relative; }
.ov2-pbar-row-hoverable .ov2-pbar-label-main { cursor: pointer; }
.grade-btn {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 50%;
  background: #62abff;
  box-shadow: 0 4px 10px rgba(34,52,142,.28);
  cursor: pointer;
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 5;
  transition: transform .15s ease;
}
.grade-btn:hover { transform: translateY(-50%) scale(1.1); }
.grade-btn-icon { width: 11px; height: 11px; }
.grade-btn-tooltip {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(100% + 10px);
  display: flex;
  align-items: center;
  background: #fff;
  border-radius: 999px;
  padding: 5px 13px;
  box-shadow: 0 10px 24px rgba(16,23,42,.16);
  white-space: nowrap;
  pointer-events: none;
}
.grade-btn-tooltip::after {
  content: "";
  position: absolute;
  left: 50%;

}
.grade-btn-tooltip-label { line-height: 15px; font-size: 11.5px; font-weight: 800; color: #22348E; font-family: 'Pretendard', sans-serif; letter-spacing: .01em; }
.ov2-box-tooltip { display: none; position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 6px; z-index: 40; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 24px rgba(16,23,42,.16); padding: 8px 10px; box-sizing: border-box; overflow: hidden; }
.ov2-pbar-row:has(.grade-btn:hover) .ov2-box-tooltip { display: block; }
.ov2-tt-title { font-size: 11.5px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
.ov2-tt-row { display: flex; justify-content: space-between; gap: 16px; font-size: 12.5px; color: var(--text-muted); padding: 3px 0; }
.ov2-tt-note { font-size: 11px; color: var(--text-soft); margin-top: 6px; }
.ov2-tt-chips { display: flex; flex-wrap: nowrap; gap: 3px; overflow: hidden; }
.ov2-tt-chip { display: flex; flex-direction: column; align-items: center; gap: 1px; background: var(--bg-hover); border-radius: 6px; padding: 3px 2px; flex: 1 1 0; min-width: 0; }
.ov2-tt-chip-label { font-size: 9.5px; font-weight: 700; color: var(--text-muted); white-space: nowrap; }
.ov2-tt-chip-val { font-size: 11px; font-weight: 800; color: var(--text); white-space: nowrap; }
.ov2-pbar-label { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.ov2-pbar-label-line { display: inline-flex; align-items: stretch; height: 24px; border-radius: 6px; overflow: hidden; box-shadow: 3px 3px 8px rgba(16,23,42,.08); width: fit-content; }
.ov2-pbar-label-main { display: flex; align-items: center; padding: 0 10px; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; }
.ov2-pbar-val { display: flex; align-items: center; padding: 0 10px; background: #fff; color: var(--text); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; position: relative; }
.ov2-pbar-val::before { content: ''; position: absolute; left: -4px; top: 50%; width: 8px; height: 8px; background: #fff; transform: translateY(-50%) rotate(45deg); }
.ov2-pbar-label-sub { font-size: 10px; color: var(--text-soft); font-weight: 500; white-space: nowrap; padding-left: 2px; height: 12px; line-height: 12px; }
.ov2-pbar-track-wrap { position: relative; }

.ov2-pbar-row-danger .ov2-pbar-label-main { background: var(--danger); }
.ov2-pbar-row-danger .ov2-pbar-val { color: var(--danger); font-weight: 900; }
.ov2-pbar-diff { font-size: 15px; font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: 2px; line-height: 16px; }
.ov2-pbar-diff.up { color: var(--danger); }
.ov2-pbar-diff.down { color: var(--accent); }
.ov2-pbar-diff.zero { color: var(--text-soft); }
.ov2-pbar-diff.na { color: var(--text-soft); }
.ov2-pbar-divider { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 18px; font-weight: 800; color: var(--text); margin: -4px 0 4px; padding-top: 0; border-top: none; position: relative; top: -2px; }
.ov2-pbar-note { font-size: 12.5px; color: var(--text-soft); margin: 12px 2px 0; }

.ov2-exec-wrap { display: flex; gap: 22px; align-items: flex-end; }
.ov2-exec-chart { flex: 1 1 auto; display: flex; justify-content: space-around; align-items: flex-end; height: 190px; padding-top: 22px; border-bottom: 1px solid var(--border); }
.ov2-exec-group { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.ov2-exec-bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; }
.ov2-exec-bar { width: 26px; border-radius: 6px 6px 0 0; position: relative; display: flex; justify-content: center; }
.ov2-exec-bar.prev { background: #C9CEDA; }

.ov2-exec-bar.curr.na .ov2-exec-bar-val { color: var(--text-soft); }
.ov2-exec-bar-val { position: absolute; top: -20px; font-size: 12px; font-weight: 800; color: var(--text-muted); white-space: nowrap; }
.ov2-exec-bar.curr .ov2-exec-bar-val { color: var(--accent-dark); }
.ov2-exec-label { font-size: 13.5px; font-weight: 700; color: var(--text); }
.ov2-exec-legend { display: flex; gap: 16px; justify-content: center; margin: 14px 0 0; font-size: 12.5px; color: var(--text-muted); }
.ov2-exec-legend .item { display: flex; align-items: center; gap: 5px; }

.ov2-kpi-title-amt { font-size: 16px; font-weight: 700; color: var(--text-muted); margin-left: 8px; }
.ov2-kpi-title-amt .diff { font-weight: 800; }
.ov2-kpi-title-amt .diff.up { color: var(--danger); }
.ov2-kpi-title-amt .diff.down { color: var(--accent); }
table.summary.ov2-budget-fmt tr.total td { font-weight: 800; }
table.summary.ov2-bc-table td.ov2-bc-total, table.summary.ov2-bc-table th:last-child { background: var(--bg-hover); font-weight: 800; }
table.summary.ov2-bc-table td.ov2-bc-total:not(.diff) { color: var(--navy); }
table.summary.ov2-bc-table th { white-space: normal; line-height: 1.4; text-align: right; padding-right: 6px; }
table.summary.ov2-bc-table th:first-child { text-align: center; padding-left: 6px; }
/* 예산편성현황 - 헤더 텍스트 길이가 항목마다 달라 열 폭이 들쭉날쭉해지고 그 아래 숫자들이 서로 안 맞아 보이던 것을,
   고정 레이아웃 + 균등한 열 폭으로 맞춘다(모든 기관 공통). 헤더는 폭에 안 맞으면 두 줄로 줄바꿈되게 허용한다. */
table.summary.ov2-bc-table { table-layout: fixed; }
table.summary.ov2-bc-table th:first-child, table.summary.ov2-bc-table td:first-child { width: 100px; }
.ov2-bc-hdiff { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: normal; white-space: nowrap; }
.ov2-bc-hdiff.up { color: var(--danger); }
.ov2-bc-hdiff.down { color: var(--accent); }
table.summary tr.ov2-eb-section td { font-weight: 800; background: var(--accent-soft); color: var(--accent-dark); }
table.summary tr.ov2-eb-row td:first-child { padding-left: 22px; color: var(--text-muted); font-weight: 400; }
table.summary tr.ov2-eb-row td { font-size: 13.5px; padding-top: 2px; padding-bottom: 2px; line-height: 1.15; }
table.summary.ov2-expense-table { table-layout: fixed; }
table.summary.ov2-expense-table th:first-child, table.summary.ov2-expense-table td:first-child { text-align: left; width: 19%; word-break: break-all; white-space: normal; padding-right: 2px; }
table.summary.ov2-expense-table.ov2-inst-corp th:first-child, table.summary.ov2-expense-table.ov2-inst-corp td:first-child { width: 33%; }
table.summary.ov2-expense-table.ov2-inst-corp tr.ov2-eb-row td:first-child { font-size: 11.5px; white-space: nowrap; padding-left: 18px; }
table.summary.ov2-expense-table.ov2-inst-corp th, table.summary.ov2-expense-table.ov2-inst-corp td { font-size: 12.5px; padding-left: 4px; padding-right: 4px; }
.ov2-two-col.ov2-inst-sports { grid-template-columns: 0.8fr 1.2fr; }
table.summary.ov2-inst-sports th:first-child, table.summary.ov2-inst-sports td:first-child { width: 46%; text-align: left; }
table.summary.ov2-inst-sports th:not(:first-child), table.summary.ov2-inst-sports td:not(:first-child) { text-align: right; padding-right: 16px; }
table.summary.ov2-rev-total-table.ov2-inst-sports th:last-child, table.summary.ov2-rev-total-table.ov2-inst-sports td:last-child { width: auto; padding-right: 16px; }
.ov2-eb-footnote { font-size: 14.5px; font-weight: 700; color: var(--text-muted); margin: 10px 2px 0; }
table.summary.ov2-income-table th { font-size: 16px; }
table.summary.ov2-income-table td { font-size: 14.5px; }
table.summary.ov2-income-table th, table.summary.ov2-income-table td { padding-top: 5px; padding-bottom: 5px; }
table.summary.ov2-rev-total-table { table-layout: fixed; }
table.summary.ov2-rev-total-table th, table.summary.ov2-rev-total-table td { text-align: center; padding-top: 5px; padding-bottom: 5px; padding-left: 6px; padding-right: 6px; letter-spacing: .01em; }
table.summary.ov2-rev-total-table th:first-child, table.summary.ov2-rev-total-table td:first-child { text-align: center; width: 22%; white-space: nowrap; font-size: 13.5px; }
table.summary.ov2-rev-total-table th:nth-child(2), table.summary.ov2-rev-total-table td:nth-child(2),
table.summary.ov2-rev-total-table th:nth-child(3), table.summary.ov2-rev-total-table td:nth-child(3) { width: 23%; }
table.summary.ov2-rev-total-table th:last-child, table.summary.ov2-rev-total-table td:last-child { width: 32%; padding-right: 10px; }
table.summary.ov2-rev-total-table td.diff { white-space: nowrap; font-size: 13px; }
tr.ov2-rev-group-row td { background: var(--bg-hover); color: var(--navy); font-weight: 800; font-size: 13px; letter-spacing: .01em; padding-top: 4px !important; padding-bottom: 4px !important; border-bottom: 1.5px solid var(--border-strong); }
tr.ov2-rev-group-row td:first-child { text-align: left !important; }
.ov2-rev-detail-sub { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--border-strong); }
.ov2-rev-detail-sub h4 { margin: 0 0 8px; font-size: 14.5px; font-weight: 800; color: var(--navy); }
.ov2-rev-marker {
  background: linear-gradient(transparent 38%, #ffd400 38%, #ffd400 92%, transparent 92%);
  padding: 0 4px;
  font-weight: 800;
  color: var(--navy);
}
.ov2-rev-sub-label { font-size: 11.5px; color: var(--text-soft); font-weight: 400; }
table.summary.ov2-rev-total-table.ov2-inst-corp th, table.summary.ov2-rev-total-table.ov2-inst-corp td { padding-left: 2px; padding-right: 14px; }
table.summary.ov2-rev-total-table.ov2-inst-corp th:first-child, table.summary.ov2-rev-total-table.ov2-inst-corp td:first-child { width: 20%; padding-right: 6px; }
.ov2-unit-note { font-size: 12px; font-weight: 400; color: var(--text-soft); text-align: right; margin: 0 2px 4px; }
.ov2-subtable-title { font-size: 14.5px; font-weight: 700; color: var(--text); margin: 18px 2px 8px; }

.ov2-dept-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.ov2-dept-card { position: relative; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; box-shadow: 0 -6px 0 0 #3457D5, 0 2px 8px rgba(16,23,42,.06); cursor: pointer; overflow: hidden; transition: transform .25s, box-shadow .25s; }
.ov2-dept-card:hover { transform: translateY(3px); }
.ov2-dept-card .dept-name { font-family: 'GmarketSans', 'Pretendard', sans-serif; font-weight: 700; font-size: 16px; line-height: 1.3; color: var(--text); margin: 0 0 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov2-dept-card .dept-row { display: flex; align-items: baseline; gap: 6px; margin-top: 0; line-height: 1.3; }
.ov2-dept-card .dept-val { font-size: 15px; color: var(--text-soft); font-weight: 800; margin: 0; font-variant-numeric: tabular-nums; }
.ov2-dept-card .dept-diff { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ov2-dept-card .dept-diff.up { color: var(--danger); }
.ov2-dept-card .dept-diff.down { color: var(--accent); }

.ov2-dept-card .dept-diff.na { color: var(--text-soft); }
.ov2-dept-card .dept-badge { position: absolute; top: 8px; right: 10px; font-size: 11px; font-weight: 800; color: #5B6472; background: var(--bg-hover); padding: 3px 8px; border-radius: 20px; line-height: 1.2; white-space: nowrap; }
.ov2-dept-card .dept-subteams {
  max-height: 0; opacity: 0; margin-top: 0; padding-top: 0; overflow: hidden;
  border-top: 1px dashed transparent;
  font-size: 11.5px; line-height: 1.5; color: var(--text-muted); white-space: normal; word-break: keep-all;
  transition: max-height .3s ease, opacity .25s ease, margin-top .3s ease, padding-top .3s ease, border-color .3s ease;
}
.ov2-dept-card:hover .dept-subteams {
  max-height: 300px; opacity: 1; margin-top: 6px; padding-top: 6px;
  border-top-color: var(--border);
}

/* 조직별 예산 가로 탭 - Uiverse(Spacious74) radio-inputs 폴더탭 구조를 그대로 이식 */
.org-tabs {
  position: relative;
  display: flex; flex-wrap: nowrap; overflow-x: auto; overflow-y: visible;
  background-color: rgba(214,226,252,0.6); box-sizing: border-box;
  padding: 10px 10px 0 10px; margin-bottom: 0;
  border-radius: 8px 8px 0 0;
  scrollbar-width: none;
}
.org-tabs::-webkit-scrollbar { display: none; }
.tab-scroll-btn {
  position: absolute; top: 0; bottom: 0; width: 30px; z-index: 2;
  border: none; cursor: pointer;
  display: flex; align-items: center;
  font-size: 20px; font-weight: 800; color: rgba(16,23,42,.55);
}
.tab-scroll-btn:hover { color: var(--text); }
.tab-scroll-btn.right { right: 0; justify-content: flex-end; padding-right: 10px; background: linear-gradient(to right, transparent, rgba(214,226,252,0.6) 55%); }
.tab-scroll-btn.left { left: 0; justify-content: flex-start; padding-left: 10px; background: linear-gradient(to left, transparent, rgba(214,226,252,0.6) 55%); }
.org-tab {
  position: relative; border: none;
  border-top-left-radius: 8px; border-top-right-radius: 8px;
  padding: 12px 20px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; cursor: pointer; font-family: inherit; text-align: center;
  transition: all .15s ease-in-out; color: rgba(16,23,42,.75); font-weight: 500;
  flex-shrink: 0; white-space: nowrap;
}
.org-tab:hover { color: var(--navy); }
.org-tab.selected { background-color: #fff; color: var(--navy); font-weight: 600; }
.org-tab.selected:hover { color: #1d1d29; }
.org-tab.selected::after, .org-tab.selected::before {
  content: ""; position: absolute; width: 10px; height: 10px;
  background-color: rgba(214,226,252,0.6); bottom: 0;
}
.org-tab.selected::after { right: -10px; border-bottom-left-radius: 300px; box-shadow: -3px 3px 0 3px #fff; }
.org-tab.selected::before { left: -10px; border-bottom-right-radius: 300px; box-shadow: 3px 3px 0 3px #fff; }
.org-tab .org-tab-name { font-size: 15px; font-weight: 600; letter-spacing: .01em; color: inherit; white-space: nowrap; }
.org-tab.selected .org-tab-name { font-weight: 700; }

/* 정현원 뱃지 - 부서/사업 탭 바로 아래(간격 좁게), 선택된 탭 위치를 따라 좌우로 이동 (JS: alignHeadcountBadge). 선택 전에는 숨김 */
.tab-headcount-badge-row { display: none; justify-content: flex-start; margin: 4px 0 8px; }
.tab-headcount-badge { flex-shrink: 0; position: relative; transition: margin-left .15s ease; }
.headcount-summary {
  display: inline-flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; color: var(--text-muted);
  background: var(--bg-hover); border-radius: var(--r);
  border-left: 3px solid var(--accent-soft);
  padding: 6px 12px; margin: 0; white-space: nowrap; cursor: default;
}
.headcount-info-icon {
  display: inline-flex; color: var(--accent); flex-shrink: 0; cursor: pointer;
  transition: transform .5s ease-in-out;
}
.headcount-info-icon svg { width: 14px; height: 14px; }
.tab-headcount-badge:has(.headcount-summary:hover) .headcount-info-icon { transform: rotate(360deg) scale(1.2); }
.headcount-detail-pop {
  visibility: visible; opacity: 1; position: absolute; left: 100%; top: 50%;
  transform: translateY(calc(-50% + 24px)); margin-left: 8px; z-index: 5;
  background: color-mix(in srgb, var(--accent-soft) 65%, transparent); border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 14px; font-size: 13.5px; font-weight: 500; color: var(--text-muted);
  white-space: normal; width: 560px; line-height: 1.5;
}
.headcount-detail-pop::after {
  content: ""; position: absolute; right: 100%; top: 50%; margin-top: -5px;
  border-width: 5px; border-style: solid; border-color: transparent var(--accent-soft) transparent transparent;
}
/* 뱃지가 화면 오른쪽 끝에 가까운 탭(도서관 목록 등)에 있을 때는 풍선이 오른쪽으로 넘쳐 잘리므로
   JS(updateHeadcountPopDirection)가 화면 밖으로 나갈 것 같으면 이 클래스를 붙여 왼쪽으로 뜨게 한다. */
.headcount-detail-pop.pop-left {
  left: auto; right: 100%;
  transform: translateY(-50%); margin-left: 0; margin-right: 8px;
}
.headcount-detail-pop.pop-left::after {
  right: auto; left: 100%;
  border-color: transparent transparent transparent var(--accent-soft);
}

/* 회차 탭(본예산~3회추경) - 부서/사업 탭 줄 바로 위, 첫 번째 탭 자리에 고정. Upload/Download는 같은 줄 오른쪽 끝 */
.round-tabs-row { display: none; align-items: center; margin: 0 0 10px; }

/* 연도 선택 - 회차탭(본예산~3회추경)과 같은 네이비 바 안 첫 세그먼트. 회차탭 라벨과 구분되도록 글자색/배경을 다르게 줌 */
.year-select-wrap { position: relative; flex-shrink: 0; }
.year-select-btn {
  display: flex; align-items: center; gap: 6px; height: 100%; padding: 7px 12px;
  border: none; border-radius: 6px; background: rgba(255,255,255,.08); color: #fff;
  font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap;
  transition: background-color .15s ease;
}
.year-select-btn:hover, .year-select-wrap.open .year-select-btn { background: rgba(255,255,255,.22); }
.year-select-caret { width: 14px; height: 14px; flex-shrink: 0; color: var(--accent-soft); transition: transform .15s ease; }
.year-select-wrap.open .year-select-caret { transform: rotate(180deg); }
.year-select-menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 96px;
  background: #fff; border-radius: 10px; box-shadow: 0 10px 28px rgba(16,23,42,.2), 0 1px 3px rgba(16,23,42,.08);
  overflow: hidden; padding: 6px;
}
.year-select-item { padding: 8px 12px; border-radius: 7px; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; }
.year-select-item:hover { background: var(--bg-hover); }
.year-select-item.selected { color: var(--accent); font-weight: 800; }
.year-select-divider { width: 1px; align-self: stretch; margin: 6px 2px; background: rgba(255,255,255,.18); flex-shrink: 0; }

/* Upload/Download 아이콘+텍스트 필 - 옆 본예산 바(회차 탭)와 세로 높이(44px) 통일, 호버 시 확대+파란색 강조 */
.io-btn-group {
  display: flex; align-items: center; flex-shrink: 0; height: 44px; margin-left: auto; margin-right: 24px;
  border: 1px solid var(--border); border-radius: 14px;
  background: #fff; box-shadow: var(--shadow-sm); overflow: visible;
}
.io-btn:first-child { border-radius: 14px 0 0 14px; }
.io-btn-group .download-menu-wrap:last-child .io-btn { border-radius: 0 14px 14px 0; }
.io-btn {
  display: flex; align-items: center; justify-content: center; gap: 7px; flex-shrink: 0;
  height: 100%; padding: 0 16px; border: none; background: transparent; cursor: pointer;
  color: var(--text-muted); font-size: 14px; font-weight: 700; font-family: inherit; white-space: nowrap;
  transition: color .2s ease, background-color .2s ease;
}
.io-btn svg { width: 18px; height: 18px; flex-shrink: 0; transition: transform .2s ease; }
.io-btn:hover { color: var(--accent); background: var(--bg-hover); }
.io-btn:hover svg { transform: scale(1.15); }
.io-btn-divider { width: 1px; align-self: stretch; margin: 8px 0; background: var(--border); flex-shrink: 0; }
.io-btn-group .download-menu-wrap { margin: 0; height: 100%; position: relative; flex-shrink: 0; }

/* 회차 탭 (본예산/추경) - 뼈대만, 스크롤 없이 한 줄 고정 */
/* 회차 탭 (본예산/추경) - Uiverse 글라이더(glider) radio-input 스타일, 4개 옵션 기준 */
#round-tabs.radio-input {
  --container_width: 360px;
  position: relative;
  top: -2px;
  display: flex;
  align-items: center;
  flex-shrink: 0;
  border-radius: 9px;
  background-color: var(--navy);
  color: #fff;
  width: var(--container_width);
  overflow: visible;
  border: none;
  padding: 4px;
  gap: 2px;
}
#round-tabs.radio-input input { display: none; }
#round-tabs.radio-input label {
  width: 100%; padding: 7px 2px; cursor: pointer;
  position: relative;
  display: flex; justify-content: center; align-items: center;
  z-index: 1; font-weight: 700; letter-spacing: -.4px; font-size: 14px;
  white-space: nowrap; color: #C7D8FF;
  border-radius: 6px;
  transition: color .15s ease, background-color .15s ease;
}
#round-tabs.radio-input label::before {
  content: ""; position: absolute; top: 15%; left: 0; width: 3px; height: 70%;
  background-color: var(--accent); border-radius: 3px; opacity: 0;
  transition: opacity .15s ease;
}
#round-tabs.radio-input label:has(input:checked) {
  color: #fff; background-color: rgba(255,255,255,.16);
}
#round-tabs.radio-input label:has(input:checked)::before { opacity: 1; }

/* 조직 상세 확장 영역 (정원현원 총괄 + 세부사업) */


/* 소관부서 총액 카드 (Uiverse neumorphic 카드 참고, 사이트 블루 톤 적용) */
.dept-stat-card {
  position: relative;
  overflow: visible;
  padding: 0;
  zoom: 0.72;
  background-color: #ffffff;
  box-shadow:
    -3px -3px 8px rgba(255,255,255,.7),
    5px 5px 12px rgba(163,177,198,.35),
    inset -3px -3px 8px rgba(255,255,255,.7),
    inset 5px 5px 12px rgba(163,177,198,.25);
  min-width: 280px;
  border-radius: 16px;
  display: flex; flex-direction: column; gap: 0;
}
/* 카드 배경의 블롭: 색상 제거 */
.dept-stat-blob {
  position: absolute; z-index: 1; top: 50%; left: 50%;
  width: 7rem; height: 7rem; border-radius: 50%;
  background-color: transparent;
  opacity: 0;
  filter: blur(18px);
  transform: translate(-100%, -100%);
}
.dept-stat-content {
  position: relative; z-index: 2;
  background: rgba(255,255,255,.62);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 12px;
  margin: 3px;
  padding: 0.65rem 0.75rem;
  display: flex; flex-direction: column; gap: 0;
}
.dept-stat-title { display: flex; align-items: center; }
.dept-stat-icon {
  position: relative;
  padding: 0;
  background-color: var(--accent);
  box-shadow: -2px -2px 4px rgba(255,255,255,1), 3px 3px 6px rgba(163,177,198,.5);
  width: 2rem; height: 2rem; border-radius: 9999px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  color: #fff; font-size: 15px; font-weight: 800; line-height: 1; text-align: center;
}
/* 소관부서 카드 - 연도별 예산 요약을 왼쪽으로 펼치는 토글 버튼 (왼쪽 화살표, 눌리는 부분임을 색으로 표시) */
.dept-yearly-toggle {
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
  background: var(--accent-soft); color: var(--accent);
  transition: background-color .15s ease, color .15s ease, transform .15s ease;
}
.dept-yearly-toggle:hover { background: var(--accent); color: #fff; transform: scale(1.08); }
.dept-yearly-toggle input { display: none; }
.dept-yearly-toggle svg { width: 15px; height: 15px; }
.dept-yearly-toggle:has(input:checked) { background: var(--accent); color: #fff; }
.dept-stat-title-text {
  margin: 0; color: var(--navy); font-size: 23px; font-weight: 700; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2;
  font-family: 'GmarketSans', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
.dept-stat-percent { margin: 0 0 0 0.3rem; color: var(--danger); font-weight: 800; font-size: 22px; display: flex; align-items: center; gap: 2px; white-space: nowrap; flex-shrink: 0; line-height: 1; }
.dept-stat-percent svg { width: 1.2rem; height: 1.2rem; flex-shrink: 0; }
.dept-stat-percent.down { color: var(--accent); }
.dept-stat-percent.down svg { transform: rotate(180deg); }
.dept-stat-data { display: flex; flex-direction: column; justify-content: flex-start; margin-top: 0.05rem; margin-left: 0; }
.dept-stat-amt-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dept-stat-value {
  margin-top: 0; margin-bottom: 0.2rem; color: var(--text); font-size: 23px; line-height: 1.2; font-weight: 700; text-align: right; flex: 1;
  font-family: 'GmarketSans', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
.dept-stat-range {
  position: relative; background-color: transparent;
  box-shadow: none;
  width: 60%; margin-left: auto; height: 4px; border-radius: 2px;
}
.dept-stat-fill { position: absolute; top: 0; left: 0; background-color: var(--accent); width: 0%; height: 100%; border-radius: 2px; }
/* 소관부서 카드 아이콘을 누르면 카드 왼쪽으로 뜨는 가로 막대 - 2025/2026/1~3회 편성액 요약.
   부모 .dept-stat-card가 zoom:0.72라 그대로 두면 글씨가 실제보다 작게 렌더링되므로, 여기서 역보정한다. */
/* 표를 펼쳤을 때(더보기) 뒤쪽 페이지 내용과 겹쳐 지저분해 보이는 걸 막는 반투명 배경 - 팝업보다 z-index를 한 단계 낮게 둔다. */
/* 클릭은 그대로 아래(다른 탭 등)로 통과시키고, 시각적으로만 살짝 어둡게 - 상시 노출 창이라 다른 탭을 눌러도 안 닫혀야 한다. */
.dept-yearly-backdrop { display: none; position: fixed; inset: 0; z-index: 14; background: transparent; pointer-events: none; }
.dept-stat-yearly-panel {
  /* 세로 중앙 정렬(top:50%)이었으나, 표가 커지면 위쪽이 화면 밖으로 밀려 잘리는 문제가 있어
     아이콘 위쪽에 맞춰 아래로만 펼쳐지도록 기준을 바꿨다. */
  display: none; position: absolute; top: -6px; right: 100%;
  margin-right: 12px; z-index: 15; zoom: 1.389;
  background: #fff; border: 1.5px solid var(--navy); border-radius: 12px;
  box-shadow: 0 10px 28px rgba(16,23,42,.16), 0 1px 3px rgba(16,23,42,.08);
  padding: 9px 14px; white-space: nowrap;
  max-height: calc(100vh - 40px); overflow-y: auto;
}
/* "더보기" 버튼이 있는 위탁금 표 변형만 살짝 위로 — 더보기 없는 단순 스트립형은 그대로 둔다 */
.dept-stat-yearly-panel:has(.dyt-more-btn) { top: -26px; }
.dept-yearly-strip { display: flex; align-items: stretch; gap: 14px; }
.dept-yearly-item { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
.dept-yearly-item + .dept-yearly-item { padding-left: 14px; border-left: 1px solid var(--border); }
.dept-yearly-item .dy-label { font-size: 11.5px; font-weight: 700; color: var(--text-soft); white-space: nowrap; }
.dept-yearly-item .dy-amt { font-size: 13.5px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dept-yearly-item.no-data .dy-amt { color: var(--text-soft); font-weight: 500; }
/* 사업(카드)별로 나눠 편성하는 부서용 - 회차 라벨(2026/1회/2회/3회)을 헤더 한 번만 쓰고, 그 아래 사업명별로 행을 쌓는 표 형태 */
.dept-yearly-table { display: flex; flex-direction: column; gap: 4px; }
.dyt-row { display: grid; grid-template-columns: minmax(90px, auto) repeat(5, minmax(70px, 1fr)); align-items: center; gap: 10px; }
.dyt-row.dyt-head { padding-bottom: 5px; border-bottom: 1px solid var(--border); margin-bottom: 2px; }
.dyt-row.dyt-head .dyt-cell { font-size: 11px; font-weight: 700; color: var(--text-soft); text-align: center; }
.dyt-cell { font-size: 13.5px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; }
.dyt-cell.no-data { color: var(--text-soft); font-weight: 500; }
.dyt-cell.dyt-name-col { text-align: center; font-weight: 800; color: var(--accent-dark); font-size: 12.5px; }

/* 위탁금도 이제 출연금과 같은 플로팅 팝업(dept-yearly-table)을 쓴다. 사업(부기명)이 많은 부서는 헤더+합계 행만
   기본으로 보여준다 - 합계도 표와 똑같은 dyt-row 그리드라 세부 행을 펼쳐도 열이 그대로 맞는다. */
.dyt-row.child .dyt-cell.dyt-name-col { font-weight: 600; color: var(--text-muted); padding-left: 14px; }
.dyt-row.dyt-total .dyt-cell { font-weight: 800; color: var(--accent-dark); }
.dyt-row.dyt-total { padding-top: 3px; border-top: 1px solid var(--border); }
.dyt-more-btn {
  display: block; width: 100%; margin-top: 6px; padding: 4px 0; text-align: center;
  font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-soft);
  border: none; border-radius: 7px; cursor: pointer;
}
.dyt-more-btn:hover { background: var(--accent); color: #fff; }
.dept-yearly-table.expanded { max-height: 55vh; overflow-y: auto; }

.dept-select { position: relative; }

.dept-select-btn {
  display: inline-flex; align-items: center; gap: 12px; min-height: 72px; box-sizing: border-box;
  background: #fff; border: 1px solid var(--border-strong); border-radius: 999px;
  padding: 12px 24px 12px 10px; cursor: pointer; box-shadow: var(--shadow-sm);
  font-family: inherit; font-size: 21px; font-weight: 700; color: var(--text);
}
.dept-select-btn:hover { background: var(--bg-hover); }
.dept-select-btn.dept-select-static { cursor: default; }
.dept-select-btn.dept-select-static:hover { background: #fff; }
.dept-select-icon {
  width: 38px; height: 38px; border-radius: 50%; background: var(--accent);
  color: #fff; font-size: 19px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.dept-select-caret { font-size: 12.5px; color: var(--text-soft); }
.dept-select-menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
  background: #fff; border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-md);
  min-width: 200px; padding: 6px; }
.dept-select-menu.open { display: block; }
.dept-select-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
  cursor: pointer; font-size: 16px; color: var(--text-muted);
}
.dept-select-item:hover { background: var(--bg-hover); }
.dept-select-item.active { background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; }
.dept-select-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

.fund-bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.fund-bar-row { display: grid; grid-template-columns: 92px 1fr 150px; align-items: center; gap: 12px; }
.fund-bar-label { font-size: 15px; font-weight: 600; color: var(--text-muted); }
.fund-bar-track { height: 10px; background: var(--bg-hover); border-radius: 999px; overflow: hidden; }
.fund-bar-fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
.fund-bar-val { font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.fund-bar-pct { font-weight: 500; color: var(--text-soft); margin-left: 4px; }

.team-block { margin-bottom: 24px; }
.team-block h3 { font-size: 17px; font-weight: 700; margin: 0 0 10px; }
.tree-scroll { overflow-x: auto; border-radius: var(--r-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
table.tree { border-collapse: collapse; font-size: 15.5px; table-layout: fixed; width: 100%; }
table.tree th { position: relative; padding: 10px 8px; text-align: center; font-weight: 800; font-size: 17px; letter-spacing: .02em; color: var(--navy); background: var(--bg-hover); border-bottom: 1.5px solid var(--border-strong); border-right: 1px solid var(--border); }
table.tree td { padding: 7px 8px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); vertical-align: middle; word-break: break-word; }
table.tree tr:last-child td { border-bottom: none; }
table.tree td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.tree td.num:last-child { text-align: center; }
table.tree td.num.pct { text-align: center; }
table.tree td[contenteditable="true"] { cursor: text; border-radius: 4px; position: relative; }
table.tree td[contenteditable="true"]:hover { background: rgba(52,87,213,.06); box-shadow: inset 0 0 0 1px rgba(52,87,213,.2); }
table.tree td[contenteditable="true"]:focus { background: #fff; outline: none; box-shadow: inset 0 0 0 1.5px var(--accent); }
table.tree td.basis { color: var(--text-muted); font-size: 14.5px; text-align: left; white-space: pre-line; }
/* 편집 중인 셀 모서리에 나타나는 저장 확인 핀 아이콘 - 체크하면(저장 트리거) 파랗게 채워짐 */
table.tree td[contenteditable="true"] .cell-check-btn {
  display: none; position: absolute; top: -9px; right: -7px; width: 22px; height: 22px;
  align-items: center; justify-content: center; cursor: pointer; z-index: 5;
  border-radius: 8px; background: #fff; box-shadow: 0 1px 4px rgba(16,23,42,.25);
}
table.tree td[contenteditable="true"].cell-touched .cell-check-btn { display: flex; }
table.tree td[contenteditable="true"] .cell-check-btn input { display: none; }
table.tree td[contenteditable="true"] .cell-check-btn .pin {
  width: 11px; height: auto; transform: rotate(35deg); fill: none; stroke: var(--text-soft);
  transition: transform .15s ease, stroke .15s ease, fill .15s ease;
}
table.tree td[contenteditable="true"] .cell-check-btn .pin line,
table.tree td[contenteditable="true"] .cell-check-btn .pin path { stroke: inherit; }
table.tree td[contenteditable="true"] .cell-check-btn:hover .pin { transform: rotate(35deg) scale(1.15); stroke: var(--accent); }
table.tree td[contenteditable="true"] .cell-check-btn input:checked ~ .pin { fill: var(--accent); stroke: var(--accent); }
table.tree td[contenteditable="true"] .cell-check-btn input:checked ~ .pin path { stroke: #fff; }
table.tree tr.row-edited td { background: var(--success-soft); }
table.tree tr.row-edited td[contenteditable="true"]:hover { background: rgba(22,146,79,.12); box-shadow: inset 0 0 0 1px rgba(22,146,79,.3); }
table.tree tr.row-edited td:first-child::after { content: '\C218\C815\B428'; margin-left: 6px; font-size: 11px; font-weight: 700; color: var(--success); background: #fff; border: 1px solid var(--success); border-radius: 20px; padding: 1px 7px; vertical-align: middle; }
/* 엑셀 업로드 미리보기 모달 */
.upload-modal-overlay { position: fixed; inset: 0; background: rgba(16,23,42,.45); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; }
.upload-modal { background: #fff; border-radius: 16px; width: min(920px, 100%); max-height: 84vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(16,23,42,.35); overflow: hidden; }
.upload-modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid #eee; }
.upload-modal-head h3 { margin: 0; font-size: 17px; font-weight: 800; color: var(--text); }
.upload-modal-head .um-sub { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
.upload-modal-close { cursor: pointer; border: none; background: var(--bg-hover); width: 30px; height: 30px; border-radius: 50%; font-size: 16px; color: var(--text-muted); line-height: 1; }
.upload-modal-body { padding: 18px 22px; overflow: auto; }
.upload-modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid #eee; background: var(--bg-hover); }
.um-btn { border: none; border-radius: 10px; padding: 9px 18px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
.um-btn.cancel { background: #fff; color: var(--text-muted); box-shadow: inset 0 0 0 1px #ddd; }
.um-btn.confirm { background: var(--accent); color: #fff; }
.um-btn.confirm:disabled { background: #ccc; cursor: not-allowed; }
table.um-preview { width: 100%; border-collapse: collapse; font-size: 13px; }
table.um-preview th { background: var(--accent-soft); color: var(--accent-dark); text-align: left; padding: 7px 9px; white-space: nowrap; position: sticky; top: 0; }
table.um-preview td { padding: 6px 9px; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
.um-notice { background: var(--accent-soft); color: var(--accent-dark); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
table.tree td.num.basis { text-align: left !important; white-space: pre-line !important; overflow-wrap: break-word; word-break: break-word; }
tr.lvl-팀 td { font-weight: 700; font-size: 16px; border-top: 1px solid var(--border); }
tr.lvl-팀 td:first-child { color: var(--accent); }
tr.lvl-합계 td { font-weight: 800; font-size: 17px; background: #D7DEF5; color: var(--navy); border-top: 1.5px solid #A9B7E0; }
tr.lvl-합계 td.basis, tr.lvl-합계 td.num { color: var(--navy); }
tr.lvl-합계 td:first-child { text-align: center; }
tr.lvl-정책 td { font-weight: 700; }
tr.lvl-단위 td { font-weight: 600; }
tr.lvl-세부 td { font-weight: 500; color: var(--text-muted); }
/* 민간사업보조(자체 개최 행사 등 5개 카테고리 카드) 트리에서만 세부사업명 셀에 옅은 주황색 배경을 준다. */
.private-biz-category-tree tr.lvl-세부 td:first-child { background: color-mix(in srgb, #F97316 12%, transparent); }
tr.lvl-목 td { font-weight: 700; }
tr.lvl-세목 td { font-weight: 500; }
tr.lvl-□ td { color: var(--text); font-size: 15.5px; }
tr.lvl-○ td, tr.lvl-• td { color: var(--text-muted); font-size: 15.5px; }
tr.lvl-leaf td { color: var(--text-muted); font-size: 15.5px; }
tr.row-hidden-collapse, tr.mok-hidden { display: none; }
.tgl { cursor: pointer; display: inline-block; width: 14px; color: var(--text-soft); user-select: none; }
.tgl:hover { color: var(--accent); }

/* ---- app shell / sidebar ---- */
.app {
  display: flex; align-items: flex-start; gap: var(--page-gap);
  min-height: 100vh; padding: var(--page-gap); box-sizing: border-box;
}
.sidebar-stack {
  width: 240px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 14px;
  position: sticky; top: var(--page-gap);
  max-height: calc(100vh - (var(--page-gap) * 2));
  z-index: 5;
}
.sidebar {
  width: 100%; flex-shrink: 0; background: var(--sidebar-bg);
  backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
  padding: 20px 14px; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none;
  border-radius: var(--r-lg);
  border: 1px solid var(--sidebar-border);
  box-shadow: 0 12px 32px rgba(4,7,16,.12), 0 2px 8px rgba(4,7,16,.08), inset 0 1px 0 rgba(255,255,255,.7);
  min-height: 0;
}
.sidebar::-webkit-scrollbar { display: none; }

/* 사이드바 카드 아래에 별도로 붙는 인건비 계산기 버튼 — 예산/결산 카테고리 배지와 동일한 톤 */
.labor-box.people-card {
  position: relative; z-index: 0; overflow: hidden;
  display: flex; align-items: center; gap: 11px;
  width: 100%; flex-shrink: 0;
  background: #262626;
  border: 1px solid rgba(255,255,255,.14); border-radius: var(--r-lg);
  padding: 13px 14px;
  cursor: pointer; text-align: left;
  transition: border-color .5s ease;
}
/* 우상단 보라 글로우 블롭 */
.labor-box.people-card::before {
  content: ''; position: absolute; z-index: 1;
  top: 4px; right: 4px; width: 48px; height: 48px;
  background: #8b5cf6; border-radius: 50%; filter: blur(16px);
  transition: top .5s, right .5s, bottom .5s, filter .5s, box-shadow .5s;
}
/* 우측 로즈 글로우 블롭 */
.labor-box.people-card::after {
  content: ''; position: absolute; z-index: 1;
  top: 12px; right: 32px; width: 80px; height: 80px;
  background: #fda4af; border-radius: 50%; filter: blur(16px);
  transition: right .5s;
}
.labor-box.people-card:hover {
  border-color: #fda4af;
}
.labor-box.people-card:hover::before {
  top: auto; right: 48px; bottom: -32px;
  filter: blur(8px);
  box-shadow: 20px 20px 20px 30px #a21caf;
}
.labor-box.people-card:hover::after {
  right: -32px;
}
.labor-box.people-card .people-text { position: relative; z-index: 2; flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.labor-box.people-card .people-title {
  font-family: 'Pretendard', 'GmarketSans', sans-serif;
  font-size: 16.5px; font-weight: 500; letter-spacing: -0.01em; color: #F5F5F5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-decoration: underline; text-underline-offset: 2px;
  transition: color .5s ease, text-underline-offset .5s ease, text-decoration-thickness .5s ease;
}
.labor-box.people-card:hover .people-title { color: #fda4af; text-underline-offset: 4px; text-decoration-thickness: 2px; }

/* 로고 / 브랜드 헤더 — 사이드바 상단에 풀블리드로 걸치는 히어로 캡 */
.sidebar .brand {
  display: flex; flex-direction: column; gap: 10px;
  margin: -20px -14px 14px; padding: 18px 16px 14px;
  border-radius: 14px 14px 0 0;
  background:
    radial-gradient(120% 140% at 12% 0%, rgba(52,87,213,.20), rgba(52,87,213,0) 60%),
    linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0));

}
.sidebar .brand-row { display: flex; align-items: center; gap: 11px; }
.sidebar .brand-mark {
  width: 42px; height: 42px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: visible;
}
.sidebar .brand-mark svg { width: 42px; height: 42px; display: block; position: relative; filter: drop-shadow(0 2px 3px rgba(15,11,40,.28)); }
.sidebar .brand-mark .brand-mark-triangle { animation: brand-triangle-bob 4s ease infinite both; }
@keyframes brand-triangle-bob {
  0% { transform: translateY(0); }
  50% { transform: translateY(4px); }
  100% { transform: translateY(0); }
}
.sidebar .brand-mark .cls-1, .sidebar .brand-mark .cls-2, .sidebar .brand-mark .cls-3 { stroke-width: 0; }
.sidebar .brand-mark .cls-1 { fill: #3457D5; animation: brand-cls1 4s ease infinite both; }
.sidebar .brand-mark .cls-2 { fill: #5B84FF; animation: brand-cls2 4s ease infinite both; }
.sidebar .brand-mark .cls-3 { fill: #22348E; animation: brand-cls3 4s ease infinite both; }
@keyframes brand-cls1 {
  0% { fill: #3457D5; }
  34% { fill: #22348E; }
  66% { fill: #5B84FF; }
  100% { fill: #3457D5; }
}
@keyframes brand-cls2 {
  0% { fill: #5B84FF; }
  34% { fill: #3457D5; }
  66% { fill: #22348E; }
  100% { fill: #5B84FF; }
}
@keyframes brand-cls3 {
  0% { fill: #22348E; }
  34% { fill: #5B84FF; }
  66% { fill: #3457D5; }
  100% { fill: #22348E; }
}
.sidebar .brand-word { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sidebar .brand-eyebrow {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 11px; font-weight: 600; letter-spacing: .03em; color: var(--sidebar-text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sidebar .brand-logotype {
  font-size: 19px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15;
  color: var(--sidebar-text); white-space: nowrap;
}
.sidebar .brand-logotype em {
  font-style: normal;
  background: linear-gradient(100deg, #3457D5, #22348E 130%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.sidebar .brand-subtitle {
  font-family: 'Oswald', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 8.8px; font-weight: 500; letter-spacing: .045em; text-transform: uppercase; color: var(--sidebar-text-faint);
  padding-left: 51px; white-space: nowrap; margin-top: -6px;
}

/* 카테고리 라벨 (예산 / 결산) */
.sidebar .group-label { padding: 20px 6px 10px; }
.sidebar .group-label.cat-budget { padding-top: 2px; }
.sidebar .cat-badge {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
}
.sidebar .cat-icon {
  width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: #2E2E2E;
  background: #F3F3F3;
  box-shadow: 2px 2px 8px rgba(16,23,42,.16);
}
.sidebar .cat-icon svg { width: 15px; height: 15px; display: block; position: relative; top: 1.5px; }
.sidebar .cat-icon svg path { fill: currentColor; }
.sidebar .cat-text {
  font-weight: 800; font-size: 16.5px; letter-spacing: -0.01em; color: var(--sidebar-text);
}
.sidebar .group-label::after {
  content: ''; position: absolute; left: 6px; right: 6px; bottom: -2px; height: 1px;
  background: var(--sidebar-border);
}

.sidebar .side-icon {
  width: 26px; height: 26px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 8px; background: #F3F3F3; color: #2E2E2E;

}
.sidebar .side-icon svg { width: 15px; height: 15px; display: block; }
.sidebar .side-item-label { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
.sidebar .side-item-label > span:not(.side-icon) { flex-shrink: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sidebar .side-item {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 7px 10px; border-radius: 9px; font-size: 15px; color: var(--sidebar-text-muted); cursor: pointer;
  transition: background .15s ease, color .15s ease, box-shadow .15s ease;
  position: relative;
}
.sidebar .side-item::before {
  content: ''; position: absolute; left: -3px; top: 22%; bottom: 22%; width: 3px; border-radius: 3px;
  background: var(--sidebar-accent); opacity: 0; transform: scaleY(.4); transform-origin: center;
  transition: opacity .18s ease, transform .18s ease;
}
.sidebar .side-item:hover { background: var(--sidebar-hover-bg); color: var(--sidebar-text); }
/* 선택 상태: 좌측 포인트 인디케이터 + 배경 톤 + 은은한 링으로 강조 */
.sidebar .side-item.active {
  background: rgba(52,87,213,.14); color: var(--sidebar-text); font-weight: 700;
  box-shadow: inset 0 0 0 1px rgba(52,87,213,.26);
}
.sidebar .side-item.active::before { opacity: 1; transform: scaleY(1); }
.sidebar .side-item.active .side-icon { color: #fff; background: var(--sidebar-accent); box-shadow: 0 2px 8px rgba(52,87,213,.5); }
.sidebar .side-item.inst-header { cursor: pointer; color: var(--sidebar-text); font-weight: 600; }
.sidebar .side-item.inst-header:hover { background: var(--sidebar-hover-bg); }
.sidebar .side-item.inst-header:hover .side-icon { background: #E7E7E7; color: var(--sidebar-text); }
.settle-data-dots { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; flex-shrink: 0; }
.settle-data-dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--sidebar-accent); flex-shrink: 0;
}

/* 서브메뉴 접기/펼치기 */
.sidebar .side-sub {
  position: relative; padding-left: 14px; margin-left: 17px;
  max-height: 400px; overflow: hidden; opacity: 1; transition: max-height .22s ease, opacity .18s ease;
}
.sidebar .side-sub::before {
  content: ''; position: absolute; left: 0; top: 2px; bottom: 10px; width: 1px; background: var(--sidebar-tree-line);
}
.sidebar .side-sub.collapsed { max-height: 0; opacity: 0; }
.sidebar .side-sub .side-item { position: relative; font-size: 14px; padding: 5px 10px; margin: 1px 0; border-radius: 7px; }
.sidebar .side-sub .side-item.dept-item { padding-left: 22px; font-size: 13.5px; }
.sidebar .side-sub .side-item::before { display: none; }
.sidebar .side-sub .side-item.fund-item,
.sidebar .side-sub .side-item.dept-item {
  background: none; color: var(--sidebar-text-muted); font-weight: 400;
}
.sidebar .side-sub .side-item.fund-item:hover,
.sidebar .side-sub .side-item.dept-item:hover {
  background: var(--sidebar-hover-bg); color: var(--sidebar-text);
}
.sidebar .side-sub .side-item.fund-item.active,
.sidebar .side-sub .side-item.dept-item.active {
  background: rgba(52,87,213,.13); box-shadow: none;
  color: var(--sidebar-accent); font-weight: 700;
}
.sidebar .caret { display: inline-flex; color: var(--sidebar-text-faint); transition: transform .18s ease, color .15s ease; flex-shrink: 0; }
.sidebar .caret svg { width: 11px; height: 11px; display: block; }
.sidebar .caret.open { transform: rotate(180deg); }
.sidebar .side-item.inst-header:hover .caret { color: var(--sidebar-text); }

/* ---- fund radio glider (출연금/위탁금 선택 토글) ---- */
.sidebar .fund-radio {
  --main-color: var(--sidebar-accent);
  --main-color-opacity: rgba(52,87,213,.13);
  display: flex; flex-direction: column; position: relative; padding-left: 14px;
}
.sidebar .fund-radio input {
  cursor: pointer; appearance: none;
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.sidebar .fund-radio .glider-container {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(16,23,42,.14) 50%, rgba(0,0,0,0) 100%);
  width: 2px;
}
.sidebar .fund-radio .glider-container .glider {
  position: relative; height: calc(100% / var(--total-radio)); width: 100%;
  background: linear-gradient(0deg, rgba(0,0,0,0) 0%, var(--main-color) 50%, rgba(0,0,0,0) 100%);
  transition: transform 0.5s cubic-bezier(0.37, 1.95, 0.66, 0.56);
}
.sidebar .fund-radio .glider-container .glider::before {
  content: ""; position: absolute; height: 60%; width: 300%; top: 50%; transform: translateY(-50%);
  background: var(--main-color); filter: blur(8px);
}
.sidebar .fund-radio .glider-container .glider::after {
  content: ""; position: absolute; left: 0; height: 100%; width: 150px;
  background: linear-gradient(90deg, var(--main-color-opacity) 0%, rgba(0,0,0,0) 100%);
}
.sidebar .fund-radio label {
  cursor: pointer; padding: 7px 10px; position: relative;
  color: var(--sidebar-text-muted); font-size: 15px; transition: color .2s ease-in-out;
}
.sidebar .fund-radio input:checked + label { color: var(--sidebar-text); font-weight: 700; }
.sidebar .fund-radio input:nth-of-type(1):checked ~ .glider-container .glider { transform: translateY(0); }
.sidebar .fund-radio input:nth-of-type(2):checked ~ .glider-container .glider { transform: translateY(100%); }
.sidebar .fund-radio input:nth-of-type(3):checked ~ .glider-container .glider { transform: translateY(200%); }
.sidebar .fund-radio.dept-radio { padding-left: 24px; }
.sidebar .fund-radio.dept-radio label { font-size: 14px; padding: 5px 10px; }

.main {
  flex: 1; min-width: 0; padding: 28px 32px 48px; overflow-x: hidden;
  background: var(--bg-card); border-radius: var(--r-lg); box-shadow: var(--shadow-md);
}
.panel { display: none; position: relative; }
.panel.active { display: block; }
.placeholder-box {
  background: var(--bg-card); border: 1px dashed var(--border-strong); border-radius: var(--r-lg);
  padding: 48px 24px; text-align: center; color: var(--text-soft); font-size: 16px;
}
.dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
.dash-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow-sm); }
.dash-card .label { font-size: 14px; font-weight: 600; color: var(--text-soft); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 10px; }
.dash-card .value { font-size: 26.5px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.dash-list { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 6px 0; box-shadow: var(--shadow-sm); }
.dash-list .row { display: flex; justify-content: space-between; align-items: center; padding: 13px 20px; border-bottom: 1px solid var(--border); font-size: 16px; }
.dash-list .row:last-child { border-bottom: none; }
.dash-list .row .name { font-weight: 600; }
.dash-list .row .status { color: var(--text-soft); font-size: 14.5px; font-weight: 500; padding: 3px 10px; background: var(--bg-hover); border-radius: 999px; }

/* ---- 랜딩(시작) 화면 ---- */
.landing-hero {
  position: relative;
  overflow: hidden;
  padding: 40px 32px;
  margin: -28px -32px -48px;
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.landing-hero {
  background: oklch(0.98 0.01 255);
}
.landing-hero > * { position: relative; z-index: 1; }
.landing-hero-wash {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(120% 100% at 30% 10%, oklch(0.99 0.006 255), oklch(0.93 0.025 250) 80%);
}
.landing-hero-blobs {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  filter: blur(34px) saturate(1.15);
  opacity: .9;
}
.landing-hero-blob {
  position: absolute;
  left: var(--lh-x);
  top: var(--lh-y);
  width: var(--lh-s);
  aspect-ratio: 1;
  translate: -50% -50%;
  background: conic-gradient(from 140deg, oklch(0.78 0.14 var(--lh-h)), oklch(0.83 0.11 calc(var(--lh-h) + 25)), oklch(0.72 0.15 calc(var(--lh-h) - 20)), oklch(0.78 0.14 var(--lh-h)));
  mix-blend-mode: normal;
  opacity: .55;
  animation: landing-blob-morph var(--lh-t) ease-in-out infinite, landing-blob-turn calc(var(--lh-t) * 2.3) linear infinite;
}
@keyframes landing-blob-morph {
  0% { border-radius: 62% 38% 46% 54% / 58% 42% 58% 42%; scale: 1; }
  34% { border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%; scale: 1.18; }
  67% { border-radius: 45% 55% 37% 63% / 63% 57% 43% 37%; scale: 0.86; }
  100% { border-radius: 62% 38% 46% 54% / 58% 42% 58% 42%; scale: 1; }
}
@keyframes landing-blob-turn { to { rotate: 360deg; } }
@media (prefers-reduced-motion: reduce) {
  .landing-hero-blob { animation: none; }
}
.landing-eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.landing-title {
  font-family: 'GmarketSans', 'Pretendard', sans-serif;
  font-size: 48px; font-weight: 700; letter-spacing: -0.01em; color: var(--navy);
  margin: 0 0 10px; line-height: 1.3; white-space: nowrap;
  position: relative; top: 28px;
}
.landing-title .l1 { display: inline; }
.landing-title .l1::after { content: " "; }
.landing-title .l2 {
  display: inline;
  background-image: linear-gradient(90deg, #3457D5, #5B84FF, #22348E, #5B84FF, #3457D5);
  background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: hscf-colourful 6s linear infinite;
}
@keyframes hscf-colourful {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}
.landing-subtitle-en {
  font-family: 'GmarketSans', 'Pretendard', sans-serif;
  font-size: 16px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-soft); margin: 0 0 48px;
  position: relative; top: 28px;
}
.landing-grid { display: flex; flex-direction: row; flex-wrap: nowrap; justify-content: center; align-items: center; gap: 28px; max-width: 100%; margin: 20px auto 0; background: transparent; padding: 10px 16px; }

/* 4개 기관 버튼 밑 중앙 - "예산재정과"는 고정 텍스트, "문화복지팀"은 그라데이션 글자+배경이 옆에서 펼쳐지듯 나타나고
   깜빡이는 커서가 따라붙는 효과 - 주신 TextLoop(motion/react) 컴포넌트 동작을 vanilla로 옮김(회전 항목이 1개라 나타나는 것까지만) */
.landing-subjects-row { display: flex; justify-content: center; align-items: center; margin: 48px auto 0; }
.text-loop-widget {
  display: flex; flex-direction: row; align-items: center;

  font-size: 28px; font-weight: 400; letter-spacing: -0.5px;
}
.tl-static { margin-right: 12px; color: var(--navy); white-space: nowrap; }
.tl-rotate-wrap {
  position: relative; display: inline-flex; align-items: center; overflow: hidden; white-space: nowrap;
  max-width: 0; opacity: 0; animation: tl-grow 2s ease forwards; animation-delay: 0.6s;
}
.tl-rotate-bg { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--accent-soft) 55%, rgba(52,87,213,.22)); }
.tl-rotate-text {

@keyframes tl-grow { to { max-width: 320px; opacity: 1; } }
@keyframes tl-blink { from { opacity: 1; } to { opacity: .35; } }
@media (prefers-reduced-motion: reduce) {
  .tl-rotate-wrap { animation: none; max-width: 320px; opacity: 1; }
  .tl-cursor { animation: none; }
}
.landing-btn-row { display: flex; justify-content: center; gap: 32px; margin-top: 72px; }

/* 중요사항(메모) 토글 버튼 — Uiverse 스타일 플러스→X 모핑 + 컨페티 버스트 */
.note-toggle-wrapper {
  --background: var(--accent);
  --icon-color: #414856;
  --shape-color-01: var(--accent-soft);
  --shape-color-02: var(--accent);
  --shape-color-03: #E4B93A;
  --width: 42px;
  --height: 42px;
  --border-radius: var(--height);
  width: var(--width);
  height: var(--height);
  position: relative;
  border-radius: var(--border-radius);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}
.note-toggle-wrapper.has-note .note-toggle-btn { box-shadow: 0 0 0 2px #E4B93A; }
.note-toggle-wrapper .note-toggle-btn {
  background: var(--background);
  width: var(--width);
  height: var(--height);
  position: relative;
  z-index: 3;
  border-radius: var(--border-radius);
  box-shadow: 0 6px 16px rgba(52,87,213,.25);
  display: flex;
  justify-content: center;
  align-items: center;
}
.note-toggle-wrapper .note-toggle-btn .note-toggle-icon { width: 21px; height: 21px; color: #fff; display: block; }
.note-toggle-wrapper .note-toggle-btn .note-toggle-icon svg { width: 100%; height: 100%; display: block; }
.note-toggle-tooltip {
  width: fit-content; height: 34px; border-radius: 34px; position: absolute;
  background: #fff; z-index: 2; padding: 9px 16px;
  box-shadow: var(--shadow-md); opacity: 0; top: 0;
  display: flex; justify-content: space-around; align-items: center; gap: 6px;
  transition: opacity .15s ease-in, top .15s ease-in, width .15s ease-in;
  pointer-events: none;
}
.note-toggle-tooltip > span { position: relative; width: 100%; white-space: nowrap; opacity: 0; font-size: 13px; font-weight: 600; color: var(--text-muted); }
.note-toggle-tooltip > svg { width: 15px; height: 15px; flex-shrink: 0; }
.note-toggle-tooltip > svg .icon { fill: none; stroke: var(--icon-color); stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round; opacity: .7; }
.note-toggle-tooltip::after {
  content: ""; width: 10px; height: 10px; background: #fff; border-radius: 2px;
  position: absolute; left: 50%; margin-left: -5px; bottom: -4px; transform: rotate(45deg); z-index: 0;
}
.note-toggle-confetti { width: 150px; height: 150px; position: absolute; z-index: 1; transform: scale(0); pointer-events: none; }
.note-toggle-confetti .shape { stroke: none; transform-origin: 50% 20%; }
.note-toggle-confetti .shape-a { fill: var(--shape-color-01); }
.note-toggle-confetti .shape-b { fill: var(--shape-color-02); }
.note-toggle-confetti .shape-c { fill: var(--shape-color-03); }
.note-toggle-checkbox {
  height: 100%; width: 100%; border-radius: var(--border-radius); cursor: pointer;
  position: absolute; z-index: 5; opacity: 0; margin: 0;
}
.note-toggle-checkbox:checked ~ .note-toggle-confetti { animation: note-pang-anim 1.2s ease-out forwards; }
.note-toggle-checkbox:checked ~ .note-toggle-confetti .shape:nth-of-type(1) { transform: translate(13px, 30%) rotate(40deg); }
.note-toggle-checkbox:checked ~ .note-toggle-confetti .shape:nth-of-type(2) { transform: translate(-2px, 30%) rotate(80deg); }
.note-toggle-checkbox:checked ~ .note-toggle-confetti .shape:nth-of-type(3) { transform: translate(6px, 30%) rotate(120deg); }
.note-toggle-checkbox:checked ~ .note-toggle-confetti .shape:nth-of-type(4) { transform: translate(4px, 30%) rotate(160deg); }
.note-toggle-checkbox:checked ~ .note-toggle-confetti .shape:nth-of-type(5) { transform: translate(11px, 30%) rotate(200deg); }
.note-toggle-checkbox:checked ~ .note-toggle-confetti .shape:nth-of-type(6) { transform: translate(0px, 30%) rotate(240deg); }
.note-toggle-checkbox:checked ~ .note-toggle-confetti .shape:nth-of-type(7) { transform: translate(9px, 30%) rotate(280deg); }
.note-toggle-checkbox:checked ~ .note-toggle-confetti .shape:nth-of-type(8) { transform: translate(-2px, 30%) rotate(320deg); }
.note-toggle-checkbox:checked ~ .note-toggle-confetti .shape:nth-of-type(9) { transform: translate(13px, 30%) rotate(360deg); }
.note-toggle-wrapper .note-toggle-btn { transition: transform .2s ease; }
.note-toggle-checkbox:checked ~ .note-toggle-btn { transform: scale(0.9); }
.note-toggle-checkbox:checked ~ .note-toggle-tooltip {
  width: fit-content; padding: 9px 16px;
  animation: note-stretch-anim 1s ease-out forwards .15s;
  top: -46px; opacity: 1;
}
.note-toggle-checkbox:checked ~ .note-toggle-tooltip > span { opacity: 1; }

@keyframes note-pang-anim {
  0% { transform: scale(0); opacity: 0; }
  40% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1.1); opacity: 0; }
}
@keyframes note-plus-anim {
  0% { transform: rotate(0) scale(1); }
  20% { transform: rotate(60deg) scale(0.93); }
  55% { transform: rotate(35deg) scale(0.97); }
  80% { transform: rotate(48deg) scale(0.94); }
  100% { transform: rotate(45deg) scale(0.95); }
}
@keyframes note-plus-anim-reverse {
  0% { transform: rotate(45deg) scale(0.95); }
  20% { transform: rotate(-15deg); }
  55% { transform: rotate(10deg); }
  80% { transform: rotate(-3deg); }
  100% { transform: rotate(0) scale(1); }
}
@keyframes note-stretch-anim {
  0% { transform: scale(1, 1); }
  10% { transform: scale(1.1, 0.9); }
  30% { transform: scale(0.9, 1.1); }
  50% { transform: scale(1.05, 0.95); }
  100% { transform: scale(1, 1); }
}

/* From Uiverse.io by alexruix */
.loader {
  width: 80px;
  height: 50px;
  position: relative;
  margin: 0 auto;
}
.loader-text {
  position: absolute;
  top: 0;
  padding: 0;
  margin: 0;
  color: #B6CCFF;
  animation: text_713 3.5s ease both infinite;
  font-size: .8rem;
  letter-spacing: 1px;
}
.load {
  background-color: #5B84FF;
  border-radius: 50px;
  display: block;
  height: 16px;
  width: 16px;
  bottom: 0;
  position: absolute;
  transform: translateX(64px);
  animation: loading_713 3.5s ease both infinite;
}
.load::before {
  position: absolute;
  content: "";
  width: 100%;
  height: 100%;
  background-color: #C7D8FF;
  border-radius: inherit;
  animation: loading2_713 3.5s ease both infinite;
}
@keyframes text_713 {
  0% { letter-spacing: 1px; transform: translateX(0px); }
  40% { letter-spacing: 2px; transform: translateX(26px); }
  80% { letter-spacing: 1px; transform: translateX(32px); }
  90% { letter-spacing: 2px; transform: translateX(0px); }
  100% { letter-spacing: 1px; transform: translateX(0px); }
}
@keyframes loading_713 {
  0% { width: 16px; transform: translateX(0px); }
  40% { width: 100%; transform: translateX(0px); }
  80% { width: 16px; transform: translateX(64px); }
  90% { width: 100%; transform: translateX(0px); }
  100% { width: 16px; transform: translateX(0px); }
}
@keyframes loading2_713 {
  0% { transform: translateX(0px); width: 16px; }
  40% { transform: translateX(0%); width: 80%; }
  80% { width: 100%; transform: translateX(0px); }
  90% { width: 80%; transform: translateX(15px); }
  100% { transform: translateX(0px); width: 16px; }
}
