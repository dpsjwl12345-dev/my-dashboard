<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화성시문화재단 예산/결산 대시보드</title>
  <style>
    /* ==========================================
       1. 기본 변수 및 글로벌 스타일
       ========================================== */
    :root {
      --bg-page: #F8FAFC;
      --bg-card: #FFFFFF;
      --sidebar-bg: #12172A;
      --sidebar-text: #94A3B8;
      --sidebar-text-active: #FFFFFF;
      --primary-blue: #2563EB;
      --border-color: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    }

    /* 2. 전체 페이지 배경 (두 블록 사이 여백 연출) */
    body {
      background-color: var(--bg-page) !important;
      padding: 16px;
      height: 100vh;
      overflow: hidden;
    }

    /* 3. 레이아웃 구조 */
    .app {
      display: flex;
      gap: 16px;
      height: calc(100vh - 32px);
    }

    /* 4. 사이드바: 진한 남색 + 플로팅 카드 형태 */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg) !important;
      color: #F1F5F9;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      border: none !important;
      flex-shrink: 0;
    }

    /* 로고/타이틀 (크기 확대) */
    .sidebar-brand {
      font-size: 1.25rem !important;
      font-weight: 700;
      color: #FFFFFF !important;
      margin-bottom: 24px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 메인 네비게이션 메뉴 */
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-nav button,
    .sidebar-nav a {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 12px 16px;
      font-size: 1.05rem !important; /* 글자 크기 확대 */
      font-weight: 500;
      color: var(--sidebar-text);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      text-decoration: none;
    }

    .sidebar-nav button:hover,
    .sidebar-nav a:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
    }

    .sidebar-nav button.active,
    .sidebar-nav a.active {
      background-color: var(--primary-blue);
      color: var(--sidebar-text-active) !important;
      font-weight: 600;
    }

    /* 하위 메뉴 (트리 구조 얇은 구분선) */
    .sidebar-subnav {
      margin-left: 16px;
      padding-left: 12px;
      border-left: 2px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    .sidebar-subnav button,
    .sidebar-subnav a {
      font-size: 0.95rem !important;
      color: #64748B;
      padding: 8px 12px;
    }

    .sidebar-subnav button:hover,
    .sidebar-subnav a:hover {
      color: #CBD5E1;
    }

    .sidebar-subnav button.active,
    .sidebar-subnav a.active {
      color: #60A5FA !important;
      background: transparent;
      font-weight: 600;
    }

    /* 5. 메인 본문 영역: 독립된 흰색 카드 형태 */
    .main {
      flex: 1;
      background-color: var(--bg-card);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      padding: 24px;
      overflow-y: auto;
    }

    /* 기존 패널 및 대시보드 컴포넌트 스타일 유지 */
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>

  <div class="app">
    <!-- 사이드바 영역 -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span>화성시문화재단</span>
      </div>
      
      <nav class="sidebar-nav">
        <button class="active" onclick="switchPanel('dashboard', this)">전체 현황</button>
        
        <button onclick="switchPanel('budget', this)">예산 관리</button>
        <div class="sidebar-subnav">
          <button onclick="switchPanel('hscf', this)">출연금/위탁금 현황</button>
        </div>

        <button onclick="switchPanel('settlement', this)">결산 현황</button>
      </nav>
    </aside>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main">
      <!-- 패널 1: 대시보드 전체 현황 -->
      <section id="panel-dashboard" class="panel active">
        <h2>전체 현황 대시보드</h2>
        <!-- 기존 대시보드 콘텐츠 위치 -->
      </section>

      <!-- 패널 2: 출연금/위탁금 상세 현황 테이블 -->
      <section id="panel-hscf" class="panel">
        <h2>출연금 및 위탁금 현황</h2>
        <!-- 기존 HSCF 상세 현황 및 테이블 위치 -->
      </section>

      <!-- 패널 3: 예산/결산 플레이스홀더 -->
      <section id="panel-budget-placeholder" class="panel">
        <h2>예산 관리</h2>
      </section>
      
      <section id="panel-settlement" class="panel">
        <h2>결산 관리</h2>
      </section>
    </main>
  </div>

  <script>
    // 탭 및 패널 전환 JS 함수
    function switchPanel(panelId, btnElement) {
      // 패널 활성화
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      const targetPanel = document.getElementById('panel-' + panelId) || document.getElementById('panel-budget-placeholder');
      if(targetPanel) targetPanel.classList.add('active');

      // 버튼 활성화
      document.querySelectorAll('.sidebar-nav button, .sidebar-subnav button').forEach(b => b.classList.remove('active'));
      if(btnElement) btnElement.classList.add('active');
    }
  </script>
</body>
</html>
