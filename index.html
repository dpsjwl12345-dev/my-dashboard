.lc-subtoggle { display: flex; gap: 8px; margin: 0 0 28px 8px; flex-wrap: wrap; padding-top: 4px; padding-left: 16px; border-left: 2px solid var(--border); }
.lc-subtoggle .tab-group { position: relative; }

.lc-subtoggle label {

  padding: 10px 18px; line-height: 1.6;
  border: 1px solid #cccccc; border-radius: 12px; cursor: pointer;

  transition: all 0.48s cubic-bezier(0.23, 1, 0.32, 1);
}
.lc-subtoggle label::after {
  content: ""; position: absolute; bottom: -32px; left: 50%;
  width: 8px; height: 8px; border-radius: 50%; background-color: rgb(var(--tc, 10,60,255));
  transform: translateX(-50%); transform-origin: 0 0; scale: 0; opacity: 0; z-index: -1;
  transition: all 0.48s 0.2s cubic-bezier(0.23, 1, 0.32, 1);
}
.lc-subtoggle label::before {
  content: ""; position: absolute; top: -20px; left: 50%;
  width: 100%; height: 40px; border-radius: 12px; background-color: rgb(var(--tc, 10,60,255));
  transform: translate(-50%, -50%); z-index: -1; opacity: 0; scale: 0; transform-origin: 0 0;
  transition: all 0.48s cubic-bezier(0.23, 1, 0.32, 1);
}
.lc-subtoggle label:hover { border-color: rgb(var(--tc, 10,60,255)); color: rgb(var(--tc, 10,60,255)); }

}

  box-shadow: 0rem 6px 13px rgba(var(--tc, 10,60,255),.1), 0rem 24px 24px rgba(var(--tc, 10,60,255),.09), 0rem 55px 33px rgba(var(--tc, 10,60,255),.05), 0rem 97px 39px rgba(var(--tc, 10,60,255),.01), 0rem 152px 43px rgba(var(--tc, 10,60,255),0);
}

function updateTopbarLogo(instKey, imgId, textId) {
  imgId = imgId || 'topbar-logo';
  textId = textId || 'topbar-logo-text';
  var img = document.getElementById(imgId);
  var textLogo = document.getElementById(textId);
  if (!img) return;

  // 화성시인재육성재단은 로고 이미지 대신 지마켓산스체 텍스트로 표기
  if (instKey === 'talent') {
    img.style.display = 'none';
    if (textLogo) {
      textLogo.textContent = '화성시인재육성재단';
      textLogo.style.display = '';
    }
    return;
  }

  img.style.display = '';
  if (textLogo) textLogo.style.display = 'none';

  var logo = INSTITUTION_LOGOS[instKey];
  if (logo) {
    img.src = logo.src;
    img.alt = logo.alt;
  } else {
    img.src = DEFAULT_LOGO_SRC;
    img.alt = '화성시문화관광재단';
  }
  img.style.height = '72px';
  // 실제 이미지마다 여백/구도가 달라 같은 72px 박스 안에서도 체감 크기가 달라 보정
  // (박스 높이는 그대로 72px로 고정해 배너 전체 높이는 안 흔들리게 함)
  if (instKey === 'hscf') {
    img.style.transform = 'translateY(-4px) scale(1.12)';
  } else if (instKey === 'fc' || instKey === 'corp') {
    img.style.transform = 'scale(0.85)';
  } else {
    img.style.transform = '';
  }
}

// budget_items 원본 행(flat) -> TEAM_TREES 형태(중첩 트리)로 조립
async function fetchAllRows(table, institutionId, round) {
  var all = [];
  var pageSize = 1000;
  var from = 0;
  while (true) {
    var q = db.from(table).select('*').eq('institution_id', institutionId);
    if (round) q = q.eq('round', round);
    var { data, error } = await q.order('sort_order').order('id').range(from, from + pageSize - 1);
    if (error) { showLoadError(table, error); break; }
    if (!data || !data.length) break;
    all = all.concat(data);
    if (data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

// 회차(본예산 외 1~3회 추경) 트리 캐시: 'instId|businessId|round' -> { trees, teams }
var roundDataCache = {};
async function fetchRoundData(instId, business, round) {
  var cacheKey = instId + '|' + business.id + '|' + round;
  if (roundDataCache[cacheKey]) return roundDataCache[cacheKey];
  var { data: items, error: e1 } = await db.from('budget_items').select('*')
    .eq('institution_id', instId).eq('business_card', business.name).eq('round', round)
    .order('sort_order').order('id');
  if (e1) { showLoadError('회차별 예산 트리', e1); return { trees: {}, teams: [] }; }
  var trees = buildTeamTrees(items || []);
  var { data: teamRows, error: e2 } = await db.from('card_teams').select('*')
    .eq('card_id', business.id).eq('round', round).order('sort_order');
  if (e2) { showLoadError('회차별 정현원', e2); }
  var teams = (teamRows || []).map(function (t) {
    return { name: t.team_name, capacity: t.capacity, current: t.current, treeKey: t.team_root_budget_item_id };
  });
  var result = { trees: trees, teams: teams };
  roundDataCache[cacheKey] = result;
  return result;
}

function buildTeamTrees(rows) {
  var byId = {};
  rows.forEach(function (r) { byId[r.id] = { id: r.id, level: r.level, code: r.code, name: r.name, amt26: r.amt26, amt25: r.amt25, calc: r.calc, edited: !!r.edited, children: [], _parent_id: r.parent_id, _sort: r.sort_order }; });
  var roots = [];
  rows.forEach(function (r) {
    var node = byId[r.id];
    if (r.parent_id == null) { roots.push(node); }
    else if (byId[r.parent_id]) { byId[r.parent_id].children.push(node); }
  });
  function sortRec(node) {
    node.children.sort(function (a, b) { return (a._sort || 0) - (b._sort || 0); });
    node.children.forEach(sortRec);
  }
  roots.forEach(sortRec);
  // id 기준으로 키를 만든다 (이름은 기관마다 겹치거나 표시용으로 바뀔 수 있어 매칭에 쓰지 않음)
  var trees = {};
  roots.forEach(function (n) { trees[String(n.id)] = n; });
  return trees;
}

async function loadInstitutions() {
  var el = document.getElementById('nav-budget');
  el.innerHTML = '<div style="padding:8px;color:var(--text-soft);font-size:15px;">불러오는 중...</div>';

  var { data: insts, error: e1 } = await db.from('institutions').select('*').order('sort_order');
  if (e1) { showLoadError('기관 목록', e1); return; }
  var { data: funds, error: e2 } = await db.from('institution_funds').select('*').order('sort_order');
  if (e2) { showLoadError('재원 목록', e2); return; }

  INSTITUTIONS = insts.map(function (inst) {
    var instFunds = funds.filter(function (x) { return x.institution_id === inst.id; });
    var f = instFunds.map(function (x) { return x.fund_type; });
    return { key: inst.key, id: inst.id, name: inst.name, icon: inst.icon, funds: f, fundRows: instFunds, hasData: inst.has_data };
  });
  var hscf = INSTITUTIONS.filter(function (i) { return i.key === 'hscf'; })[0];
  if (hscf) HSCF_INST_ID = hscf.id;

  renderSidebarNav();
  renderDashboard();
}

// 기관(instKey) 하나의 예산 데이터를 불러와 캐시에 저장하고, 성공하면 그 캐시를 반환한다.
async function loadInstBudgetData(inst) {
  if (instDataCache[inst.key]) return instDataCache[inst.key];

  var items = await fetchAllRows('budget_items', inst.id, 'base');
  var teamTrees = buildTeamTrees(items);

  var { data: cards, error: e2 } = await db.from('business_cards').select('*').eq('institution_id', inst.id).order('sort_order');
  if (e2) { showLoadError('본부/사업 카드', e2); return null; }
  var { data: teams, error: e3 } = await db.from('card_teams').select('*').eq('round', 'base').order('sort_order');
  if (e3) { showLoadError('팀 정원현원', e3); return null; }

  var businesses = cards.map(function (c) {
    var myTeams = teams.filter(function (t) { return t.card_id === c.id; }).map(function (t) {
      return { name: t.team_name, capacity: t.capacity, current: t.current, treeKey: t.team_root_budget_item_id };
    });
    return { id: c.id, dept: c.dept, fundType: c.fund_type, name: c.name, amt: c.amt, amt25: c.amt25, note: c.note,
      laborCost: c.labor_cost, laborCost25: c.labor_cost25,
      adminCost: c.admin_cost, adminCost25: c.admin_cost25,
      programCost: c.program_cost, programCost25: c.program_cost25,
      revenueGrant: c.revenue_grant, revenueGrant25: c.revenue_grant25,
      revenueSubsidy: c.revenue_subsidy, revenueSubsidy25: c.revenue_subsidy25,
      revenueSelf: c.revenue_self, revenueSelf25: c.revenue_self25,
      teams: myTeams, lines: [] };
  });

  var deptSet = [];
  businesses.forEach(function (b) { if (b.dept && deptSet.indexOf(b.dept) === -1) deptSet.push(b.dept); });

  // 부서·재원·회차별 "편성액"(실제 확정 금액) - budget_items의 회차 데이터는 요구액이라 이거랑 다르다.
  // business_card가 없으면 부서 전체 합계 한 줄, 있으면 사업(카드)별로 나눠서 보여준다 (예: 교육지원과는 경영기획본부/교육협력본부로 나눠 편성).
  var enactedAmounts = {};
  var enactedByCard = {};
  var { data: enacted, error: e4 } = await db.from('dept_enacted_amounts').select('*').eq('institution_id', inst.id);
  if (!e4 && enacted) {
    enacted.forEach(function (row) {
      if (row.business_card) {
        var ckey = row.dept + '|' + row.fund_type;
        if (!enactedByCard[ckey]) enactedByCard[ckey] = [];
        var cardEntry = enactedByCard[ckey].filter(function (c) { return c.name === row.business_card; })[0];
        if (!cardEntry) { cardEntry = { name: row.business_card, sortOrder: row.sort_order, rounds: {} }; enactedByCard[ckey].push(cardEntry); }
        cardEntry.rounds[row.round] = row.amt;
      } else {
        enactedAmounts[row.dept + '|' + row.fund_type + '|' + row.round] = row.amt;
      }
    });
    Object.keys(enactedByCard).forEach(function (k) { enactedByCard[k].sort(function (a, b) { return a.sortOrder - b.sortOrder; }); });
  }

  var cache = { teamTrees: teamTrees, businesses: businesses, departments: deptSet.length ? deptSet : DEPARTMENTS, enactedAmounts: enactedAmounts, enactedByCard: enactedByCard };
  instDataCache[inst.key] = cache;
  return cache;
}
// 부서·재원·회차의 실제 편성액(부서 전체 합계)을 조회한다. 값이 없으면 null(자료 없음).
function getDeptEnactedAmount(dept, fundType, round) {
  var cache = instDataCache[nav.instKey];
  if (!cache || !cache.enactedAmounts) return null;
  var key = dept + '|' + fundType + '|' + (round || 'base');
  return cache.enactedAmounts.hasOwnProperty(key) ? cache.enactedAmounts[key] : null;
}
// 부서·재원이 사업(카드)별로 나뉘어 편성돼 있으면 그 목록을 반환한다. 없으면 null.
function getDeptEnactedCards(dept, fundType) {
  var cache = instDataCache[nav.instKey];
  if (!cache || !cache.enactedByCard) return null;
  var key = dept + '|' + fundType;
  return cache.enactedByCard[key] || null;
}
// 부서 카드 상단에 보여줄 "현재 예산액" — 요구액(budget_items 트리)이 아니라 실제 편성액 중 가장 최근 회차(3회>2회>1회>본예산) 값을 쓴다.
// 사업(카드)별로 나눠 편성된 부서는 카드마다 각자의 최신 회차 값을 더해서 합산한다. 편성액이 하나도 입력 안 된 부서는 null(호출부에서 요구액으로 대체).
function getDeptLatestEnactedTotal(dept, fundType) {
  var rounds = ['supp3', 'supp2', 'supp1', 'base'];
  var cards = getDeptEnactedCards(dept, fundType);
  if (cards && cards.length) {
    var total = 0, any = false;
    cards.forEach(function (c) {
      if (/^\s*ㅇ/.test(c.name)) return; // 소계(부모) 행의 세부내역(자식) - 합계에 중복으로 더하지 않는다
      for (var i = 0; i < rounds.length; i++) {
        var amt = c.rounds[rounds[i]];
        if (amt) { total += amt; any = true; break; }
      }
    });
    return any ? total : null;
  }
  for (var j = 0; j < rounds.length; j++) {
    var v = getDeptEnactedAmount(dept, fundType, rounds[j]);
    if (v) return v;
  }
  return null;
}

function fmtMillion(nThousand) {

  return m.toLocaleString('ko-KR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
}
function fmtMillionInt(nThousand) {
  if (nThousand == null || nThousand === '') return '';
  var m = Math.round(nThousand / 1000);
  return m.toLocaleString('ko-KR');
}
function ov2KpiTitleAmt(total26, total25) {

function escapeHtml(s) {

    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

  if (!e.target.closest('.year-select-wrap')) {
    menu.style.display = 'none';
    wrap.classList.remove('open');
  }
});

function classifyMokCode(code) {
  if (!code) return '운영비';
  var c = code.charAt(0);
  if (c === '1') return '인건비';
  if (code === '401' || code === '405') return '자산취득비';
  return '운영비';
}

function computeFundSummaryGeneric(fundType, title) {
  var buckets = { '인건비': [0, 0], '운영비': [0, 0], '자산취득비': [0, 0] };
  function walk(node) {
    if (node.level === '목') {
      var b = classifyMokCode(node.code);
      buckets[b][0] += node.amt26 || 0;
      buckets[b][1] += node.amt25 || 0;
    }
    (node.children || []).forEach(walk);
  }
  // 이 재원(fundType)에 속한 카드가 실제로 참조하는 트리만 집계한다.
  var relevant = (state.businesses || []).filter(function (biz) { return biz.fundType === fundType; });
  relevant.forEach(function (biz) {
    (biz.teams || []).forEach(function (t) {
      if (t.treeKey && TEAM_TREES[t.treeKey]) walk(TEAM_TREES[t.treeKey]);
    });
  });
  var order = ['인건비', '운영비', '자산취득비'];
  var rows = order.map(function (label) { return { label: label, y26: buckets[label][0], y25: buckets[label][1] }; });
  var total = rows.reduce(function (acc, r) { return { y26: acc.y26 + r.y26, y25: acc.y25 + r.y25 }; }, { y26: 0, y25: 0 });
  return { title: title, rows: rows, total: { label: '합계', y26: total.y26, y25: total.y25 }, note: '팀별 예산 트리 데이터를 통계목(101/2xx/401·405/기타) 기준으로 자동 집계한 값입니다.' };
}
function computeFundSummary() {
  return computeFundSummaryGeneric('출연금', '출연금 총괄');
}
function computeWtgFundSummary() {
  // 0) 도서관정책과 전용 4개 통계목(인건비/운영비/자산취득비/도서구입) 예외 처리
  if (nav.instKey === 'hscf' && state.dept === '도서관정책과') {
    var rowsLib = [
      { label: '인건비', y26: 9820826, y25: 9544862 },
      { label: '운영비', y26: 7908245, y25: 8550000 },
      { label: '자산취득비', y26: 277820, y25: 96862 },
      { label: '도서구입', y26: 928940, y25: 1223000 }
    ];
    var totalLib = rowsLib.reduce(function (acc, r) { return { y26: acc.y26 + r.y26, y25: acc.y25 + r.y25 }; }, { y26: 0, y25: 0 });
    return { title: '위탁금 총괄', rows: rowsLib, total: { label: '합계', y26: totalLib.y26, y25: totalLib.y25 }, note: '도서관정책과 연도별 위탁금 현황 자료 기준입니다.' };
  }

  // 1) institution_funds에 저장된 화성시 총괄표 원본 수치가 있으면 그걸 그대로 쓴다 (예: 인재육성재단)
  var inst = (INSTITUTIONS || []).filter(function (i) { return i.key === nav.instKey; })[0];
  var fundRow = inst && inst.fundRows ? inst.fundRows.filter(function (f) { return f.fund_type === '위탁금'; })[0] : null;

  if (fundRow && fundRow.total_labor != null) {
    var rowsF = [
      { label: '인건비', y26: fundRow.total_labor || 0, y25: fundRow.total_labor25 || 0 },
      { label: '운영비', y26: fundRow.total_admin || 0, y25: fundRow.total_admin25 || 0 },
      { label: '사업비', y26: fundRow.total_program || 0, y25: fundRow.total_program25 || 0 }
    ];
    var totalF = rowsF.reduce(function (acc, r) { return { y26: acc.y26 + r.y26, y25: acc.y25 + r.y25 }; }, { y26: 0, y25: 0 });
    return { title: '위탁금 총괄', rows: rowsF, total: { label: '합계', y26: totalF.y26, y25: totalF.y25 }, note: '화성시 예산 총괄표(세부) 원본 수치입니다.' };
  }

  // 2) 카드별로 labor_cost 등이 저장돼 있으면 그걸 합산한다
  var list = (state.businesses || []).filter(function (biz) { return biz.fundType === '위탁금'; });
  var hasCardLevelData = list.some(function (biz) {
    return biz.laborCost != null || biz.adminCost != null || biz.programCost != null;
  });
  if (hasCardLevelData) {
    var buckets = { '인건비': [0, 0], '운영비': [0, 0], '사업비': [0, 0] };
    list.forEach(function (biz) {
      buckets['인건비'][0] += biz.laborCost || 0;
      buckets['인건비'][1] += biz.laborCost25 || 0;
      buckets['운영비'][0] += biz.adminCost || 0;
      buckets['운영비'][1] += biz.adminCost25 || 0;
      buckets['사업비'][0] += biz.programCost || 0;
      buckets['사업비'][1] += biz.programCost25 || 0;
    });
    var order = ['인건비', '운영비', '사업비'];
    var rows = order.map(function (label) { return { label: label, y26: buckets[label][0], y25: buckets[label][1] }; });
    var total = rows.reduce(function (acc, r) { return { y26: acc.y26 + r.y26, y25: acc.y25 + r.y25 }; }, { y26: 0, y25: 0 });
    return { title: '위탁금 총괄', rows: rows, total: { label: '합계', y26: total.y26, y25: total.y25 }, note: '화성시 예산 총괄표(세부) 원본 수치를 카드별로 합산한 값입니다.' };
  }

  // 3) 둘 다 없으면(기존 기관들) 트리 데이터를 통계목 기준으로 자동 집계한다
  return computeFundSummaryGeneric('위탁금', '위탁금 총괄');
}

// 요약 도넛차트·범례·표에서 공통으로 쓰는 그라데이션 컬러 팔레트
// 항목명이 아니라 순서(인덱스)로 색을 배정 — 항목이 많은(문화관광재단 세부내역 등) 차트에서도
// 매핑되지 않은 항목이 전부 같은 회색으로 뭉개지지 않고 항상 서로 다른 색이 나오도록 함
var DONUT_PALETTE = [
  ['#AEC5F7', '#7FA3ED'], // blue
  ['#A9DDEA', '#6FB8CC'], // teal
  ['#AEE3CB', '#71C09C'], // green
  ['#F8D9A0', '#EFB25C'], // amber
  ['#F8CFA0', '#EF9C5C'], // orange
  ['#F5B8C4', '#E884A0'], // rose
  ['#BFDDF7', '#8AB8ED'], // sky blue
  ['#D7E8A8', '#AECB6B'], // lime
  ['#F7C9AE', '#EF9B70'], // peach
  ['#C7D0E0', '#98A6C2']  // slate
];
function donutStops(index) { return DONUT_PALETTE[index % DONUT_PALETTE.length]; }
function donutGradientCss(index) {
  var s = donutStops(index);
  return 'linear-gradient(135deg,' + s[0] + ',' + s[1] + ')';
}

var _donutSvgSeq = 0;
function buildDonutSvg(rows, total26) {
  var R = 64, CX = 100, CY = 100, STROKE = 42;
  var uid = 'd' + (_donutSvgSeq++) + '_';
  var circumference = 2 * Math.PI * R;
  var offset = 0;
  var segsHtml = '';
  var labelsHtml = '';
  var defsHtml = '<filter id="' + uid + 'donutGlow" x="-50%" y="-50%" width="200%" height="200%">'
    + '<feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10182E" flood-opacity="0.20"/>'
    + '</filter>';

  // 실제 비중이 너무 작은 조각(예: 1~2%)은 링에서 최소 폭을 보장해 숫자가 들어갈 공간을 확보한다.
  // (실제 %는 라벨·범례에 정확한 값 그대로 표시하고, 링 폭 계산에만 보정값을 사용)
  var MIN_PCT = 8;
  var actualPcts = rows.map(function (r) { return total26 ? (r.y26 / total26 * 100) : 0; });
  var visualPcts = actualPcts.map(function (p) { return p > 0 ? Math.max(p, MIN_PCT) : 0; });
  var visualSum = visualPcts.reduce(function (a, b) { return a + b; }, 0);
  if (visualSum > 100) {
    var overBudget = visualSum - 100;
    var flexIdx = [];
    var flexSum = 0;
    visualPcts.forEach(function (p, i) { if (p > MIN_PCT) { flexIdx.push(i); flexSum += p; } });
    if (flexSum > 0) {
      flexIdx.forEach(function (i) { visualPcts[i] -= overBudget * (visualPcts[i] / flexSum); });
    }
  }

  // 조각을 그리는 순서: 인건비(또는 출연금)를 항상 12시 방향 시작점으로 고정하고,
  // 나머지는 큰 것-작은 것을 번갈아 배치해서 작은 조각끼리 라벨이 겹치지 않게 함
  // (표/범례는 원래 순서 그대로 유지되며, 이건 시각적 배치 순서에만 영향)
  var order = actualPcts.map(function (_, i) { return i; }).sort(function (a, b) { return actualPcts[b] - actualPcts[a]; });
  var startIdx = rows.findIndex(function (r) { return r.label === '인건비' || r.label === '출연금'; });
  if (startIdx === -1 || actualPcts[startIdx] <= 0) startIdx = order[0];
  var remaining = order.filter(function (i) { return i !== startIdx; });
  var zigzag = [startIdx];
  var lo = 0, hi = remaining.length - 1;
  while (lo <= hi) { zigzag.push(remaining[lo++]); if (lo <= hi) zigzag.push(remaining[hi--]); }

  zigzag.forEach(function (i) {
    var r = rows[i];
    var pct = actualPcts[i];
    var vpct = visualPcts[i];
    var len = circumference * vpct / 100;
    var stops = donutStops(i);
    var gid = uid + 'donutGrad' + i;
    defsHtml += '<linearGradient id="' + gid + '" x1="0%" y1="0%" x2="100%" y2="100%">'
      + '<stop offset="0%" stop-color="' + stops[0] + '"/>'
      + '<stop offset="100%" stop-color="' + stops[1] + '"/>'
      + '</linearGradient>';
    var gap = (vpct > 0 && vpct < 100) ? 3 : 0;
    var midAngle = (offset + len / 2) / circumference * 360 - 90;
    var rad = midAngle * Math.PI / 180;
    segsHtml += '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="url(#' + gid + ')" stroke-width="' + STROKE
      + '" stroke-linecap="round"'
      + ' stroke-dasharray="' + Math.max(len - gap, 0).toFixed(2) + ' ' + (circumference - len + gap).toFixed(2) + '"'
      + ' stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 ' + CX + ' ' + CY + ')" filter="url(#' + uid + 'donutGlow)"></circle>';
    if (vpct > 0) {
      var lx = CX + R * Math.cos(rad);
      var ly = CY + R * Math.sin(rad);
      labelsHtml += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="800" fill="#fff">' + pct.toFixed(1) + '</text>';
    }
    offset += len;
  });
  var glass = '<circle cx="' + CX + '" cy="' + CY + '" r="' + (R - STROKE / 2 - 6) + '" fill="rgba(255,255,255,.55)" stroke="rgba(255,255,255,.85)" stroke-width="1"></circle>';
  return '<svg width="212" height="212" viewBox="0 0 200 200"><defs>' + defsHtml + '</defs>' + glass + segsHtml + labelsHtml + '</svg>';
}

// 도넛 차트 하단 범례 (항목명 + 색상 칩 + 비중)
function buildDonutLegend(rows, total26) {
  var items = rows.map(function (r, i) {
    var pct = total26 ? (r.y26 / total26 * 100) : 0;
    return '<div class="item"><span class="name"><span class="chip" style="background:' + donutGradientCss(i) + '"></span>' + escapeHtml(r.label) + '</span><span class="pct">' + pct.toFixed(1) + '%</span></div>';
  }).join('');
  return '<div class="donut-legend">' + items + '</div>';
}

// 수입총괄 - 도넛 대신 가로 막대 위에 항목명·비중을 바로 표기하는 스타일
function buildIncomeProportionBar(rows, total26) {
  var actualPcts = rows.map(function (r) { return total26 ? (r.y26 / total26 * 100) : 0; });
  // 실제 비중이 너무 작으면 막대에서 안 보이거나 구분이 안 되므로, 막대 폭 계산에는 최소 비중을
  // 보장한 보정값을 쓰고(초과분은 큰 항목에서 비례 차감), 표기되는 숫자는 항상 실제 비중을 쓴다
  var MIN_VISUAL_PCT = 3;
  var pcts = actualPcts.map(function (p) { return p > 0 ? Math.max(p, MIN_VISUAL_PCT) : 0; });
  var visualSum = pcts.reduce(function (a, b) { return a + b; }, 0);
  if (visualSum > 100) {
    var overBudget = visualSum - 100;
    var flexIdx = [];
    var flexSum = 0;
    pcts.forEach(function (p, i) { if (p > MIN_VISUAL_PCT) { flexIdx.push(i); flexSum += p; } });
    if (flexSum > 0) {
      flexIdx.forEach(function (i) { pcts[i] -= overBudget * (pcts[i] / flexSum); });
    }
  }
  // 라벨(항목명+비중)은 세그먼트 폭이 텍스트를 담을 만큼 넓을 때만 표시 — 너무 좁으면 글자가 잘려 보이므로
  // 색상 구간만 그리고 항목명은 hover 시 title 툴팁으로 확인하게 한다
  var LABEL_MIN_PCT = 8;
  var labelsHtml = rows.map(function (r, i) {
    var actualPct = actualPcts[i];
    if (actualPct <= 0) return '';
    if (actualPct < LABEL_MIN_PCT) return '<div class="ov2-propbar-label" style="flex-basis:' + pcts[i] + '%;" title="' + escapeHtml(r.label) + ' ' + actualPct.toFixed(1) + '%"></div>';
    return '<div class="ov2-propbar-label" style="flex-basis:' + pcts[i] + '%;" title="' + escapeHtml(r.label) + ' ' + actualPct.toFixed(1) + '%">'
      + '<span class="name">' + escapeHtml(r.label) + '</span>'
      + '<span class="pct">' + actualPct.toFixed(1) + '%</span>'
      + '</div>';
  }).join('');
  var segsHtml = rows.map(function (r, i) {
    var actualPct = actualPcts[i];
    if (actualPct <= 0) return '';
    return '<div class="ov2-propbar-seg" style="flex-basis:' + pcts[i] + '%;background:' + donutGradientCss(i) + ';" title="' + escapeHtml(r.label) + ' ' + fmtWon(r.y26) + '천원(' + actualPct.toFixed(1) + '%)"></div>';
  }).join('');
  return '<div class="ov2-propbar">'
    + '<div class="ov2-propbar-labels">' + labelsHtml + '</div>'
    + '<div class="ov2-propbar-track">' + segsHtml + '</div>'
    + '</div>';
}

function computeInstOverviewSummary() {
  var buckets = { '인건비': [0, 0], '운영비': [0, 0], '자산취득비': [0, 0] };
  function walk(node) {
    if (node.level === '목') {
      var b = classifyMokCode(node.code);
      buckets[b][0] += node.amt26 || 0;
      buckets[b][1] += node.amt25 || 0;
    }
    (node.children || []).forEach(walk);
  }
  (state.businesses || []).forEach(function (biz) {
    (biz.teams || []).forEach(function (t) {
      if (t.treeKey && TEAM_TREES[t.treeKey]) walk(TEAM_TREES[t.treeKey]);
    });
  });
  var order = ['인건비', '운영비', '자산취득비'];
  var rows = order.map(function (label) { return { label: label, y26: buckets[label][0], y25: buckets[label][1] }; });
  var total = rows.reduce(function (acc, r) { return { y26: acc.y26 + r.y26, y25: acc.y25 + r.y25 }; }, { y26: 0, y25: 0 });
  return { rows: rows, total: { label: '합계', y26: total.y26, y25: total.y25 } };
}

function computeInstDeptBreakdown() {
  function sumTree(node) {
    var s = { y26: 0, y25: 0 };
    if (node.level === '목') { s.y26 += node.amt26 || 0; s.y25 += node.amt25 || 0; }
    (node.children || []).forEach(function (c) { var r = sumTree(c); s.y26 += r.y26; s.y25 += r.y25; });
    return s;
  }
  var byDept = {};
  var order = [];
  (state.businesses || []).forEach(function (biz) {
    if (!biz.dept) return;
    if (!byDept[biz.dept]) { byDept[biz.dept] = { y26: 0, y25: 0 }; order.push(biz.dept); }
    (biz.teams || []).forEach(function (t) {
      if (t.treeKey && TEAM_TREES[t.treeKey]) {
        var r = sumTree(TEAM_TREES[t.treeKey]);
        byDept[biz.dept].y26 += r.y26;
        byDept[biz.dept].y25 += r.y25;
      }
    });
  });
  return order.map(function (d) { return { dept: d, y26: byDept[d].y26, y25: byDept[d].y25 }; });
}

function renderWitakDropdown(instKey) {
  var wrap = document.getElementById('witak-dropdown-wrap');
  var list = document.getElementById('witak-list');

  var data = WITAK_DATA[instKey];
  if (!data) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  checkbox.checked = false;
  var groups = {};
  var order = [];
  data.forEach(function (item) {
    if (!groups[item.dept]) { groups[item.dept] = []; order.push(item.dept); }
    groups[item.dept].push(item.name);
  });
  var html = order.map(function (dept) {
    var itemsHtml = groups[dept].map(function (name) {
      return '<li class="witak-listitem witak-project" role="listitem">' + escapeHtml(name) + '</li>';
    }).join('');
    return '<li class="witak-listitem witak-dept-heading" role="listitem">' + escapeHtml(dept) + '</li>' + itemsHtml;
  }).join('');
  list.innerHTML = html;
}

    var diffHtml = '';
    if (r.diff != null) {
      var diffTxt = r.diff > 0 ? '+' + r.diff : String(r.diff);
      diffHtml = '<span class="dept-diff ' + ov2DiffCls(r.diff) + '">' + diffTxt + '</span>';
    }
    var badgeHtml = '';
    var badgeParts = [];
    if (r.teams != null) badgeParts.push(r.teams + (r.teamsUnit || '팀'));
    if (r.gwan != null) badgeParts.push(r.gwan + '관');
    if (r.committee != null) badgeParts.push(r.committee + '위원');
    if (badgeParts.length) {
      badgeHtml = '<span class="dept-badge">' + badgeParts.join('·') + '</span>';
    }
    var subTeamsHtml = '';
    if (r.subTeams && r.subTeams.length) {
      var subTeamsTxt = r.subTeams.map(function (t) {
        var tVal = (t.capacity != null) ? (t.capacity + '(' + t.current + ')') : (t.current != null ? (t.current + '명') : '');
        return escapeHtml(t.name) + (tVal ? ' ' + tVal : '');
      }).join(', ');
      subTeamsHtml = '<p class="dept-subteams">' + subTeamsTxt + '</p>';
    }
    return '<div class="ov2-dept-card">'
      + badgeHtml
      + '<p class="dept-name">' + escapeHtml(r.label) + '</p>'
      + '<p class="dept-row"><span class="dept-val">' + valTxt + '</span>' + diffHtml + '</p>'
      + subTeamsHtml
      + '</div>';
  }).join('');
  return '<div class="ov2-dept-card-grid">' + cards + '</div>';
}

function ov2PersonnelBarList(rows, hoverMap) {
  var rowsHtml = rows.map(function (r) {
    var hasCap = r.capacity != null && r.capacity > 0;
    var pct = r.pctOverride != null ? r.pctOverride : (hasCap ? Math.min(100, Math.round((r.current / r.capacity) * 100)) : (r.current > 0 ? 100 : 0));
    var fillCls = r.tone === 'danger' ? ' danger' : (hasCap ? '' : ' na');
    var valTxt = (r.capacity != null) ? (r.capacity + '(' + r.current + ')') : (r.current + '명');
    var diffTxt = r.diff == null ? '-' : (r.diff > 0 ? '+' + r.diff : String(r.diff));
    var diffCls = r.diff == null ? 'na' : ov2DiffCls(r.diff);
    var labelParts = String(r.label).split('\n');
    var mainLabel = labelParts[0];
    var subLabel = labelParts[1] || null;
    var dividerHtml = r.sectionLabel ? '<div class="ov2-pbar-divider">' + escapeHtml(r.sectionLabel) + '</div>' : '';
    var hoverInfo = (hoverMap && hoverMap[mainLabel]) ? hoverMap[mainLabel] : null;
    var hoverHtml = hoverInfo ? hoverInfo.html : '';
    var hoverCls = hoverHtml ? ' ov2-pbar-row-hoverable' : '';
    var toneCls = r.tone === 'danger' ? ' ov2-pbar-row-danger' : '';
    return dividerHtml + '<div class="ov2-pbar-row' + hoverCls + toneCls + '">'
      + '<div class="ov2-pbar-label">'
        + '<div class="ov2-pbar-label-line"><span class="ov2-pbar-label-main">' + escapeHtml(mainLabel) + '</span><span class="ov2-pbar-val">' + valTxt + '</span></div>'
        + (subLabel ? '<div class="ov2-pbar-label-sub">' + escapeHtml(subLabel) + '</div>' : '')
      + '</div>'
      + '<div class="ov2-pbar-track"><div class="ov2-pbar-fill' + fillCls + '" style="width:' + pct + '%;"></div>' + (hoverHtml ? '<button type="button" class="grade-btn"><span class="grade-btn-tooltip"><span class="grade-btn-tooltip-label">직급별 보기</span></span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" class="grade-btn-icon"><path d="M6 10h8M10 6v8" stroke="#fff" stroke-width="2.2" stroke-linecap="round"></path></svg></button>' : '') + '</div>'
      + '<div class="ov2-pbar-diff ' + diffCls + '">' + diffTxt + '</div>'
      + (hoverHtml ? '<div class="ov2-box-tooltip">' + hoverHtml + '</div>' : '')
      + '</div>';
  }).join('');
  return '<div class="ov2-pbar-list">' + rowsHtml + '</div>';
}

function ov2ExecutionChart(rows, hasCompare) {
  var bars = rows.filter(function (r) { return r.label !== '총계'; }).map(function (r) {
    var currBar = hasCompare
      ? '<div class="ov2-exec-bar curr" style="height:' + Math.max(r.r26, 2) + '%;"><span class="ov2-exec-bar-val">' + r.r26.toFixed(1) + '%</span></div>'
      : '';
    return '<div class="ov2-exec-group">'
      + '<div class="ov2-exec-bars">'
        + '<div class="ov2-exec-bar prev" style="height:' + Math.max(r.r25, 2) + '%;"><span class="ov2-exec-bar-val">' + r.r25.toFixed(1) + '%</span></div>'
        + currBar
      + '</div>'
      + '<div class="ov2-exec-label">' + escapeHtml(r.label) + '</div>'
    + '</div>';
  }).join('');
  return '<div class="ov2-exec-wrap"><div class="ov2-exec-chart">' + bars + '</div></div>';
}

function ov2ExecutionTable(rows, hasCompare) {
  var head = hasCompare
    ? '<tr><th>구분</th><th>2025 예산액</th><th>2025 집행액</th><th>2025 집행률</th><th>2026 예산액</th><th>2026 집행액</th><th>2026 집행률</th></tr>'
    : '<tr><th>구분</th><th>2025 최종예산</th><th>2025 집행액</th><th>2025 집행률</th></tr>';
  var body = rows.map(function (r) {
    var cells = '<td>' + escapeHtml(r.label) + '</td><td>' + fmtWon(r.b25) + '</td><td>' + fmtWon(r.e25) + '</td><td>' + r.r25.toFixed(1) + '%</td>';
    if (hasCompare) cells += '<td>' + fmtWon(r.b26) + '</td><td>' + fmtWon(r.e26) + '</td><td>' + r.r26.toFixed(1) + '%</td>';
    return '<tr' + (r.label === '총계' ? ' class="total"' : '') + '>' + cells + '</tr>';
  }).join('');
  return '<div class="table-scroll"><table class="summary fc-summary"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}

function ov2ExecutionByFundChart(rows) {
  var bars = rows.map(function (r) {
    var barHtml = r.rate == null
      ? '<div class="ov2-exec-bar curr na" style="height:2%;"><span class="ov2-exec-bar-val">-</span></div>'
      : '<div class="ov2-exec-bar curr" style="height:' + Math.max(r.rate, 2) + '%;"><span class="ov2-exec-bar-val">' + r.rate.toFixed(0) + '%</span></div>';
    return '<div class="ov2-exec-group">'
      + '<div class="ov2-exec-bars">' + barHtml + '</div>'
      + '<div class="ov2-exec-label">' + escapeHtml(r.label) + '</div>'
    + '</div>';
  }).join('');
  return '<div class="ov2-exec-wrap"><div class="ov2-exec-chart">' + bars + '</div></div>';
}

function ov2ExecutionByFundTable(rows) {
  var body = rows.map(function (r) {
    var execTxt = r.exec == null ? '-' : fmtWon(r.exec);
    var remainTxt = (r.exec == null) ? '-' : fmtWon(r.budget - r.exec);
    var rateTxt = r.rate == null ? '-' : r.rate.toFixed(1) + '%';
    return '<tr><td>' + escapeHtml(r.label) + '</td><td>' + fmtWon(r.budget) + '</td><td>' + execTxt + '</td><td>' + remainTxt + '</td><td>' + rateTxt + '</td></tr>';
  }).join('');
  var totalBudget = rows.reduce(function (a, r) { return a + (r.budget || 0); }, 0);
  var totalExec = rows.reduce(function (a, r) { return a + (r.exec || 0); }, 0);
  var totalRemain = totalBudget - totalExec;
  var totalRate = totalBudget ? (totalExec / totalBudget * 100) : 0;
  var totalRow = '<tr class="total"><td>합계</td><td>' + fmtWon(totalBudget) + '</td><td>' + fmtWon(totalExec) + '</td><td>' + fmtWon(totalRemain) + '</td><td>' + totalRate.toFixed(1) + '%</td></tr>';
  return '<div class="table-scroll"><table class="summary fc-summary"><thead><tr><th>재원구분</th><th>예산액</th><th>집행액</th><th>집행잔액</th><th>집행률</th></tr></thead><tbody>' + totalRow + body + '</tbody></table></div>';
}

function renderOv2Overview(instKey) {
  var d = OV2_DATA[instKey];
  var legacy = document.getElementById('overview-legacy-blocks');
  if (legacy) legacy.style.display = 'none';
  document.getElementById('overview-summary-title').textContent = d.name + ' 총괄';

  // 1) 정현원 총괄 + 2) 정현원 현황 — 세로로 두 섹션을 쌓지 않고, 한 줄에 좌(총괄 카드)/우(현황) 2단으로 배치
  var cardsHtml = d.org.cards.map(function (c) {
    return settleKpiCard(c.tone, c.iconKey, c.label, c.value, c.extra || null);
  }).join('');

  var hoverMap = {};
  d.personnelGroups.forEach(function (g) {
    if (g.hoverOnly && g.hoverTarget) {

        return '<div class="ov2-tt-chip"><span class="ov2-tt-chip-label">' + escapeHtml(r.label) + '</span><span class="ov2-tt-chip-val">' + v + '</span></div>';
      }).join('');
      hoverMap[g.hoverTarget] = { html: '<div class="ov2-tt-title">' + escapeHtml(g.title) + '</div><div class="ov2-tt-chips">' + rowsHtml + '</div>' + (g.note ? '<div class="ov2-tt-note">' + escapeHtml(g.note) + '</div>' : ''), direction: g.hoverDirection || 'up' };
    }
  });
  var visibleGroups = d.personnelGroups.filter(function (g) { return !g.hoverOnly; });
  var groupsHtml = visibleGroups.map(function (g) {
    return '<div class="summary-box"><h3>' + escapeHtml(g.title) + '</h3>' + ov2PersonnelBarList(g.rows, hoverMap)
      + (g.note ? '<p class="ov2-pbar-note">' + escapeHtml(g.note) + '</p>' : '') + '</div>';
  }).join('');

  var orgHtml = '<div class="section-title-row"><h2 class="section-heading section-heading-lg">정현원 현황</h2></div>'
    + '<div class="ov2-two-col ov2-personnel-row">'
      + '<div><div class="settle-kpi-grid ov2-kpi-2col">' + cardsHtml + '</div></div>'
      + '<div>' + groupsHtml + '</div>'
    + '</div>';
  var gradeHtml = '';

  // 3) 소관별 정현원
  var deptPersonHtml = '<div class="section-title-row settle-section-gap"><h2 class="section-heading section-heading-lg">소관별 정현원</h2><span class="ov2-section-sub">' + escapeHtml(d.org.subtitle) + '</span></div>'
    + '<div class="summary-box">' + ov2PersonnelVBarList(d.byDept) + '</div>';

  // 4) 총수입 총괄 / 총지출 총괄
  var revTotal26 = d.revenueItems.reduce(function (a, r) { return a + r.y26; }, 0);
  var revTotal25 = d.revenueItems.reduce(function (a, r) { return a + r.y25; }, 0);
  var REV_HIGHLIGHT_LABELS = ['대행사업수익', '자치단체출연금수익', '출연금', '보조금'];
  var revRowsHtml = d.revenueItems.map(function (r, i) {
    var y26Html = REV_HIGHLIGHT_LABELS.indexOf(r.label) !== -1
      ? '<span class="ov2-rev-marker">' + fmtWon(r.y26) + '</span>'
      : fmtWon(r.y26);
    return '<tr><td>' + escapeHtml(r.label) + '</td><td>' + y26Html + '</td><td>' + fmtWon(r.y25) + '</td>' + diffCellHtml(r.y25, r.y26) + '</tr>';
  }).join('');
  var revTotalHtml = '<tr class="total"><td>계</td><td>' + fmtWon(revTotal26) + '</td><td>' + fmtWon(revTotal25) + '</td>' + diffCellHtml(revTotal25, revTotal26) + '</tr>';
  var revDetailHtml = '';
  if (d.revenueDetail) {
    var revDetailTotal26 = d.revenueDetail.reduce(function (a, r) { return a + r.y26; }, 0);
    var revDetailTotal25 = d.revenueDetail.reduce(function (a, r) { return a + r.y25; }, 0);
    var revDetailTotalRow = '<tr class="total"><td>계</td><td>' + fmtWon(revDetailTotal26) + '</td><td>' + fmtWon(revDetailTotal25) + '</td>' + diffCellHtml(revDetailTotal25, revDetailTotal26) + '</tr>';
    var revDetailRowHtml = function (r) {
      var detailY26Html = REV_HIGHLIGHT_LABELS.indexOf(r.label) !== -1
        ? '<span class="ov2-rev-marker">' + fmtWon(r.y26) + '</span>'
        : fmtWon(r.y26);
      return '<tr><td>' + escapeHtml(r.label) + '</td><td>' + detailY26Html + '</td><td>' + fmtWon(r.y25) + '</td>' + diffCellHtml(r.y25, r.y26) + '</tr>';
    };
    var revDetailRows;
    if (d.revenueDetail.some(function (r) { return r.group; })) {
      var revDetailGroups = [];
      var revDetailGroupMap = {};
      d.revenueDetail.forEach(function (r) {
        if (!revDetailGroupMap[r.group]) { revDetailGroupMap[r.group] = { label: r.group, items: [] }; revDetailGroups.push(revDetailGroupMap[r.group]); }
        revDetailGroupMap[r.group].items.push(r);
      });
      revDetailRows = revDetailGroups.map(function (g) {
        var gRowsHtml = g.items.map(revDetailRowHtml).join('');
        var gTotal26 = g.items.reduce(function (a, r) { return a + r.y26; }, 0);
        var gTotal25 = g.items.reduce(function (a, r) { return a + r.y25; }, 0);
        var gHeaderHtml = '<tr class="ov2-rev-group-row"><td>' + escapeHtml(g.label) + '</td><td>' + fmtWon(gTotal26) + '</td><td>' + fmtWon(gTotal25) + '</td>' + diffCellHtml(gTotal25, gTotal26) + '</tr>';
        return gHeaderHtml + gRowsHtml;
      }).join('');
    } else {
      revDetailRows = d.revenueDetail.map(revDetailRowHtml).join('');
    }
    revDetailHtml = '<div class="table-scroll"><table class="summary fc-summary ov2-income-table ov2-rev-total-table"><thead><tr><th>구&nbsp;&nbsp;분</th><th>2026년</th><th>2025년</th><th>증&nbsp;&nbsp;감</th></tr></thead><tbody>' + revDetailTotalRow + revDetailRows + '</tbody></table></div>';
  }

  var expTotal26 = d.budgetCompare.reduce(function (a, r) { return a + r.y26; }, 0);
  var expTotal25 = d.budgetCompare.reduce(function (a, r) { return a + r.y25; }, 0);
  var expRowsHtml = d.budgetCompare.map(function (r, i) {
    return '<tr><td><span class="dot" style="background:' + donutGradientCss(i) + '"></span>' + escapeHtml(r.label) + '</td><td>' + fmtWon(r.y26) + '</td><td>' + fmtWon(r.y25) + '</td>' + diffCellHtml(r.y25, r.y26) + '</tr>';
  }).join('');
  var expTotalHtml = '<tr class="total"><td>합계</td><td>' + fmtWon(expTotal26) + '</td><td>' + fmtWon(expTotal25) + '</td>' + diffCellHtml(expTotal25, expTotal26) + '</tr>';

  var revPct = revTotal25 ? (((revTotal26 - revTotal25) / revTotal25) * 100).toFixed(1) : '0.0';
  var expPct = expTotal25 ? (((expTotal26 - expTotal25) / expTotal25) * 100).toFixed(1) : '0.0';

  // 지출총괄표 (재원별) - 수입총괄 옆 칸에 배치
  var expenseBreakdownHtml = '';
  if (d.expenseBreakdown) {
    var eb = d.expenseBreakdown;
    // 기타재원 총액이 있는 기관은 위탁사업비 옆에 별도 열로 보여주고, 없는 기관은 열 자체를 생략한다
    var ebHasOtherFund = !!eb.grandTotal.values[2];
    var ebCols = ebHasOtherFund ? eb.columns.concat(['기타재원']) : eb.columns;
    var ebHeadHtml = '<th>구&nbsp;&nbsp;분</th><th>계</th>' + ebCols.map(function (c) { return '<th>' + escapeHtml(c) + '</th>'; }).join('');
    var ebGrandRow = '<tr class="total"><td>총 계</td><td>' + fmtWon(eb.grandTotal.total) + '</td>' + eb.grandTotal.values.slice(0, ebCols.length).map(function (v) { return '<td>' + (v ? fmtWon(v) : '-') + '</td>'; }).join('') + '</tr>';
    var ebSectionsHtml = eb.sections.map(function (sec) {
      var secRow = '<tr class="ov2-eb-section"><td>' + escapeHtml(sec.label) + '</td><td>' + fmtWon(sec.total) + '</td>' + sec.values.slice(0, ebCols.length).map(function (v) { return '<td>' + (v ? fmtWon(v) : '-') + '</td>'; }).join('') + '</tr>';
      var subRows = sec.rows.map(function (r) {
        return '<tr class="ov2-eb-row"><td>' + escapeHtml(r.label) + '</td><td>' + fmtWon(r.total) + '</td>' + r.values.slice(0, ebCols.length).map(function (v) { return '<td>' + (v ? fmtWon(v) : '-') + '</td>'; }).join('') + '</tr>';
      }).join('');
      return secRow + subRows;
    }).join('');
    // 기타재원을 열로 이미 보여준 경우 각주는 중복이므로 생략한다
    var ebFootnoteHtml = '';
    expenseBreakdownHtml = '<div class="summary-box"><p class="ov2-unit-note" style="margin:0 2px 2px;">(단위: 천원)</p><div class="table-scroll"><table class="summary fc-summary ov2-income-table ov2-expense-table ov2-inst-' + instKey + '"><thead><tr>' + ebHeadHtml + '</tr></thead><tbody>' + ebGrandRow + ebSectionsHtml + '</tbody></table></div>' + ebFootnoteHtml + '</div>';
  }

  var incomeBoxHtml = '<div class="summary-box">' + (d.hideIncomeTitle ? '' : '<h3>총 수입</h3>')
        + buildIncomeProportionBar(d.revenueItems, revTotal26)
        + '<p class="ov2-unit-note">(단위: 천원)</p>'
        + '<div class="table-scroll"><table class="summary fc-summary ov2-income-table ov2-rev-total-table ov2-inst-' + instKey + '"><thead><tr><th>구&nbsp;&nbsp;분</th><th>2026년</th><th>2025년</th><th>증&nbsp;&nbsp;감</th></tr></thead><tbody>' + revTotalHtml + revRowsHtml + '</tbody></table></div>'
        + (revDetailHtml ? '<div class="ov2-rev-detail-sub"><h4>' + escapeHtml(d.revenueDetailTitle || '세부 내역') + '</h4>' + revDetailHtml + '</div>' : '')
      + '</div>';

  var incomeExpenseHtml;
  if (expenseBreakdownHtml) {
    incomeExpenseHtml = '<div class="ov2-two-col ov2-inst-' + instKey + '">'
      + '<div>'
        + '<div class="section-title-row settle-section-gap"><h2 class="section-heading section-heading-lg">2026년 수입총괄</h2></div>'
        + incomeBoxHtml
      + '</div>'
      + '<div>'
        + '<div class="section-title-row settle-section-gap"><h2 class="section-heading section-heading-lg">2026년 지출총괄</h2></div>'
        + expenseBreakdownHtml
      + '</div>'
    + '</div>';
  } else {
    incomeExpenseHtml = '<div class="section-title-row settle-section-gap"><h2 class="section-heading section-heading-lg">2026년 수입총괄</h2></div>'
      + '<div class="' + (revDetailHtml ? 'ov2-two-col' : '') + '">'
        + incomeBoxHtml
        + (revDetailHtml ? '<div class="summary-box"><div class="summary-title-row"><h3>' + escapeHtml(d.revenueDetailTitle || '세부 내역') + '</h3><p class="summary-unit-note">(단위: 천원)</p></div>' + revDetailHtml + '</div>' : '')
      + '</div>';
  }

  // 6) 예산편성현황 - 세로: 연도별(2026년/2025년), 가로: 인건비~사업비/총계. 증감은 별도 칸 없이 헤더의 항목명 옆에 표기
  var bcHeadCell = function (label, y25, y26, extraClass) {
    var d2 = y26 - y25;
    var pct = y25 ? (d2 / y25 * 100).toFixed(1) : '0.0';
    var cls = d2 >= 0 ? 'up' : 'down';
    var sign = d2 >= 0 ? '+' : '';
    return '<th' + (extraClass ? ' class="' + extraClass + '"' : '') + '>' + escapeHtml(label) + '&nbsp;<span class="ov2-bc-hdiff ' + cls + '">' + sign + fmtWon(d2) + ' (' + sign + pct + '%)</span></th>';
  };
  var bcHeadHtml = '<th>구&nbsp;&nbsp;분</th>' + d.budgetCompare.map(function (r) { return bcHeadCell(r.label, r.y25, r.y26); }).join('') + bcHeadCell('총계', expTotal25, expTotal26, 'ov2-bc-total');
  var bcY26Html = '<tr><td>2026년</td>' + d.budgetCompare.map(function (r) { return '<td>' + fmtWon(r.y26) + '</td>'; }).join('') + '<td class="ov2-bc-total">' + fmtWon(expTotal26) + '</td></tr>';
  var bcY25Html = '<tr><td>2025년</td>' + d.budgetCompare.map(function (r) { return '<td>' + fmtWon(r.y25) + '</td>'; }).join('') + '<td class="ov2-bc-total">' + fmtWon(expTotal25) + '</td></tr>';
  var budgetCompareHtml = '<div class="section-title-row settle-section-gap"><h2 class="section-heading section-heading-lg">예산편성현황</h2></div>'
    + '<div class="summary-box"><p class="ov2-unit-note" style="margin:0 2px 8px;">(단위: 천원)</p><div class="table-scroll"><table class="summary fc-summary ov2-income-table ov2-budget-fmt ov2-bc-table"><thead><tr>'
    + bcHeadHtml
    + '</tr></thead><tbody>' + bcY26Html + bcY25Html + '</tbody></table></div></div>';

  // 7) 지출총괄표는 위 incomeExpenseHtml 안에 이미 포함됨

  document.getElementById('overview-v2-slot').innerHTML = orgHtml + gradeHtml + deptPersonHtml + budgetCompareHtml + incomeExpenseHtml;
}

var LEVEL_BASE_DEPTH = { '팀': 0, '정책': 0, '단위': 1, '세부': 2, '목': 3, '세목': 4 };
var LEAF_BULLETS = { 5: '○ ', 6: '- ', 7: '· ', 8: '‣ ' };
function bulletForDepth(d) { return LEAF_BULLETS[d] || LEAF_BULLETS[8]; }

function fmtDiff(amt26, amt25) {
  if (amt25 == null) amt25 = 0;
  var d = (amt26 || 0) - amt25;
  if (d === 0) return '-';
  var sign = d > 0 ? '' : '△ ';
  return sign + fmtWon(Math.abs(d));
}
function fmtPct(amt26, amt25) {
  if (!amt25) return amt26 ? '<span style="color:var(--accent)">신규</span>' : '0%';
  var d = amt26 - amt25;
  return Math.round(d / amt25 * 100) + '%';
}

}
var DEFAULT_TREE_COL_WIDTHS = [34, 28, 10, 10, 10, 8];
function loadTreeColWidths() {
  try {
    var raw = localStorage.getItem('hscf_tree_col_widths_v2');
    if (raw) {

      if (Array.isArray(parsed) && parsed.length === DEFAULT_TREE_COL_WIDTHS.length) return parsed;
    }
  } catch (e) {}
  return DEFAULT_TREE_COL_WIDTHS.slice();
}
function saveTreeColWidths(widths) {
  try { localStorage.setItem('hscf_tree_col_widths_v2', JSON.stringify(widths)); } catch (e) {}
}
var treeColWidths = loadTreeColWidths();
function applyTreeColWidths() {
  treeColWidths.forEach(function (w, i) {
    document.querySelectorAll('.tcol-' + i).forEach(function (col) { col.style.width = w + '%'; });

}
var treeDragState = { col: null, startX: 0, startWidth: 0, containerWidth: 1000 };
document.addEventListener('mousemove', function (e) {
  if (treeDragState.col == null) return;
  var deltaPct = (e.clientX - treeDragState.startX) / treeDragState.containerWidth * 100;
  treeColWidths[treeDragState.col] = Math.max(4, treeDragState.startWidth + deltaPct);
  applyTreeColWidths();
});
document.addEventListener('mouseup', function () {
  if (treeDragState.col != null) {
    saveTreeColWidths(treeColWidths);
    var h = document.querySelector('.col-resize-handle.resizing');
    if (h) h.classList.remove('resizing');
  }
  treeDragState.col = null;
});
function setupTreeColResize() {
  document.querySelectorAll('.tree-container').forEach(function (container) {
    container.onmousedown = function (e) {
      var handle = e.target.closest ? e.target.closest('.col-resize-handle') : null;
      if (!handle) return;
      e.preventDefault();
      treeDragState.col = parseInt(handle.getAttribute('data-resize'), 10);
      treeDragState.startX = e.clientX;
      treeDragState.startWidth = treeColWidths[treeDragState.col] || 10;
      treeDragState.containerWidth = (container.getBoundingClientRect ? container.getBoundingClientRect().width : 1000) || 1000;
      handle.classList.add('resizing');

  });
}

// 산출기초("200,000원*8명*1회" 등 곱셈 구조)를 파싱해서 실제 계산 금액(원 단위)을 반환. 곱셈 구조가 아니면 null(검증불가)
function parseCalcAmount(calc) {
  if (!calc) return null;
  var parts = calc.split(/[*×xX]/).map(function (p) { return p.trim(); }).filter(Boolean);
  if (parts.length < 2) return null;
  var nums = [];
  for (var i = 0; i < parts.length; i++) {
    var m = parts[i].match(/[\d,]+(\.\d+)?/);
    if (!m) return null;
    var n = parseFloat(m[0].replace(/,/g, ''));
    if (isNaN(n)) return null;
    nums.push(n);
  }
  return nums.reduce(function (a, b) { return a * b; }, 1);
}
// node.calc와 node.amt26(천원)을 비교해 불일치 여부 판정. 검증 불가/일치 시 null, 불일치 시 계산값(천원) 반환
function checkCalcMismatch(node) {
  var computed = parseCalcAmount(node.calc);
  if (computed == null) return null;
  var computedThousand = Math.round(computed / 1000);
  var diff = Math.abs(computedThousand - (node.amt26 || 0));
  if (diff > 1) return computedThousand; // 1천원 이내 오차는 반올림 오차로 간주해 통과
  return null;
}

var budgetItemIndex = {};
function renderTreeRows(node, out, parentDepth, parentPath, parentVisible) {
  budgetItemIndex[node.id] = node;
  var depth = LEVEL_BASE_DEPTH.hasOwnProperty(node.level) ? LEVEL_BASE_DEPTH[node.level] : (parentDepth + 1);
  var nodePath = (parentPath ? parentPath + '>' : '') + node.level + ':' + node.name;
  var label = (node.level === '팀' ? node.name
    : node.level === '정책' ? '[정책] ' + node.name
    : node.level === '단위' ? '[단위] ' + node.name
    : node.level === '세부' ? '[세부] ' + node.name
    : (node.level === '목' || node.level === '세목') ? (node.code ? node.code + ' ' : '') + node.name
    : bulletForDepth(depth) + node.name);
  var cls = (node.level === '팀' || node.level === '정책' || node.level === '단위' || node.level === '세부' || node.level === '목' || node.level === '세목') ? node.level : 'leaf';
  var mokAttr = node._mokTag ? (' data-mok="' + escapeHtml(node._mokTag) + '"') : '';
  var amt25Cell = node.amt25 != null && node.amt25 !== 0 ? fmtWon(node.amt25) : (node.amt25 === 0 ? '-' : '');
  var hasChildren = node.children && node.children.length;
  var expanded = hasChildren ? isExpandedPath(nodePath, node.level) : false;
  var arrowHtml = hasChildren
    ? '<span class="tgl" onclick="toggleNode(event,\'' + nodePath.replace(/'/g, "\\'") + '\',\'' + node.level + '\')">' + (expanded ? '\u25BE' : '\u25B8') + '</span>'
    : '<span class="tgl" style="visibility:hidden">\u25B8</span>';
  var rowVisible = parentVisible;
  var hiddenCls = rowVisible ? '' : ' row-hidden-collapse';
  var searchText = (node.name || '') + ' ' + (node.calc || '');
  var mismatchAmt = checkCalcMismatch(node);
  var mismatchCls = mismatchAmt != null ? ' calc-mismatch' : '';
  var mismatchAttr = mismatchAmt != null ? ' data-mismatch="1"' : '';
  var mismatchIcon = mismatchAmt != null
    ? '<span class="mismatch-flag" title="산출기초 계산값 ' + fmtWon(mismatchAmt) + '천원 ≠ 입력 금액 ' + fmtWon(node.amt26) + '천원">\u26A0</span>'
    : '';
  var increasedAttr = (Number(node.amt26) || 0) > (Number(node.amt25) || 0) ? ' data-increased="1"' : '';
  var isNew = (!node.amt25 || Number(node.amt25) === 0) && (Number(node.amt26) || 0) > 0;
  var newAttr = isNew ? ' data-new="1"' : '';
  var editedCls = node.edited ? ' row-edited' : '';
  var cellCheckBtn = '<label class="cell-check-btn" title="눌러서 저장">'
    + '<input type="checkbox" onchange="saveBudgetCellEdit(' + node.id + ', this)">'
    + '<svg class="pin" viewBox="0 0 75 100" xmlns="http://www.w3.org/2000/svg">'
    + '<line stroke-width="12" y2="100" x2="37" y1="64" x1="37"></line>'
    + '<path stroke-width="10" d="M16.5 36V4.5H58.5V36V53.75V54.9752L59.1862 55.9903L66.9674 67.5H8.03256L15.8138 55.9903L16.5 54.9752V53.75V36Z"></path>'
    + '</svg></label>';
  // 편성목(목) 이후부터는(세목·leaf) 들여쓰기를 더 늘리지 않고 그 자리에서 맞춘다 - 코드/불릿 표시로 이미 구분되니까
  var indentDepth = Math.min(depth, LEVEL_BASE_DEPTH['목']);
  out.push('<tr class="lvl-' + cls + hiddenCls + mismatchCls + editedCls + '" data-id="' + node.id + '"' + mokAttr + mismatchAttr + increasedAttr + newAttr + ' data-search="' + escapeHtml(searchText.toLowerCase()) + '">'
    + '<td style="padding-left:' + (8 + indentDepth * 14) + 'px">' + arrowHtml + ' ' + escapeHtml(label) + mismatchIcon + '</td>'
    + '<td class="num basis" contenteditable="true" spellcheck="false" data-field="calc">' + escapeHtml(node.calc || '') + cellCheckBtn + '</td>'
    + '<td class="num" contenteditable="true" spellcheck="false" data-field="amt26">' + fmtWon(node.amt26) + cellCheckBtn + '</td>'
    + '<td class="num" contenteditable="true" spellcheck="false" data-field="amt25">' + amt25Cell + cellCheckBtn + '</td>'
    + '<td class="num">' + fmtDiff(node.amt26, node.amt25) + '</td>'
    + '<td class="num pct">' + fmtPct(node.amt26, node.amt25) + '</td>'
    + '</tr>');
  if (node.children) node.children.forEach(function (c) { renderTreeRows(c, out, depth, nodePath, rowVisible && expanded); });
}

// ===== 엑셀 업로드: 파싱 + 미리보기 =====
// 1단계(현재 구현): 업로드한 엑셀을 시트 그대로 읽어 미리보기로 보여준다.
// 2단계(추후): 기관별 컬럼 매핑 설정을 적용해 정책→단위→세부→목→세목→항목 트리로 변환 후
//   budget_items에 실제 반영(각 회차는 덮어쓰지 않고 새 이력으로 추가)하는 로직을 여기에 연결한다.
function handleBudgetUploadFile(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') { alert('엑셀 파싱 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.'); return; }

  var reader = new FileReader();
  reader.onload = function (ev) {
    try {
      var wb = XLSX.read(ev.target.result, { type: 'array' });
      var sheetName = wb.SheetNames[0];
      var ws = wb.Sheets[sheetName];
      var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      openUploadPreviewModal(file.name, sheetName, rows);
    } catch (err) {
      alert('엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}

function openUploadPreviewModal(fileName, sheetName, rows) {
  closeUploadPreviewModal();
  var maxPreviewRows = 50;
  var headerRow = rows[0] || [];
  var bodyRows = rows.slice(1, 1 + maxPreviewRows);
  var totalDataRows = Math.max(0, rows.length - 1);

  var theadHtml = '<tr>' + headerRow.map(function (h, i) { return '<th>' + escapeHtml(String(h || ('열' + (i + 1)))) + '</th>'; }).join('') + '</tr>';
  var tbodyHtml = bodyRows.map(function (r) {
    return '<tr>' + headerRow.map(function (_, i) { return '<td>' + escapeHtml(String(r[i] != null ? r[i] : '')) + '</td>'; }).join('') + '</tr>';
  }).join('');

  var html = '<div class="upload-modal-overlay" id="upload-modal-overlay" onclick="if(event.target===this) closeUploadPreviewModal()">'
    + '<div class="upload-modal">'
    + '<div class="upload-modal-head"><div><h3>업로드 미리보기</h3><div class="um-sub">' + escapeHtml(fileName) + ' · 시트 "' + escapeHtml(sheetName) + '" · 총 ' + totalDataRows + '행'
    + (totalDataRows > maxPreviewRows ? ' (상위 ' + maxPreviewRows + '행만 표시)' : '') + '</div></div>'
    + '<button type="button" class="upload-modal-close" onclick="closeUploadPreviewModal()">✕</button></div>'
    + '<div class="upload-modal-body">'
    + '<div class="um-notice">파일이 정상적으로 읽혔는지 원본 그대로 미리보기로 보여드립니다. 이 내용을 실제 예산서 항목(정책·단위·세부·목·세목)에 반영하는 매핑 작업은 아직 연결 전이라, 확인만 가능하고 저장 버튼은 비활성화되어 있습니다.</div>'
    + '<table class="um-preview"><thead>' + theadHtml + '</thead><tbody>' + tbodyHtml + '</tbody></table>'
    + '</div>'
    + '<div class="upload-modal-foot"><button type="button" class="um-btn cancel" onclick="closeUploadPreviewModal()">닫기</button>'
    + '<button type="button" class="um-btn confirm" disabled title="기관별 매핑 연결 전에는 반영할 수 없습니다">확인 후 반영</button></div>'
    + '</div></div>';

  var wrap = document.createElement('div');
  wrap.id = 'upload-modal-root';
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
}

function closeUploadPreviewModal() {
  var el = document.getElementById('upload-modal-root');
  if (el) el.remove();
}

// 현재 선택된 카드의 예산 트리를 [헤더, ...행] 2차원 배열로 수집 (엑셀/PDF/CSV 공통)
function collectCurrentTreeRows() {
  if (nav.view === 'placeholder' && sportsBizState.list && sportsBizState.list.length) {
    var sportsBiz = sportsBizState.list[sportsBizState.selected];
    var sportsTree = sportsBiz && SPORTS_BIZ_TREES[sportsBiz.label];
    if (!sportsTree) return null;
    var sportsRows = [['구분', '산출기초', '2026년도', '2025년도', '비교증감', '증감률']];
    (function walk(node, depth) {
      var prefix = depth > 0 ? Array(depth + 1).join('  ') : '';
      var diff = (node.amt26 || 0) - (node.amt25 || 0);
      var pct = node.amt25 ? ((diff / node.amt25) * 100).toFixed(1) + '%' : '';
      sportsRows.push([prefix + sportsBizNodeLabel(node), node.calc || '', node.amt26 || 0, node.amt25 || 0, diff, pct]);
      (node.children || []).forEach(function (c) { walk(c, depth + 1); });
    })(sportsTree, 0);
    return { name: sportsBiz.label, rows: sportsRows };
  }
  var b = getBusiness(state.selectedId);
  if (!b || !b.teams || !b.teams.length) return null;
  var trees = b.teams.filter(function (t) { return t.treeKey && TEAM_TREES[t.treeKey]; }).map(function (t) { return TEAM_TREES[t.treeKey]; });
  if (!trees.length) return null;

  var rows = [['구분', '산출기초', '2026년도', '2025년도', '비교증감', '증감률']];
  function walk(node, depth) {
    var prefix = depth > 0 ? Array(depth + 1).join('  ') : '';
    var label = (node.level === '팀' ? node.name
      : node.level === '정책' ? '[정책] ' + node.name
      : node.level === '단위' ? '[단위] ' + node.name
      : node.level === '세부' ? '[세부] ' + node.name
      : (node.level === '목' || node.level === '세목') ? (node.code ? node.code + ' ' : '') + node.name
      : node.name);
    var diff = (node.amt26 || 0) - (node.amt25 || 0);
    var pct = node.amt25 ? ((diff / node.amt25) * 100).toFixed(1) + '%' : '';
    rows.push([prefix + label, node.calc || '', node.amt26 || 0, node.amt25 || 0, diff, pct]);
    (node.children || []).forEach(function (c) { walk(c, depth + 1); });
  }
  trees.forEach(function (t) { walk(t, 0); });
  return { name: b.name || '예산', rows: rows };
}

function filterTreeRows(query) {
  var q = query.trim().toLowerCase();
  var rows = document.querySelectorAll('#detail table.tree tbody tr');
  if (!q) {
    rows.forEach(function (tr) {
      tr.classList.remove('search-match', 'search-dim');
      tr.classList.remove('row-hidden-collapse-forced');
    });
    // 검색 지우면 원래 접힘 상태로 복귀 (화성시체육회 사업카드는 별도 렌더러를 쓴다)
    if (nav.view === 'placeholder' && sportsBizState.list && sportsBizState.list.length) {
      selectSportsBizCard(sportsBizState.selected);
    } else {
      renderDetail();
    }
    return;
  }
  rows.forEach(function (tr) {
    tr.classList.remove('row-hidden-collapse');
    var hay = tr.getAttribute('data-search') || '';
    if (hay.indexOf(q) !== -1) {
      tr.classList.add('search-match');
      tr.classList.remove('search-dim');
    } else {
      tr.classList.remove('search-match');
      tr.classList.add('search-dim');
    }
  });
}

async function saveBudgetCellEdit(id, btnEl) {
  var node = budgetItemIndex[id];
  if (!node) return;
  var tr = btnEl.closest('tr');
  var calcEl = tr.querySelector('[data-field="calc"]');
  var amt26El = tr.querySelector('[data-field="amt26"]');
  var amt25El = tr.querySelector('[data-field="amt25"]');

  var stripBtnText = function (el) {
    if (!el) return '';
    var clone = el.cloneNode(true);
    var btn = clone.querySelector('.cell-check-btn');
    if (btn) btn.remove();
    return clone.textContent.trim();
  };

  var rawCalc = stripBtnText(calcEl) || (node.calc || '');
  var rawAmt26 = stripBtnText(amt26El);
  var rawAmt25 = stripBtnText(amt25El);

  var numAmt26 = Number(rawAmt26.replace(/[^0-9.-]/g, ''));
  if (rawAmt26 === '' || rawAmt26 === '-') numAmt26 = 0;
  if (isNaN(numAmt26)) { alert('2026년도 예산액은 숫자만 입력해주세요.'); btnEl.checked = false; return; }

  var numAmt25 = Number(rawAmt25.replace(/[^0-9.-]/g, ''));
  if (rawAmt25 === '' || rawAmt25 === '-') numAmt25 = 0;
  if (isNaN(numAmt25)) { alert('2025년도 예산액은 숫자만 입력해주세요.'); btnEl.checked = false; return; }

  var payload = { edited: true, calc: rawCalc || null, amt26: numAmt26, amt25: numAmt25 };

  // 화성시체육회 사업카드는 실제 budget_items 행이 없으므로 DB에 쓰지 않고 메모리상의 트리 노드만 갱신한다.
  if (node._sportsFake) {
    node.edited = true;
    node.calc = payload.calc;
    node.amt26 = payload.amt26;
    node.amt25 = payload.amt25;
    btnEl.checked = false;
    renderSportsBizDetail(sportsBizState.selected);
    return;
  }

  btnEl.disabled = true;
  var { error } = await db.from('budget_items').update(payload).eq('id', id);
  if (error) {
    btnEl.disabled = false;
    btnEl.checked = false;
    alert('저장 실패: ' + error.message);
    return;
  }

  node.edited = true;
  node.calc = payload.calc;
  node.amt26 = payload.amt26;
  node.amt25 = payload.amt25;

  // 저장 완료: 이 행의 편집 체크 아이콘 표시 해제(다음 렌더링에서 자연히 사라짐)
  tr.querySelectorAll('td[contenteditable="true"]').forEach(function (t) { t.classList.remove('cell-touched'); });

  // 트리/요약/카드 화면 전체 재계산 (증감·비율·도넛차트 등에 즉시 반영)
  renderDetail();
  renderSummary();
}

function toggleNotePopover(id, forceOpen) {
  var pop = document.getElementById('notepop-' + id);

  document.querySelectorAll('.note-popover').forEach(function (p) { if (p !== pop) p.style.display = 'none'; });

    + '<div class="tree-scroll"><div class="tree-container" id="treecontainer-' + instId + '">'
    + '<table class="tree">' + colgroup
    + '<thead><tr>' + headCells + '</tr></thead>'
    + '<tbody>' + totalRowHtml + rows.join('') + '</tbody></table>'
    + '</div></div></div>';
}
function renderTeamTree(tree) {
  return renderTeamTreesCombined([tree]);
}
function toggleMokFilter(instId, e) {
  e.stopPropagation();
  var pop = document.getElementById('mokpop-' + instId);
  if (!pop) return;
  pop.style.display = (pop.style.display === 'none') ? 'block' : 'none';
}
function closeMokFilter(instId) {
  var pop = document.getElementById('mokpop-' + instId);
  if (!pop) return;
  pop.style.display = 'none';
}
document.addEventListener('click', function (e) {
  document.querySelectorAll('.mok-filter-popover').forEach(function (pop) {
    if (pop.style.display === 'none') return;
    if (!pop.contains(e.target) && !e.target.closest('.th-filter-label')) pop.style.display = 'none';
  });
});
function setAllMokFilter(instId, checked) {
  var pop = document.getElementById('mokpop-' + instId);
  if (!pop) return;
  pop.querySelectorAll('input[type=checkbox]').forEach(function (cb) { cb.checked = checked; });
  applyMokFilter(instId);
}
function applyMokFilter(instId) {
  var pop = document.getElementById('mokpop-' + instId);
  var container = document.getElementById('treecontainer-' + instId);
  if (!pop || !container) return;
  var unchecked = [];
  pop.querySelectorAll('input[data-mok-tag]').forEach(function (cb) {
    if (!cb.checked) unchecked.push(cb.getAttribute('data-mok-tag'));
  });
  container.querySelectorAll('tbody tr').forEach(function (row) {
    var tag = row.getAttribute('data-mok');
    row.classList.toggle('mok-hidden', !!(tag && unchecked.indexOf(tag) !== -1));
  });
}

function renderDetail() {
  var b = getBusiness(state.selectedId);
  var el = document.getElementById('detail');
  var roundRow = document.getElementById('round-tabs-row');
  var badgeRow = document.getElementById('tab-headcount-badge-row');
  if (!b) {
    el.innerHTML = '';
    if (roundRow) roundRow.style.display = 'none';
    if (badgeRow) badgeRow.style.display = 'none';
    var emptyBadge = document.getElementById('tab-headcount-badge');
    if (emptyBadge) emptyBadge.innerHTML = '';
    return;
  }
  if (roundRow) roundRow.style.display = 'flex';
  if (badgeRow) badgeRow.style.display = 'flex';
  // 2026년 외 연도는 아직 실제 데이터(amt26/amt25)가 없으므로, 탭·회차 선택은 그대로 두고 상세 영역만 안내 문구로 대체한다.
  if (state.selectedYear && state.selectedYear !== 2026) {
    el.innerHTML = '<div class="empty-state">' + state.selectedYear + '년 자료가 아직 없습니다.</div>';
    return;
  }
  // 예산액은 정현원과 분리된 큰 글씨 라인으로 표시하며, teams(정원현원) 데이터 유무와 무관하게 독립적으로 노출한다.
  var amtLine = (b.amt != null) ? '<div class="detail-total-amt">' + fmtWon(b.amt) + '<span class="unit">천원</span></div>' : '';
  var headcountLine = '';
  if (b.teams && b.teams.length) {
    var totalCap = 0, totalCur = 0;
    var anyCapacity = b.teams.some(function (t) { return t.capacity != null; });
    var anyCurrent = b.teams.some(function (t) { return t.current != null; });
    var namesOnly = [];
    var numbered = [];
    b.teams.forEach(function (t) {
      totalCap += Number(t.capacity) || 0;
      totalCur += Number(t.current) || 0;
      if (!t.name) return; // 이름 없는 항목은 총원 집계에만 쓰고 목록엔 표시하지 않음
      namesOnly.push(escapeHtml(t.name));
      if (anyCapacity) {
        var hasOwnNumbers = t.capacity != null || t.current != null;
        numbered.push(hasOwnNumbers ? (escapeHtml(t.name) + ' ' + t.capacity + '(' + t.current + ')') : escapeHtml(t.name));
      } else if (anyCurrent) {
        numbered.push(t.current != null ? (escapeHtml(t.name) + ' ' + t.current) : escapeHtml(t.name));
      } else {
        numbered.push(escapeHtml(t.name));
      }
    });
    // 자체수익/보조금처럼 정원·현원 데이터가 전혀 없는 카드는 인원 텍스트 줄 자체를 표시하지 않는다.
    if (anyCapacity || anyCurrent) {
      var branches = LIBRARY_BRANCHES[b.name];
      var suffixName = (branches && branches.length) ? branches.map(escapeHtml).join(', ') : (namesOnly[0] || '');
      var totalLabel = anyCapacity ? ('정현원 ' + totalCap + '(' + totalCur + ')') : ('현원 ' + totalCur);
      // 총계만 항상 노출하고, 팀별 세부내역은 호버 시에만 풍선으로 보여준다 (탭 옆 공간을 잡아먹지 않기 위함)
      var detailText = (namesOnly.length <= 1) ? suffixName : numbered.join(', ');
      var infoIconHtml = detailText
        ? '<span class="headcount-info-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></span>'
        : '';

// 회차(본예산/1회추경/2회추경/3회추경) 적용 - 본예산이 아니면 Supabase에서 그 회차의 트리를 새로 불러와 교체 렌더링한다.
// 회차 라디오 변경과, 부서/사업 탭을 바꾼 뒤 이전 회차 선택을 유지할 때 양쪽에서 재사용한다.
async function applyRound(round) {
  // 화성시체육회 사업카드는 실제 회차별(1추~3추) 데이터가 없어 - 본예산만 그대로 보여주고, 나머지 회차는 다른 기관과 동일하게 "자료 없음" 처리.
  if (nav.view === 'placeholder') {
    var phDetailEl = document.getElementById('detail');
    if (round === 'base') { renderSportsBizDetail(sportsBizState.selected); }
    else if (phDetailEl) { phDetailEl.innerHTML = '<div class="empty-state">자료가 아직 없습니다.</div>'; }
    return;
  }
  state.selectedRound = round;
  var b = getBusiness(state.selectedId);
  if (!b) { renderDetail(); return; }

  if (round === 'base') {
    state.roundData = null;
    renderDetail();
    return;
  }

  state.roundData = null;
  var el = document.getElementById('detail');
  if (el) el.innerHTML = '<div class="empty-state">불러오는 중...</div>';

  var inst = INSTITUTIONS.filter(function (i) { return i.key === nav.instKey; })[0];
  if (!inst) { state.roundData = { trees: {}, teams: [] }; renderDetail(); return; }

  var data = await fetchRoundData(inst.id, b, round);
  // 불러오는 동안 다른 탭/회차를 눌렀으면 그 결과는 버린다.
  if (state.selectedId !== b.id || state.selectedRound !== round) return;
  state.roundData = data;
  renderDetail();
}
function onRoundChange(input) {
  applyRound(input.value);
}

// 정현원 뱃지를 지금 선택된 부서/사업 탭 바로 아래 위치로 정렬한다.
function alignHeadcountBadge() {
  var badgeEl = document.getElementById('tab-headcount-badge');
  var rowEl = document.getElementById('tab-headcount-badge-row');
  var tabsEl = document.getElementById('card-grid');
  if (!badgeEl || !rowEl || !tabsEl) return;
  if (getComputedStyle(rowEl).display === 'none') return;
  var selTab = tabsEl.querySelector('.org-tab.selected');
  if (!selTab) { badgeEl.style.marginLeft = '0px'; return; }
  var badgeWidth = badgeEl.offsetWidth || 180;
  var left = selTab.offsetLeft - tabsEl.scrollLeft;
  var maxLeft = Math.max(0, tabsEl.clientWidth - badgeWidth);
  left = Math.max(0, Math.min(left, maxLeft));
  badgeEl.style.marginLeft = left + 'px';
  updateHeadcountPopDirection();
}

function updateHeadcountPopDirection() {
  var summary = document.querySelector('.headcount-summary');
  var pop = document.querySelector('.headcount-detail-pop');
  if (!summary || !pop) return;
  var rect = summary.getBoundingClientRect();
  var popWidth = pop.offsetWidth || 220;
  var wouldOverflowRight = rect.right + 8 + popWidth > window.innerWidth - 24;
  pop.classList.toggle('pop-left', wouldOverflowRight);
}

function showPlaceholderInst(name) {
  var dept = SPORTS_SUB_DEPT[name] || null;
  var group = dept ? (SPORTS_SUB_GROUP[name] || '화성시체육회') : name;
  var instLabel = group;

  // 클릭한 하위 항목이 화성시체육회/화성시장애인체육회 중 어느 그룹 소속인지에 맞춰 그 그룹의 아코디언만 펼쳐진 채로 유지한다.
  nav.expandedInst[SPORTS_GROUP_EXPAND_KEY[group] || '__sportsCouncil'] = true;
  // 실제 기관 데이터가 아직 없지만, 화면 구성(상단 로고 자리·총괄·부서별 예산 섹션)은 다른 예산 기관과 동일하게 맞춘다.
  switchPanel('panel-hscf');

  var img = document.getElementById('topbar-logo');
  var textLogo = document.getElementById('topbar-logo-text');
  if (img) img.style.display = 'none';
  if (textLogo) { textLogo.textContent = instLabel; textLogo.style.display = ''; }

  var deptSelect = document.getElementById('dept-select');
  if (dept) {
    if (deptSelect) deptSelect.style.display = '';
    var deptLabelEl = document.getElementById('dept-select-label');
    if (deptLabelEl) deptLabelEl.textContent = dept;
    var pctWrapEl = document.getElementById('dept-select-pct');
    var pctValEl = document.getElementById('dept-select-pct-value');
    if (pctWrapEl) pctWrapEl.classList.remove('down');
    if (pctValEl) pctValEl.textContent = '-';

    // 가장 최근 회차(3추>2추>1추>본예산) 금액 합계 - 다른 기관과 동일한 규칙(요구액이 아니라 실제 편성액, 최신 회차 우선)
    var roundsPriority = ['supp3', 'supp2', 'supp1', 'base'];
    var deptEnactedCards = SPORTS_DEPT_ENACTED_CARDS_BY_NAME[name] || [];
    var latestTotal = 0;
    deptEnactedCards.forEach(function (c) {
      for (var ri = 0; ri < roundsPriority.length; ri++) {
        var rAmt = c.rounds[roundsPriority[ri]];
        if (rAmt) { latestTotal += rAmt; break; }
      }
    });
    var amtEl = document.getElementById('dept-select-amt');
    if (amtEl) amtEl.textContent = latestTotal ? (fmtWon(Math.round(latestTotal / 1000)) + '백만원') : '';
    var fillEl = document.getElementById('dept-select-fill');
    if (fillEl) fillEl.style.width = latestTotal ? '100%' : '0%';
    var menuEl = document.getElementById('dept-select-menu');
    if (menuEl) { menuEl.innerHTML = ''; menuEl.classList.remove('open'); }

    // 연도별 편성 현황 팝업 - 다른 기관의 위탁금 부서(사업별 편성) 표와 동일한 구조.
    var yearlyToggleIcon = document.getElementById('dept-select-icon');
    var yearlyPanelEl = document.getElementById('dept-stat-yearly-panel');
    if (yearlyToggleIcon) {
      yearlyToggleIcon.style.display = '';
      var yearlyToggleInput = yearlyToggleIcon.querySelector('input');
      if (yearlyToggleInput) yearlyToggleInput.checked = true;
    }
    if (yearlyPanelEl) {
      var roundCols = [{ key: 'y25', label: '2025' }, { key: 'base', label: '2026' }, { key: 'supp1', label: '1추' }, { key: 'supp2', label: '2추' }, { key: 'supp3', label: '3추' }];
      var yearlyHeadHtml = '<div class="dyt-row dyt-head"><span class="dyt-cell dyt-name-col">부기명</span>'
        + roundCols.map(function (c) { return '<span class="dyt-cell">' + c.label + '</span>'; }).join('')
        + '</div>';
      var yearlyBodyHtml = deptEnactedCards.map(function (card) {
        return '<div class="dyt-row"><span class="dyt-cell dyt-name-col">' + escapeHtml(card.name) + '</span>'
          + roundCols.map(function (c) {
            var amt = card.rounds[c.key] || 0;
            return '<span class="dyt-cell' + (amt > 0 ? '' : ' no-data') + '">' + (amt > 0 ? fmtWon(Math.round(amt / 1000)) : '-') + '</span>';
          }).join('')
          + '</div>';
      }).join('');
      yearlyPanelEl.innerHTML = '<div class="dept-yearly-table">' + yearlyHeadHtml + yearlyBodyHtml + '</div>';
      yearlyPanelEl.style.display = 'block';
    }
    var yearlyBackdropEl = document.getElementById('dept-yearly-backdrop');
    if (yearlyBackdropEl) yearlyBackdropEl.style.display = 'block';
  } else {
    if (deptSelect) deptSelect.style.display = 'none';
  }
  var deptTabs = document.getElementById('dept-tabs');
  if (deptTabs) deptTabs.style.display = 'none';

  var summaryTitleEl = document.getElementById('summary-title');
  var summaryTitleRow = summaryTitleEl ? summaryTitleEl.closest('.section-title-row') : null;
  var summarySlotEl = document.getElementById('summary-slot');
  if (dept) {
    // 화성시체육회 하위 항목은 총괄 수치가 없으므로 상단 "총괄" 섹션 자체를 노출하지 않는다.

    ? SPORTS_COUNCIL_DATA.expenseDetail.concat(SPORTS_PRIVATE_BIZ_CATEGORIES).filter(function (p) { return bizLabels.indexOf(p.label) !== -1; })
    : null;
  var cardGrid = document.getElementById('card-grid');
  var detailEl = document.getElementById('detail');
  if (bizList && bizList.length) {
    document.getElementById('cards-title').textContent = '사업별 예산';
    sportsBizState.list = bizList;
    sportsBizState.selected = 0;

  } else {
    document.getElementById('cards-title').textContent = '부서별 예산';

    if (detailEl) detailEl.innerHTML = '';
  }
  var roundRow = document.getElementById('round-tabs-row');
  var roundRadio = document.getElementById('round-tabs');
  if (bizList && bizList.length) {
    // 다른 기관과 동일하게 연도·회차 선택 UI를 노출한다 - 화성시체육회는 2026년 본예산 자료만 있어
    // 그 외 연도/회차를 고르면 applyRound()/selectYear()가 "자료 없음"으로 안내한다.
    if (roundRow) roundRow.style.display = 'flex';
    if (roundRadio) roundRadio.style.display = '';
    var phBaseRadio = document.getElementById('round-base');
    if (phBaseRadio) phBaseRadio.checked = true;
    selectYear(2026);
  } else {
    if (roundRow) roundRow.style.display = 'none';
    if (roundRadio) roundRadio.style.display = '';
  }
  // 뱃지(정현원 자리)는 renderSportsBizDetail()이 사업카드 전환마다 직접 채우거나 숨긴다 - 여기서는 건드리지 않는다.
  if (!bizList || !bizList.length) {
    var emptyBadgeRow = document.getElementById('tab-headcount-badge-row');
    if (emptyBadgeRow) emptyBadgeRow.style.display = 'none';
  }

  renderSidebarNav();
}

// Excel/PDF 내보내기(collectCurrentTreeRows)에서만 쓰는 라벨 포매터 - renderTreeRows()의 라벨 규칙과 동일.
function sportsBizNodeLabel(node) {
  if (node.level === '팀') return node.name;
  if (node.level === '정책') return '[정책] ' + node.name;
  if (node.level === '단위') return '[단위] ' + node.name;
  if (node.level === '세부') return '[세부] ' + node.name;
  if (node.level === '목' || node.level === '세목') return (node.code ? node.code + ' ' : '') + node.name;
  return '○ ' + node.name; // 부기명(목/세목 아래 최하위 항목)
}

function sidebarInstIcon(instKey) { return SIDEBAR_INST_ICONS[instKey] || SIDEBAR_ICON_BUILDING; }

function isInstExpanded(instKey) {
  if (Object.prototype.hasOwnProperty.call(nav.expandedInst, instKey)) return nav.expandedInst[instKey];
  return nav.view === 'budget' && nav.instKey === instKey; // 기본값: 예산 화면에서 현재 선택된 기관만 펼침
}

function toggleInst(instKey) {
  var willExpand = !isInstExpanded(instKey);
  if (willExpand) {
    // 아코디언 방식: 새로 펼치는 기관 외에는 전부 접는다.
    nav.expandedInst = {};
  }
  nav.expandedInst[instKey] = willExpand;
  if (willExpand) {
    var inst = INSTITUTIONS.filter(function (i) { return i.key === instKey; })[0];
    if (inst && inst.hasData) {
      selectInstOverview(instKey);
      return;
    }
  }
  renderSidebarNav();
}

function isWtgExpanded(instKey) {
  return !!nav.expandedWtg[instKey];
}
function toggleWtg(instKey, e) {
  if (e) e.stopPropagation();
  nav.expandedWtg[instKey] = !isWtgExpanded(instKey);
  renderSidebarNav();
}
async function selectBudgetDept(instKey, fund, dept, e) {
  if (e) e.stopPropagation();
  await selectBudget(instKey, fund);
  state.dept = dept;
  state.selectedId = null;
  renderAll();
  renderSidebarNav();
}

function renderDeptRadioGroup(instKey, depts) {
  return depts.map(function (d) {
    var isDeptActive = nav.view === 'budget' && nav.instKey === instKey && nav.fund === '위탁금' && state.dept === d;
    return '<div class="side-item dept-item' + (isDeptActive ? ' active' : '') + '" onclick="event.stopPropagation(); selectBudgetDept(\'' + instKey + '\',\'위탁금\',\'' + escapeHtml(d) + '\', event)">' + escapeHtml(d) + '</div>';
  }).join('');
}

function renderSidebarNav() {
  var budgetEl = document.getElementById('nav-budget');
  var budgetHtml = INSTITUTIONS.map(function (inst) {
    var isOverviewActive = nav.view === 'instOverview' && nav.instKey === inst.key;
    var activeFund = (nav.view === 'budget' && nav.instKey === inst.key && inst.funds.indexOf(nav.fund) !== -1)
      ? nav.fund : null;
    var fundItems = inst.funds.map(function (f) {
      var isActive = f === activeFund;
      var labelText = (f === '출연금' && YEONGEUM_DEPT[inst.key]) ? (f + ' · ' + YEONGEUM_DEPT[inst.key]) : f;
      return '<div class="side-item fund-item' + (isActive ? ' active' : '') + '" onclick="event.stopPropagation(); selectBudget(\'' + inst.key + '\',\'' + f + '\')">' + escapeHtml(labelText) + '</div>';
    }).join('');
    var subItems = fundItems;
    if (activeFund === '위탁금' && WTG_DEPTS[inst.key]) {
      subItems += renderDeptRadioGroup(inst.key, WTG_DEPTS[inst.key]);
    }
    var expanded = isInstExpanded(inst.key);
    var html = '<div class="side-item inst-header' + (isOverviewActive ? ' active' : '') + '" onclick="toggleInst(\'' + inst.key + '\')">'
      + '<span class="side-item-label"><span class="side-icon">' + sidebarInstIcon(inst.key) + '</span><span>' + inst.name + '</span></span>'
      + '<span class="caret' + (expanded ? ' open' : '') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span></div>'
      + '<div class="side-sub' + (expanded ? '' : ' collapsed') + '">' + subItems + '</div>';
    // 화성시체육회 - 예산 목차에만 임시로 추가된 항목(실제 연동 데이터 없음, 도시공사 아이콘을 다른 색으로 재사용)
    if (inst.key === 'corp') {
      var sportsExpanded = isInstExpanded('__sportsCouncil');
      var sportsHeaderActive = nav.view === 'placeholder' && nav.placeholderName === '화성시체육회';
      var sportsSubNames = ['민간단체법정운영보조', '민간사업보조', '민간위탁금'];
      var sportsSubHtml = sportsSubNames.map(function (name) {
        var isActive = nav.view === 'placeholder' && nav.placeholderName === name;
        return '<div class="side-item fund-item' + (isActive ? ' active' : '') + '" onclick="event.stopPropagation(); showPlaceholderInst(\'' + name + '\')">' + escapeHtml(name) + '</div>';
      }).join('');
      html += '<div class="side-item inst-header' + (sportsHeaderActive ? ' active' : '') + '" onclick="toggleSportsCouncilHeader()">'
        + '<span class="side-item-label"><span class="side-icon" style="background:#E6F6EC">' + sidebarInstIcon('corp') + '</span><span>화성시체육회</span></span>'
        + '<span class="caret' + (sportsExpanded ? ' open' : '') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span></div>'
        + '<div class="side-sub' + (sportsExpanded ? '' : ' collapsed') + '">' + sportsSubHtml + '</div>';
      // 화성시장애인체육회 - 화성시체육회 바로 아래에 형제 항목으로 추가(별도 법인, 실제 연동 데이터 없음).
      var disabledSportsExpanded = isInstExpanded('__disabledSportsCouncil');
      var disabledSportsHeaderActive = nav.view === 'placeholder' && nav.placeholderName === '화성시장애인체육회';
      var disabledSportsSubNames = ['장애인단체법정운영보조', '장애인사업보조', '장애인위탁금'];
      var disabledSportsSubHtml = disabledSportsSubNames.map(function (name) {
        var isActive = nav.view === 'placeholder' && nav.placeholderName === name;
        // 내부 키(장애인단체법정운영보조 등)는 화성시체육회 쪽과 구분하려고 다르게 두되,
        // 화면에 보이는 통계목 이름은 화성시체육회와 완전히 동일하게 표시한다.
        var displayLabel = SPORTS_SUB_LABEL_OVERRIDE[name] || name;
        return '<div class="side-item fund-item' + (isActive ? ' active' : '') + '" onclick="event.stopPropagation(); showPlaceholderInst(\'' + name + '\')">' + escapeHtml(displayLabel) + '</div>';
      }).join('');
      html += '<div class="side-item inst-header' + (disabledSportsHeaderActive ? ' active' : '') + '" onclick="toggleDisabledSportsCouncilHeader()">'
        + '<span class="side-item-label"><span class="side-icon" style="background:#E6F6EC">' + sidebarInstIcon('corp') + '</span><span>화성시장애인체육회</span></span>'
        + '<span class="caret' + (disabledSportsExpanded ? ' open' : '') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span></div>'
        + '<div class="side-sub' + (disabledSportsExpanded ? '' : ' collapsed') + '">' + disabledSportsSubHtml + '</div>';
    }
    return html;
  }).join('');
  budgetEl.innerHTML = budgetHtml;

  var settleEl = document.getElementById('nav-settlement');
  settleEl.innerHTML = INSTITUTIONS.map(function (inst) {
    var isActive = nav.view === 'settlement' && nav.instKey === inst.key;
    var meta = SETTLEMENT_DATA[inst.key];
    var yearCount = meta && meta.years ? Object.keys(meta.years).length : 0;
    var dotsHtml = '';
    for (var i = 0; i < yearCount; i++) {
      dotsHtml += '<span class="settle-data-dot"></span>';
    }
    if (dotsHtml) dotsHtml = '<span class="settle-data-dots" title="결산 데이터 ' + yearCount + '개 연도 연동됨">' + dotsHtml + '</span>';
    return '<div class="side-item' + (isActive ? ' active' : '') + '" onclick="selectSettlement(\'' + inst.key + '\')">'
      + '<span class="side-item-label"><span class="side-icon">' + sidebarInstIcon(inst.key) + '</span><span>' + inst.name + '</span>' + dotsHtml + '</span></div>';
  }).join('');
}

function switchPanel(panelId) {
  document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
  document.getElementById(panelId).classList.add('active');
  if (panelId !== 'panel-dashboard') {
    var main = document.querySelector('.main');
    var hero = document.querySelector('.landing-hero');
    if (main) main.style.height = '';
    if (hero) hero.style.height = '';
  }
}

// 안전한지 검증한 뒤 계산 — 콤마 있는 숫자, 괄호, 여러 항의 합산(가족수당 등)까지 정확히 처리된다.
function lcEvalCalcAmount(calcText) {

    // 기관마다 곱셈 기호를 *, ×(특수기호), x/X(영문자)로 제각각 써서 전부 "*"로 통일한다.
    .replace(/[×xX]/g, '*')

    .replace(/[원명월년시간일회식개소부인주]/g, '')
    // 산출기초 맨 끝에 "=" 만 남거나 "=계산결과"처럼 답이 이미 적혀있는 경우, 그 뒤는 계산에 안 쓰므로 잘라낸다.

  var count = (text.match(/([0-9][0-9,]*)명/) || [])[1];
