<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화성시문화관광재단 출연금·위탁금 관리</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<style>
@font-face {
  font-family: 'GmarketSans';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'GmarketSans';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'GmarketSans';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
:root {
  --bg: #F3F5FA;
  --bg-card: #ffffff;
  --bg-hover: #F0F3FA;
  --text: #10131C;
  --text-muted: #5B6373;
  --text-soft: #9AA2B1;
  --border: #E7EAF1;
  --border-strong: #D8DCE7;
  --accent: #3457D5;
  --accent-dark: #22348E;
  --accent-soft: #EAF0FE;
  --navy: #10182E;
  --success: #16924F;
  --success-soft: #E6F6EC;
  --danger: #D6455A;
  --danger-soft: #FCEAEC;
  --r: 10px;
  --r-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(16,20,35,.04), 0 1px 1px rgba(16,20,35,.03);
  --shadow-md: 0 6px 20px rgba(16,20,35,.06), 0 1px 2px rgba(16,20,35,.04);
  --dept-culture: #5B84FF; --dept-culture-bg: #F0F4FE;
  --dept-library: #48BB78; --dept-library-bg: #F0F9F5;
  --dept-tour: #F6AD55; --dept-tour-bg: #FEF8EE;
  --sidebar-bg: #12172A;
  --sidebar-text: #EDF0F9;
  --sidebar-text-muted: #9AA3C4;
  --sidebar-text-faint: #565F82;
  --sidebar-hover-bg: rgba(255,255,255,.07);
  --sidebar-border: rgba(255,255,255,.09);
  --sidebar-tree-line: rgba(255,255,255,.16);
  --sidebar-accent: #5B84FF;
  --page-gap: 16px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 16.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
/* 타이틀/제목 영역은 지마켓 산스, 나머지 본문/메뉴/숫자/테이블은 프리텐다드 */
h1, h2, h3, .eyebrow, .sidebar .brand-title, .sidebar .brand-subtitle, .sidebar .cat-badge,
.team-block h3, .line-hdr h3, .card .name,
.section-heading, .org-tab-name {
  font-family: 'GmarketSans', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
h1 { font-size: 23px; font-weight: 700; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; margin: 0 0 4px; }

.topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.dept-tabs { display: flex; gap: 6px; }
.dept-btn {
  border: none; border-radius: 999px; padding: 7px 16px; font-size: 15.5px; font-weight: 500; cursor: pointer;
  background: var(--bg-hover); color: var(--text-muted); transition: all .15s;
}
.dept-btn.active.dept-문화예술과 { background: var(--dept-culture-bg); color: var(--dept-culture); font-weight: 700; }
.dept-btn.active.dept-도서관정책과 { background: var(--dept-library-bg); color: var(--dept-library); font-weight: 700; }
.dept-btn.active.dept-관광진흥과 { background: var(--dept-tour-bg); color: var(--dept-tour); font-weight: 700; }

.fund-toggle { display: inline-flex; background: var(--bg-hover); padding: 3px; border-radius: 999px; margin-bottom: 20px; }
.fund-btn { border: none; padding: 7px 22px; font-size: 15.5px; font-weight: 600; cursor: pointer; background: transparent; color: var(--text-muted); border-radius: 999px; transition: all .15s; }
.fund-btn.active { background: var(--navy); color: #fff; box-shadow: var(--shadow-sm); }

.summary-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 20px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
.summary-box h3 { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 18px; font-weight: 800; margin: 0 0 14px; color: var(--text); }
.section-heading {
  font-family: 'GmarketSans', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 16px; font-weight: 700; color: var(--text); margin: 4px 0 14px;
}
table.summary { width: 100%; border-collapse: collapse; font-size: 15px; table-layout: auto; }
table.summary th, table.summary td { padding: 7px 6px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; word-break: keep-all; }
table.summary th:first-child, table.summary td:first-child { text-align: left; color: var(--text-muted); font-variant-numeric: normal; white-space: normal; }
table.summary th { color: var(--navy); font-weight: 800; font-size: 13.5px; text-transform: uppercase; letter-spacing: .03em; background: var(--bg-hover); border-bottom: 1.5px solid var(--border-strong); text-align: center; }
table.summary th:first-child { text-align: center; color: var(--navy); }
table.summary tr.total td { font-weight: 700; border-bottom: 1.5px solid var(--border-strong); background: var(--bg-hover); }
table.summary td.diff.up { color: var(--success); }
table.summary td.diff.down { color: var(--danger); }
table.summary td.diff { white-space: normal; word-break: keep-all; }
.summary-unit-note { font-size: 12.5px; color: var(--text-soft); margin: 8px 0 0; text-align: right; }
.summary-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 14px; }
.summary-title-row h3 { margin: 0; }
.summary-title-row .summary-unit-note { margin: 0; flex-shrink: 0; }
.summary-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: stretch; margin-bottom: 18px; }
.summary-grid .summary-box { margin-bottom: 0; width: 100%; min-width: 0; max-width: none; overflow: hidden; display: flex; flex-direction: column; }
.summary-box-body { flex: 0 1 auto; display: flex; flex-direction: column; justify-content: flex-start; }
.summary-box-body.donut-row { flex-direction: row; align-items: center; justify-content: center; gap: 22px; }
.summary-box-body.donut-row .donut-legend { width: auto; flex: 1 1 auto; max-width: 200px; margin-top: 0; }
.summary-grid .summary-box .table-scroll { width: 100%; overflow-x: auto; }
@media (max-width: 980px) { .summary-grid { grid-template-columns: 1fr; } }
.section-heading-lg { font-size: 22px; margin: 0; padding-left: 13px; border-left: 4px solid var(--accent); }
#summary-title {
  background: var(--navy); color: #fff; padding: 12px 18px;
  border-radius: var(--r-lg); border-left: 4px solid var(--sidebar-accent);
}
.section-title-row { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; }
.section-title-row .section-heading-lg { margin: 0; }
.section-badge {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 12.5px; font-weight: 800; letter-spacing: .02em; color: var(--accent-dark);
  background: var(--accent-soft); border-radius: 999px; padding: 4px 13px; flex-shrink: 0;
}
.section-title-row .btn-sm { margin-left: auto; }
table.fc-summary th { font-size: 13.5px; text-transform: none; letter-spacing: 0; }
table.fc-summary td .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

/* 도넛 차트 범례 */
.donut-legend { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; width: 100%; }
.donut-legend .item { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--text-muted); }
.donut-legend .item .name { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.donut-legend .item .chip { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.donut-legend .item .pct { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.donut-legend .item:nth-child(1) .chip { background-color: #4C9AFF !important; }
.donut-legend .item:nth-child(2) .chip { background-color: #9E75FF !important; }
.donut-legend .item:nth-child(3) .chip { background-color: #FF7A85 !important; }

.chip.personnel, .bg-personnel { background-color: #4C9AFF !important; }
.chip.operating, .bg-operating { background-color: #9E75FF !important; }
.chip.asset, .bg-asset { background-color: #FF7A85 !important; }

/* 조직별 예산 가로 탭 */
.org-tabs {
  position: relative;
  display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 4px;
  background: var(--bg-hover); padding: 10px 10px 0; margin-bottom: 0;
  border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: var(--shadow-sm);
  scrollbar-width: none;
}
.org-tabs::-webkit-scrollbar { display: none; }
.tab-scroll-btn {
  position: absolute; top: 0; bottom: 0; width: 30px; z-index: 2;
  border: none; cursor: pointer;
  display: flex; align-items: center;
  font-size: 20px; font-weight: 800; color: var(--text-muted);
}
.tab-scroll-btn:hover { color: var(--text); }
.tab-scroll-btn.right { right: 0; justify-content: flex-end; padding-right: 6px; border-radius: 0 var(--r-lg) 0 0; background: linear-gradient(to right, transparent, var(--bg-hover) 55%); }
.tab-scroll-btn.left { left: 0; justify-content: flex-start; padding-left: 6px; border-radius: var(--r-lg) 0 0 0; background: linear-gradient(to left, transparent, var(--bg-hover) 55%); }
.org-tab {
  position: relative; border: none; border-radius: var(--r) var(--r) 0 0; padding: 10px 16px;
  background: rgba(16,23,42,.05); cursor: pointer; font-family: inherit; text-align: center;
  transition: all .15s; color: var(--text-muted); font-weight: 600;
  flex-shrink: 0; white-space: nowrap;
}
.org-tab:hover { background: rgba(16,23,42,.1); color: var(--text); }
.org-tab:active { transform: translateY(1px); }
.org-tab.selected { background: var(--navy); color: #fff; }
.org-tab .org-tab-name { font-size: 15px; font-weight: 700; color: inherit; white-space: nowrap; }
.org-tab.selected .org-tab-name { font-weight: 800; }

/* 조직 상세 확장 영역 (정원현원 총괄 + 세부사업) */


.dept-select { position: relative; }
.dept-select-btn {
  display: inline-flex; align-items: center; gap: 12px;
  background: #fff; border: 1px solid var(--border-strong); border-radius: 999px;
  padding: 12px 24px 12px 10px; cursor: pointer; box-shadow: var(--shadow-sm);
  font-family: inherit; font-size: 21px; font-weight: 700; color: var(--text);
}
.dept-select-btn:hover { background: var(--bg-hover); }
.dept-select-btn.dept-select-static { cursor: default; }
.dept-select-btn.dept-select-static:hover { background: #fff; }
.dept-select-icon {
  width: 38px; height: 38px; border-radius: 50%; background: var(--accent);
  color: #fff; font-size: 19px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.dept-select-caret { font-size: 12.5px; color: var(--text-soft); }
.dept-select-menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 30;
  background: #fff; border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-md);
  min-width: 200px; padding: 6px; }
.dept-select-menu.open { display: block; }
.dept-select-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
  cursor: pointer; font-size: 16px; color: var(--text-muted);
}
.dept-select-item:hover { background: var(--bg-hover); }
.dept-select-item.active { background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; }
.dept-select-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

.fund-bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.fund-bar-row { display: grid; grid-template-columns: 92px 1fr 150px; align-items: center; gap: 12px; }
.fund-bar-label { font-size: 15px; font-weight: 600; color: var(--text-muted); }
.fund-bar-track { height: 10px; background: var(--bg-hover); border-radius: 999px; overflow: hidden; }
.fund-bar-fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
.fund-bar-val { font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.fund-bar-pct { font-weight: 500; color: var(--text-soft); margin-left: 4px; }

.team-block { margin-bottom: 24px; }
.team-block h3 { font-size: 17px; font-weight: 700; margin: 0 0 10px; }
.tree-scroll { overflow-x: auto; border-radius: var(--r-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
table.tree { border-collapse: collapse; font-size: 15.5px; table-layout: fixed; min-width: 900px; width: 100%; }
table.tree th { position: relative; padding: 10px 8px; text-align: center; font-weight: 700; font-size: 17px; letter-spacing: .02em; color: var(--text-muted); background: var(--bg-hover); border-bottom: 1px solid var(--border-strong); border-right: 1px solid var(--border); }
table.tree td { padding: 7px 8px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); vertical-align: middle; word-break: break-word; }
table.tree tr:last-child td { border-bottom: none; }
table.tree td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.tree td.basis { color: var(--text-muted); font-size: 14.5px; }
tr.lvl-팀 td { font-weight: 700; font-size: 16px; background: var(--navy); color: #fff; }
tr.lvl-팀 td.basis, tr.lvl-팀 td.num { color: #DCE3F7; }
tr.lvl-정책 td { font-weight: 700; background: var(--accent-soft); }
tr.lvl-단위 td { font-weight: 600; background: #FAFBFE; }
tr.lvl-세부 td { font-weight: 500; color: var(--text-muted); }
tr.lvl-목 td { font-weight: 700; }
tr.lvl-세목 td { font-weight: 500; }
tr.lvl-□ td { color: var(--text); font-size: 15.5px; }
tr.lvl-○ td, tr.lvl-• td { color: var(--text-muted); font-size: 15.5px; }
tr.lvl-leaf td { color: var(--text-muted); font-size: 15.5px; }
tr.row-hidden-collapse, tr.mok-hidden { display: none; }
.tgl { cursor: pointer; display: inline-block; width: 14px; color: var(--text-soft); user-select: none; }
.tgl:hover { color: var(--accent); }

/* ---- app shell / sidebar ---- */
.app {
  display: flex; align-items: flex-start; gap: var(--page-gap);
  min-height: 100vh; padding: var(--page-gap); box-sizing: border-box;
}
.sidebar {
  width: 284px; flex-shrink: 0; background: var(--sidebar-bg);
  padding: 20px 14px; overflow-y: auto;
  border-radius: var(--r-lg);
  box-shadow: 0 12px 32px rgba(4,7,16,.32), 0 2px 8px rgba(4,7,16,.22);
  position: sticky; top: var(--page-gap);
  max-height: calc(100vh - (var(--page-gap) * 2));
  z-index: 5;
}
.sidebar .brand { display: flex; flex-direction: column; gap: 2px; padding: 2px 4px 16px; border-bottom: 1px solid var(--sidebar-border); margin-bottom: 10px; }
.sidebar .brand-title {
  display: flex; align-items: flex-start; gap: 7px; font-size: 17px; font-weight: 800; letter-spacing: -0.01em;
  color: #FFFFFF; line-height: 1.32; white-space: normal;
}
.sidebar .brand-title .dot { margin-top: 7px; }
.sidebar .brand-title-lines { display: flex; flex-direction: column; }
.sidebar .brand-title-lines .l2 { color: #B7C7FF; }
.sidebar .brand .dot { width: 8px; height: 8px; border-radius: 3px; background: var(--sidebar-accent); flex-shrink: 0; box-shadow: 0 0 10px rgba(91,132,255,.65); }
.sidebar .brand-subtitle { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #FFFFFF; padding-left: 15px; white-space: nowrap; margin-top: 2px; }

/* 카테고리 배지 (대시보드 / 예산 / 결산) */
.sidebar .group-label { padding: 12px 8px 6px; }
.sidebar .group-label:first-of-type { padding-top: 0; }
.sidebar .cat-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 13px; border-radius: 999px;
  background: rgba(91,132,255,.28); color: #B7C7FF; font-size: 13px; font-weight: 800;
  letter-spacing: .05em; text-transform: uppercase; flex-shrink: 0; white-space: nowrap;
}

.sidebar .side-icon { width: 15px; height: 15px; flex-shrink: 0; display: inline-flex; }
.sidebar .side-icon svg { width: 100%; height: 100%; display: block; }
.sidebar .side-item-label { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1 1 auto; }
.sidebar .side-item-label > span:not(.side-icon) { flex-shrink: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sidebar .side-item {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 6px 10px; border-radius: 8px; font-size: 15px; color: var(--sidebar-text-muted); cursor: pointer;
  transition: background .12s, color .12s, border-color .12s, box-shadow .12s;
  border-left: 3px solid transparent;
}
.sidebar .side-item:hover { background: var(--sidebar-hover-bg); color: var(--sidebar-text); }
/* 선택 상태: 좌측 포인트 라인 + 배경 톤 + 은은한 링으로 강조 */
.sidebar .side-item.active {
  background: rgba(91,132,255,.18); color: #fff; font-weight: 700;
  border-left-color: var(--sidebar-accent);
  box-shadow: inset 0 0 0 1px rgba(91,132,255,.35);
}
.sidebar .side-item.active .side-icon { color: var(--sidebar-accent); }
.sidebar .side-item.inst-header { cursor: pointer; color: var(--sidebar-text); font-weight: 600; }
.sidebar .side-item.inst-header:hover { background: var(--sidebar-hover-bg); }

/* 서브메뉴 접기/펼치기 */
.sidebar .side-sub {
  position: relative; padding-left: 18px; margin-left: 13px; border-left: 1px solid var(--sidebar-tree-line);
  max-height: 400px; overflow: hidden; opacity: 1; transition: max-height .22s ease, opacity .18s ease;
}
.sidebar .side-sub.collapsed { max-height: 0; opacity: 0; border-left-color: transparent; }
.sidebar .side-sub .side-item { position: relative; font-size: 14px; padding: 5px 10px; margin: 1px 0; }
.sidebar .side-sub .side-item::before {
  content: ''; position: absolute; top: 50%; left: -18px; width: 11px; height: 1px;
  transform: translateY(-50%); background: var(--sidebar-tree-line);
}
.sidebar .caret { font-size: 11px; color: var(--sidebar-text-faint); transition: transform .15s ease; flex-shrink: 0; }
.sidebar .caret.open { transform: rotate(180deg); }
.main {
  flex: 1; min-width: 0; padding: 28px 32px 48px; overflow-x: hidden;
  background: var(--bg-card); border-radius: var(--r-lg); box-shadow: var(--shadow-md);
}
.panel { display: none; }
.panel.active { display: block; }
.placeholder-box {
  background: var(--bg-card); border: 1px dashed var(--border-strong); border-radius: var(--r-lg);
  padding: 48px 24px; text-align: center; color: var(--text-soft); font-size: 16px;
}
.dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
.dash-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow-sm); }
.dash-card .label { font-size: 14px; font-weight: 600; color: var(--text-soft); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 10px; }
.dash-card .value { font-size: 26.5px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.dash-list { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 6px 0; box-shadow: var(--shadow-sm); }
.dash-list .row { display: flex; justify-content: space-between; align-items: center; padding: 13px 20px; border-bottom: 1px solid var(--border); font-size: 16px; }
.dash-list .row:last-child { border-bottom: none; }
.dash-list .row .name { font-weight: 600; }
.dash-list .row .status { color: var(--text-soft); font-size: 14.5px; font-weight: 500; padding: 3px 10px; background: var(--bg-hover); border-radius: 999px; }

.col-resize-handle { position: absolute; right: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 2; }
.col-resize-handle:hover, .col-resize-handle.resizing { background: var(--accent); opacity: 0.4; }
.th-filter-label { cursor: pointer; user-select: none; }
.filter-caret { font-size: 14px; }
.mok-filter-popover {
  position: relative; z-index: 20; background: var(--bg-card); border: 1px solid var(--border-strong);
  border-radius: var(--r); box-shadow: var(--shadow-md); padding: 8px; margin-bottom: 8px; max-width: 320px;
}
.mok-filter-actions { display: flex; gap: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.mok-filter-actions button { border: 1px solid var(--border-strong); background: var(--bg-card); border-radius: var(--r); padding: 4px 10px; font-size: 15px; cursor: pointer; }
.mok-filter-item { display: block; font-size: 16px; padding: 3px 2px; cursor: pointer; }
.mok-filter-item input { margin-right: 6px; }

.card-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 12px; margin-bottom: 26px;
}
.card {
  border-radius: var(--r-lg); padding: 16px 18px; cursor: pointer; border: 1.5px solid transparent;
  background: var(--bg-card); box-shadow: var(--shadow-sm); transition: all .15s;
}
.card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-sm); }
.card .org { font-size: 14px; color: var(--text-soft); margin-bottom: 4px; font-weight: 500; }
.card .name { font-size: 18px; font-weight: 700; margin: 0 0 8px; color: var(--text); white-space: pre-line; }
.card .amt { font-size: 19.5px; font-weight: 800; color: var(--accent); margin: 0 0 8px; font-variant-numeric: tabular-nums; }
.card .amt.empty { color: var(--text-soft); font-weight: 400; font-size: 15.5px; }
.card .dept { font-size: 14.5px; color: var(--text-muted); margin: 0 0 8px; font-weight: 600; }
.card .teams { border-top: 1px solid var(--border); padding-top: 8px; }
.card .teams table { width: 100%; font-size: 14.5px; color: var(--text-muted); border-collapse: collapse; }
.card .teams td { padding: 3px 0; }
.card .teams td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text-soft); }
.empty-state { color: var(--text-soft); font-size: 16px; padding: 48px 0; text-align: center; }

.detail:empty { display: none; }
.detail {
  background: var(--navy); padding: 18px; border-radius: 0 0 var(--r-lg) var(--r-lg); margin-bottom: 24px;
}
.detail-inner { background: var(--bg-card); border-radius: var(--r); padding: 18px 20px; }
.detail-summary-line { font-size: 17px; font-weight: 700; color: var(--text); background: var(--bg-hover); border-radius: var(--r); padding: 12px 16px; margin-bottom: 16px; }


table.team-summary, table.lines { width: 100%; border-collapse: collapse; font-size: 16px; margin-bottom: 16px; }
table.team-summary th, table.team-summary td, table.lines th, table.lines td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
table.team-summary th, table.lines th { color: var(--text-soft); font-weight: 600; font-size: 14px; text-transform: uppercase; background: var(--bg-hover); }
table.team-summary td.num, table.lines td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.team-summary tr:last-child td, table.lines tr:last-child td { border-bottom: none; }

.line-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.line-hdr h3 { font-size: 17px; margin: 0; color: var(--text-muted); font-weight: 600; }
.btn-sm { border: 1px solid var(--border-strong); background: var(--bg-card); border-radius: var(--r); padding: 5px 12px; font-size: 15.5px; cursor: pointer; color: var(--text); }
td[contenteditable="true"]:hover { background: #fffbea; cursor: text; }
.del-btn { color: var(--text-soft); cursor: pointer; padding: 0 4px; }
.del-btn:hover { color: var(--danger); }

</style>
</head>

var DEFAULT_LOGO_SRC = null;
function updateTopbarLogo(instKey) {
  var img = document.getElementById('topbar-logo');
  var textLogo = document.getElementById('topbar-logo-text');
  if (!img) return;
  if (DEFAULT_LOGO_SRC == null) DEFAULT_LOGO_SRC = img.src;

  if (instKey === 'talent') {
    img.style.display = 'none';
    if (textLogo) textLogo.style.display = '';
    return;
  }
  img.style.display = '';
  if (textLogo) textLogo.style.display = 'none';

  var logo = INSTITUTION_LOGOS[instKey];
  if (logo) {
    img.src = logo.src;
    img.alt = logo.alt;
  } else {
    img.src = DEFAULT_LOGO_SRC;
    img.alt = '화성시문화관광재단';
  }
}

var TEAM_TREES = {};

};

// budget_items 원본 행(flat) -> TEAM_TREES 형태(중첩 트리)로 조립
async function fetchAllRows(table, institutionId) {
  var all = [];
  var pageSize = 1000;
  var from = 0;
  while (true) {
    var { data, error } = await db.from(table).select('*').eq('institution_id', institutionId).order('sort_order').range(from, from + pageSize - 1);
    if (error) { showLoadError(table, error); break; }
    if (!data || !data.length) break;
    all = all.concat(data);
    if (data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}

function buildTeamTrees(rows) {
  var byId = {};
  rows.forEach(function (r) { byId[r.id] = { id: r.id, level: r.level, code: r.code, name: r.name, amt26: r.amt26, amt25: r.amt25, calc: r.calc, children: [], _parent_id: r.parent_id, _sort: r.sort_order }; });
  var roots = [];
  rows.forEach(function (r) {
    var node = byId[r.id];
    if (r.parent_id == null) { roots.push(node); }
    else if (byId[r.parent_id]) { byId[r.parent_id].children.push(node); }
  });
  function sortRec(node) {
    node.children.sort(function (a, b) { return (a._sort || 0) - (b._sort || 0); });
    node.children.forEach(sortRec);
  }
  roots.forEach(sortRec);
  // id 기준으로 키를 만든다 (이름은 기관마다 겹치거나 표시용으로 바뀔 수 있어 매칭에 쓰지 않음)
  var trees = {};
  roots.forEach(function (n) { trees[String(n.id)] = n; });
  return trees;
}

async function loadInstBudgetData(inst) {
  if (instDataCache[inst.key]) return instDataCache[inst.key];

  var items = await fetchAllRows('budget_items', inst.id);
  var teamTrees = buildTeamTrees(items);

  var { data: cards, error: e2 } = await db.from('business_cards').select('*').eq('institution_id', inst.id).order('sort_order');
  if (e2) { showLoadError('본부/사업 카드', e2); return null; }
  var { data: teams, error: e3 } = await db.from('card_teams').select('*').order('sort_order');
  if (e3) { showLoadError('팀 정원현원', e3); return null; }

  var businesses = cards.map(function (c) {
    var myTeams = teams.filter(function (t) { return t.card_id === c.id; }).map(function (t) {
      return { name: t.team_name, capacity: t.capacity, current: t.current, treeKey: t.team_root_budget_item_id };
    });
    return { id: c.id, dept: c.dept, fundType: c.fund_type, name: c.name, amt: c.amt, amt25: c.amt25,
      laborCost: c.labor_cost, laborCost25: c.labor_cost25,
      adminCost: c.admin_cost, adminCost25: c.admin_cost25,
      programCost: c.program_cost, programCost25: c.program_cost25,
      revenueGrant: c.revenue_grant, revenueGrant25: c.revenue_grant25,
      revenueSubsidy: c.revenue_subsidy, revenueSubsidy25: c.revenue_subsidy25,
      revenueSelf: c.revenue_self, revenueSelf25: c.revenue_self25,
      teams: myTeams, lines: [] };
  });

  var deptSet = [];
  businesses.forEach(function (b) { if (b.dept && deptSet.indexOf(b.dept) === -1) deptSet.push(b.dept); });

  var cache = { teamTrees: teamTrees, businesses: businesses, departments: deptSet.length ? deptSet : DEPARTMENTS };
  instDataCache[inst.key] = cache;
  return cache;
}

function classifyMokCode(code) {
  if (!code) return '운영비';
  var c = code.charAt(0);
  if (c === '1') return '인건비';
  if (code === '401' || code === '405') return '자산취득비';
  return '운영비';
}

function computeFundSummaryGeneric(fundType, title) {
  var buckets = { '인건비': [0, 0], '운영비': [0, 0], '자산취득비': [0, 0] };
  function walk(node) {
    if (node.level === '목') {
      var b = classifyMokCode(node.code);
      buckets[b][0] += node.amt26 || 0;
      buckets[b][1] += node.amt25 || 0;
    }
    (node.children || []).forEach(walk);
  }
  // 이 재원(fundType)에 속한 카드가 실제로 참조하는 트리만 집계한다.
  var relevant = (state.businesses || []).filter(function (biz) { return biz.fundType === fundType; });
  relevant.forEach(function (biz) {
    (biz.teams || []).forEach(function (t) {
      if (t.treeKey && TEAM_TREES[t.treeKey]) walk(TEAM_TREES[t.treeKey]);
    });
  });
  var order = ['인건비', '운영비', '자산취득비'];
  var rows = order.map(function (label) { return { label: label, y26: buckets[label][0], y25: buckets[label][1] }; });
  var total = rows.reduce(function (acc, r) { return { y26: acc.y26 + r.y26, y25: acc.y25 + r.y25 }; }, { y26: 0, y25: 0 });
  return { title: title, rows: rows, total: { label: '합계', y26: total.y26, y25: total.y25 }, note: '팀별 예산 트리 데이터를 통계목(101/2xx/401·405/기타) 기준으로 자동 집계한 값입니다.' };
}
function computeFundSummary() {
  return computeFundSummaryGeneric('출연금', '출연금 총괄');
}
function computeWtgFundSummary() {
  // 1) institution_funds에 저장된 화성시 총괄표 원본 수치가 있으면 그걸 그대로 쓴다 (예: 인재육성재단)
  var inst = (INSTITUTIONS || []).filter(function (i) { return i.key === nav.instKey; })[0];
  var fundRow = inst && inst.fundRows ? inst.fundRows.filter(function (f) { return f.fund_type === '위탁금'; })[0] : null;

  if (fundRow && fundRow.total_labor != null) {
    var rowsF = [
      { label: '인건비', y26: fundRow.total_labor || 0, y25: fundRow.total_labor25 || 0 },
      { label: '운영비', y26: fundRow.total_admin || 0, y25: fundRow.total_admin25 || 0 },
      { label: '사업비', y26: fundRow.total_program || 0, y25: fundRow.total_program25 || 0 }
    ];
    var totalF = rowsF.reduce(function (acc, r) { return { y26: acc.y26 + r.y26, y25: acc.y25 + r.y25 }; }, { y26: 0, y25: 0 });
    return { title: '위탁금 총괄', rows: rowsF, total: { label: '합계', y26: totalF.y26, y25: totalF.y25 }, note: '화성시 예산 총괄표(세부) 원본 수치입니다.' };
  }

  // 2) 카드별로 labor_cost 등이 저장돼 있으면 그걸 합산한다
  var list = (state.businesses || []).filter(function (biz) { return biz.fundType === '위탁금'; });
  var hasCardLevelData = list.some(function (biz) {
    return biz.laborCost != null || biz.adminCost != null || biz.programCost != null;
  });
  if (hasCardLevelData) {
    var buckets = { '인건비': [0, 0], '운영비': [0, 0], '사업비': [0, 0] };
    list.forEach(function (biz) {
      buckets['인건비'][0] += biz.laborCost || 0;
      buckets['인건비'][1] += biz.laborCost25 || 0;
      buckets['운영비'][0] += biz.adminCost || 0;
      buckets['운영비'][1] += biz.adminCost25 || 0;
      buckets['사업비'][0] += biz.programCost || 0;
      buckets['사업비'][1] += biz.programCost25 || 0;
    });
    var order = ['인건비', '운영비', '사업비'];
    var rows = order.map(function (label) { return { label: label, y26: buckets[label][0], y25: buckets[label][1] }; });
    var total = rows.reduce(function (acc, r) { return { y26: acc.y26 + r.y26, y25: acc.y25 + r.y25 }; }, { y26: 0, y25: 0 });
    return { title: '위탁금 총괄', rows: rows, total: { label: '합계', y26: total.y26, y25: total.y25 }, note: '화성시 예산 총괄표(세부) 원본 수치를 카드별로 합산한 값입니다.' };
  }

  // 3) 둘 다 없으면(기존 기관들) 트리 데이터를 통계목 기준으로 자동 집계한다
  return computeFundSummaryGeneric('위탁금', '위탁금 총괄');
}

function buildDonutSvg(rows, total26, colors) {
  var R = 62, CX = 90, CY = 90, STROKE = 46;
  var circumference = 2 * Math.PI * R;
  var offset = 0;
  var segsHtml = '';
  var labelsHtml = '';
  rows.forEach(function (r) {
    var pct = total26 ? (r.y26 / total26 * 100) : 0;
    var len = circumference * pct / 100;
    var color = colors[r.label] || 'var(--text-soft)';
    segsHtml += '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="' + color + '" stroke-width="' + STROKE
      + '" stroke-dasharray="' + len.toFixed(2) + ' ' + (circumference - len).toFixed(2)
      + '" stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 ' + CX + ' ' + CY + ')"></circle>';
    var midAngle = (offset + len / 2) / circumference * 360 - 90;
    var rad = midAngle * Math.PI / 180;
    var lx = CX + R * Math.cos(rad);
    var ly = CY + R * Math.sin(rad);
    if (pct > 4) {
      labelsHtml += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="700" fill="#fff">' + pct.toFixed(1) + '%</text>';
    }
    offset += len;
  });
  return '<svg width="180" height="180" viewBox="0 0 180 180">' + segsHtml + labelsHtml + '</svg>';
}

// 도넛 차트 하단 범례 (항목명 + 색상 칩 + 비중)
function buildDonutLegend(rows, total26, colors) {
  var items = rows.map(function (r) {
    var pct = total26 ? (r.y26 / total26 * 100) : 0;
    var color = (colors && colors[r.label]) || 'var(--text-soft)';
    return '<div class="item"><span class="name"><span class="chip" style="background:' + color + '"></span>' + escapeHtml(r.label) + '</span><span class="pct">' + pct.toFixed(1) + '%</span></div>';
  }).join('');
  return '<div class="donut-legend">' + items + '</div>';
}

// 4개 들여쓰기 칸(정책/단위/세부/목·세목·항목) + 산출기초 + 2026 + 2025 + 비교증감 + 증감률
var LEVEL_BASE_DEPTH = { '팀': 0, '정책': 0, '단위': 1, '세부': 2, '목': 3, '세목': 4 };
var LEAF_BULLETS = { 5: '○ ', 6: '- ', 7: '· ', 8: '‣ ' };
function bulletForDepth(d) { return LEAF_BULLETS[d] || LEAF_BULLETS[8]; }

function fmtDiff(amt26, amt25) {
  if (amt25 == null) amt25 = 0;
  var d = (amt26 || 0) - amt25;
  if (d === 0) return '-';
  var sign = d > 0 ? '' : '△ ';
  return sign + fmtWon(Math.abs(d));
}
function fmtPct(amt26, amt25) {
  if (!amt25) return amt26 ? '-' : '0%';
  var d = amt26 - amt25;
  return Math.round(d / amt25 * 100) + '%';
}

var TREE_COL_LABELS = ['부서·정책·단위·세부사업·편성목·통계목·부기명', '산출기초', '2026년도', '2025년도', '비교증감', '증감률'];
var DEFAULT_TREE_COL_WIDTHS = [34, 18, 13, 13, 12, 10];
function loadTreeColWidths() {
  try {
    var raw = localStorage.getItem('hscf_tree_col_widths');
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return DEFAULT_TREE_COL_WIDTHS.slice();
}
function saveTreeColWidths(widths) {
  try { localStorage.setItem('hscf_tree_col_widths', JSON.stringify(widths)); } catch (e) {}
}
var treeColWidths = loadTreeColWidths();
function applyTreeColWidths() {
  treeColWidths.forEach(function (w, i) {
    document.querySelectorAll('.tcol-' + i).forEach(function (col) { col.style.width = w + '%'; });
  });
}
var treeDragState = { col: null, startX: 0, startWidth: 0, containerWidth: 1000 };
document.addEventListener('mousemove', function (e) {
  if (treeDragState.col == null) return;
  var deltaPct = (e.clientX - treeDragState.startX) / treeDragState.containerWidth * 100;
  treeColWidths[treeDragState.col] = Math.max(4, treeDragState.startWidth + deltaPct);
  applyTreeColWidths();
});
document.addEventListener('mouseup', function () {
  if (treeDragState.col != null) {
    saveTreeColWidths(treeColWidths);
    var h = document.querySelector('.col-resize-handle.resizing');
    if (h) h.classList.remove('resizing');
  }
  treeDragState.col = null;
});
function setupTreeColResize() {
  document.querySelectorAll('.tree-container').forEach(function (container) {
    container.onmousedown = function (e) {
      var handle = e.target.closest ? e.target.closest('.col-resize-handle') : null;
      if (!handle) return;
      e.preventDefault();
      treeDragState.col = parseInt(handle.getAttribute('data-resize'), 10);
      treeDragState.startX = e.clientX;
      treeDragState.startWidth = treeColWidths[treeDragState.col] || 10;
      treeDragState.containerWidth = (container.getBoundingClientRect ? container.getBoundingClientRect().width : 1000) || 1000;
      handle.classList.add('resizing');
    };
  });
}

function collectMokList(tree) {
  var list = [];
  function walk(node) {
    if (node.level === '목') list.push(node);
    (node.children || []).forEach(walk);
  }
  (tree.children || []).forEach(walk);
  return list;
}
function tagMok(node, tag) {
  node._mokTag = tag;
  (node.children || []).forEach(function (c) { tagMok(c, tag); });
}

var userToggles = {};
function defaultExpanded(level) { return true; }
function isExpandedPath(path, level) {
  return userToggles.hasOwnProperty(path) ? userToggles[path] : defaultExpanded(level);
}
function toggleNode(e, path, level) {
  e.stopPropagation();
  userToggles[path] = !isExpandedPath(path, level);
  renderDetail();
}

function renderTreeRows(node, out, parentDepth, parentPath, parentVisible) {
  var depth = LEVEL_BASE_DEPTH.hasOwnProperty(node.level) ? LEVEL_BASE_DEPTH[node.level] : (parentDepth + 1);
  var nodePath = (parentPath ? parentPath + '>' : '') + node.level + ':' + node.name;
  var label = (node.level === '팀' ? node.name
    : node.level === '정책' ? '[정책] ' + node.name
    : node.level === '단위' ? '[단위] ' + node.name
    : node.level === '세부' ? '[세부] ' + node.name
    : (node.level === '목' || node.level === '세목') ? (node.code ? node.code + ' ' : '') + node.name
    : bulletForDepth(depth) + node.name);
  var cls = (node.level === '팀' || node.level === '정책' || node.level === '단위' || node.level === '세부' || node.level === '목' || node.level === '세목') ? node.level : 'leaf';
  var mokAttr = node._mokTag ? (' data-mok="' + escapeHtml(node._mokTag) + '"') : '';
  var amt25Cell = node.amt25 != null && node.amt25 !== 0 ? fmtWon(node.amt25) : (node.amt25 === 0 ? '-' : '');
  var hasChildren = node.children && node.children.length;
  var expanded = hasChildren ? isExpandedPath(nodePath, node.level) : false;
  var arrowHtml = hasChildren
    ? '<span class="tgl" onclick="toggleNode(event,\'' + nodePath.replace(/'/g, "\\'") + '\',\'' + node.level + '\')">' + (expanded ? '\u25BE' : '\u25B8') + '</span>'
    : '<span class="tgl" style="visibility:hidden">\u25B8</span>';
  var rowVisible = parentVisible;
  var hiddenCls = rowVisible ? '' : ' row-hidden-collapse';
  out.push('<tr class="lvl-' + cls + hiddenCls + '"' + mokAttr + '>'
    + '<td style="padding-left:' + (8 + depth * 14) + 'px">' + arrowHtml + ' ' + escapeHtml(label) + '</td>'
    + '<td class="num basis">' + escapeHtml(node.calc || '') + '</td>'
    + '<td class="num">' + fmtWon(node.amt26) + '</td>'
    + '<td class="num">' + amt25Cell + '</td>'
    + '<td class="num">' + fmtDiff(node.amt26, node.amt25) + '</td>'
    + '<td class="num">' + fmtPct(node.amt26, node.amt25) + '</td>'
    + '</tr>');
  if (node.children) node.children.forEach(function (c) { renderTreeRows(c, out, depth, nodePath, rowVisible && expanded); });
}

var treeInstanceCounter = 0;
function renderTeamTreesCombined(trees) {
  var instId = 'tt' + (treeInstanceCounter++);
  var rows = [];
  var groupsHtml = trees.map(function (tree) {
    var mokList = collectMokList(tree);
    mokList.forEach(function (m, i) { tagMok(m, instId + '_' + tree.name + '_m' + i); });
    renderTreeRows(tree, rows, 0, '', true);
    var mokItemsHtml = mokList.map(function (m, i) {
      var tag = instId + '_' + tree.name + '_m' + i;
      return '<label class="mok-filter-item" style="padding-left:16px"><input type="checkbox" checked data-mok-tag="' + tag + '" onchange="applyMokFilter(\'' + instId + '\')"> '
        + (m.code ? escapeHtml(m.code) + ' ' : '') + escapeHtml(m.name) + '</label>';
    }).join('');
    return '<div style="font-weight:600; font-size:15px; padding:4px 2px;">' + escapeHtml(tree.name) + '</div>' + mokItemsHtml;
  }).join('');

  var colgroup = '<colgroup>' + TREE_COL_LABELS.map(function (_, i) { return '<col class="tcol-' + i + '">'; }).join('') + '</colgroup>';
  var headCells = TREE_COL_LABELS.map(function (label, i) {
    var handle = i < TREE_COL_LABELS.length - 1 ? '<span class="col-resize-handle" data-resize="' + i + '"></span>' : '';
    if (i === 0) {
      return '<th><span class="th-filter-label" onclick="toggleMokFilter(\'' + instId + '\', event)">' + label + ' <i class="filter-caret">▾</i></span>' + handle + '</th>';
    }
    return '<th>' + label + handle + '</th>';
  }).join('');

  var popover = '<div id="mokpop-' + instId + '" class="mok-filter-popover" style="display:none">'
    + '<div class="mok-filter-actions"><button onclick="setAllMokFilter(\'' + instId + '\', true)">전체선택</button><button onclick="setAllMokFilter(\'' + instId + '\', false)">전체해제</button></div>'
    + groupsHtml + '</div>';

  return '<div class="team-block">' + popover
    + '<div class="tree-scroll"><div class="tree-container" id="treecontainer-' + instId + '">'
    + '<table class="tree">' + colgroup
    + '<thead><tr>' + headCells + '</tr></thead>'
    + '<tbody>' + rows.join('') + '</tbody></table>'
    + '</div></div></div>';
}
function renderTeamTree(tree) {
  return renderTeamTreesCombined([tree]);
}
function toggleMokFilter(instId, e) {
  e.stopPropagation();
  var pop = document.getElementById('mokpop-' + instId);
  if (!pop) return;
  pop.style.display = (pop.style.display === 'none') ? 'block' : 'none';
}
document.addEventListener('click', function (e) {
  document.querySelectorAll('.mok-filter-popover').forEach(function (pop) {
    if (pop.style.display === 'none') return;
    if (!pop.contains(e.target) && !e.target.closest('.th-filter-label')) pop.style.display = 'none';
  });
});
function setAllMokFilter(instId, checked) {
  var pop = document.getElementById('mokpop-' + instId);
  if (!pop) return;
  pop.querySelectorAll('input[type=checkbox]').forEach(function (cb) { cb.checked = checked; });
  applyMokFilter(instId);
}
function applyMokFilter(instId) {
  var pop = document.getElementById('mokpop-' + instId);
  var container = document.getElementById('treecontainer-' + instId);
  if (!pop || !container) return;
  var unchecked = [];
  pop.querySelectorAll('input[data-mok-tag]').forEach(function (cb) {
    if (!cb.checked) unchecked.push(cb.getAttribute('data-mok-tag'));
  });
  container.querySelectorAll('tbody tr').forEach(function (row) {
    var tag = row.getAttribute('data-mok');
    row.classList.toggle('mok-hidden', !!(tag && unchecked.indexOf(tag) !== -1));
  });
}

function renderDetail() {
  var b = getBusiness(state.selectedId);
  var el = document.getElementById('detail');
  if (!b) { el.innerHTML = ''; return; }

  // 예산액은 표시하지 않고, 정원/현원 총합 + 소속 팀별 내역을 한 줄로 요약 (모든 카드 공통)
  var headcountLine = '';
  if (b.teams && b.teams.length) {
    var totalCap = 0, totalCur = 0;
    var teamParts = b.teams.map(function (t) {
      totalCap += Number(t.capacity) || 0;
      totalCur += Number(t.current) || 0;
      return escapeHtml(t.name) + ' ' + t.capacity + '(' + t.current + ')';
    });
    headcountLine = '<div class="detail-summary-line">정원 ' + totalCap + '명 · 현원 ' + totalCur + '명'
      + (teamParts.length ? ' (' + teamParts.join(', ') + ')' : '') + '</div>';
  }

  var teamTreesHtml = '';
  if (b.teams && b.teams.length) {
    var trees = b.teams.filter(function (t) { return t.treeKey && TEAM_TREES[t.treeKey]; })
      .map(function (t) { return TEAM_TREES[t.treeKey]; });
    if (trees.length) teamTreesHtml = renderTeamTreesCombined(trees);
  }

  var linesHtml = b.lines.length ? b.lines.map(function (l, i) {
    return '<tr>'
      + '<td contenteditable="true" onblur="editLine(' + b.id + ',' + i + ',\'account\',this.textContent)">' + escapeHtml(l.account) + '</td>'
      + '<td contenteditable="true" onblur="editLine(' + b.id + ',' + i + ',\'name\',this.textContent)">' + escapeHtml(l.name) + '</td>'
      + '<td contenteditable="true" onblur="editLine(' + b.id + ',' + i + ',\'basis\',this.textContent)">' + escapeHtml(l.basis) + '</td>'
      + '<td class="num" contenteditable="true" onblur="editLine(' + b.id + ',' + i + ',\'amt\',this.textContent)">' + fmtWon(l.amt) + '</td>'
      + '<td class="del-btn" onclick="deleteLine(' + b.id + ',' + i + ')">삭제</td>'
      + '</tr>';
  }).join('') : '';
  var linesTable = '<div class="line-hdr"><h3>세부내역 (목·항목명·산출기초)</h3><button class="btn-sm" onclick="addLine(' + b.id + ')">+ 항목 추가</button></div>'
    + (b.lines.length
      ? '<table class="lines"><thead><tr><th style="width:80px">목</th><th style="width:140px">항목명</th><th>산출기초</th><th style="width:110px;text-align:right">금액(천원)</th><th style="width:40px"></th></tr></thead><tbody>' + linesHtml + '</tbody></table>'
      : '<p style="color:var(--text-soft); font-size:16.5px; padding:10px 0;">세부내역이 아직 입력되지 않았습니다. 엑셀 총액을 반영하려면 상단 총액을 직접 입력하거나, "+ 항목 추가"로 세부 항목을 넣으세요.</p>');

  el.innerHTML =
    '<div class="detail-inner">'
    + headcountLine
    + teamTreesHtml
    + (teamTreesHtml ? '' : linesTable)
    + '</div>';

  if (teamTreesHtml) {
    applyTreeColWidths();
    setupTreeColResize();
  }
}

var INSTITUTIONS = [];

var nav = { view: 'dashboard', instKey: null, fund: null, expandedInst: {}, expandedWtg: {} };

// 위탁금 아코디언에 노출할 기관별 소관부서 목록
var WTG_DEPTS = {
  hscf: ['문화예술과', '관광진흥과', '도서관정책과'],
  talent: ['교육지원과', '도서관정책과']

// 사이드바 전용 아웃라인(모노톤) 아이콘 세트 — 기관마다 제각각이던 이모지 아이콘을 통일
var SIDEBAR_ICON_BUILDING =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
  + '<rect x="4" y="3" width="16" height="18" rx="1.2"></rect>'

  + '<path d="M8 7h1M8 11h1M8 15h1M15 7h1M15 11h1M15 15h1"></path>'

  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path>'

function isInstExpanded(instKey) {

  return nav.instKey === instKey; // 기본값: 현재 선택된 기관만 펼침
}

function toggleInst(instKey) {
  nav.expandedInst[instKey] = !isInstExpanded(instKey);
  renderSidebarNav();
}

function isWtgExpanded(instKey) {
  return !!nav.expandedWtg[instKey];
}
function toggleWtg(instKey, e) {

async function selectBudgetDept(instKey, fund, dept, e) {

function renderSidebarNav() {
  var budgetEl = document.getElementById('nav-budget');
  budgetEl.innerHTML = INSTITUTIONS.map(function (inst) {
    var subItems = inst.funds.map(function (f) {
      var isActive = nav.view === 'budget' && nav.instKey === inst.key && nav.fund === f;
      if (f === '위탁금' && WTG_DEPTS[inst.key]) {
        var wtgExpanded = isWtgExpanded(inst.key);
        var deptItems = WTG_DEPTS[inst.key].map(function (d) {
          var isDeptActive = nav.view === 'budget' && nav.instKey === inst.key && nav.fund === '위탁금' && state.dept === d;
          return '<div class="side-item' + (isDeptActive ? ' active' : '') + '" onclick="selectBudgetDept(\'' + inst.key + '\',\'위탁금\',\'' + d + '\', event)">'
            + '<span>' + d + '</span></div>';

          + '<span>위탁금</span><span class="caret' + (wtgExpanded ? ' open' : '') + '">▾</span></div>'
          + '<div class="side-sub' + (wtgExpanded ? '' : ' collapsed') + '">' + deptItems + '</div>';
      }
      return '<div class="side-item' + (isActive ? ' active' : '') + '" onclick="selectBudget(\'' + inst.key + '\',\'' + f + '\')">'

      + '<span class="side-item-label"><span class="side-icon">' + SIDEBAR_ICON_BUILDING + '</span><span>' + inst.name + '</span></span>'

  document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
  document.getElementById(panelId).classList.add('active');
}

function showDashboard() {
  nav.view = 'dashboard'; nav.instKey = null; nav.fund = null;
  switchPanel('panel-dashboard');
  renderDashboard();

}

async function selectBudget(instKey, fund) {
  var inst = INSTITUTIONS.filter(function (i) { return i.key === instKey; })[0];
  nav.view = 'budget'; nav.instKey = instKey; nav.fund = fund;
  renderSidebarNav();
  updateTopbarLogo(instKey);

  if (inst.hasData) {
    switchPanel('panel-hscf');
    document.getElementById('card-grid').innerHTML = '<div class="empty-state">불러오는 중...</div>';
    var cache = await loadInstBudgetData(inst);
    if (!cache) return;

    TEAM_TREES = cache.teamTrees;
    DEFAULT_BUSINESSES = cache.businesses;
    state.businesses = cache.businesses;
    state.departments = cache.departments;

    // 현재 재원(fund)에 카드가 있는 부서 중 첫 번째를 기본 선택
    var deptForFund = cache.businesses.filter(function (b) { return b.fundType === fund; })
      .map(function (b) { return b.dept; }).filter(function (d) { return d; });
    state.dept = deptForFund.length ? deptForFund[0] : (cache.departments[0] || null);
    state.fund = fund;
    state.selectedId = null;
    renderAll();
  } else {
    document.getElementById('ph-title').textContent = inst.name + ' \u00B7 ' + fund;
    document.getElementById('ph-body').textContent = inst.name + '의 ' + fund + ' 데이터는 아직 연동되지 않았습니다. 자료를 주시면 동일한 구조로 반영합니다.';
    switchPanel('panel-budget-placeholder');
  }
}

function selectSettlement(instKey) {
  var inst = INSTITUTIONS.filter(function (i) { return i.key === instKey; })[0];
  nav.view = 'settlement'; nav.instKey = instKey; nav.fund = null;
  document.getElementById('settle-title').textContent = inst.name + ' \u00B7 결산';
  switchPanel('panel-settlement');
  renderSidebarNav();
}

async function renderDashboard() {
  var kpiEl = document.getElementById('dash-kpis');
  var listEl = document.getElementById('dash-list');
  if (!INSTITUTIONS.length) { kpiEl.innerHTML = '<div class="empty-state">불러오는 중...</div>'; return; }

  kpiEl.innerHTML = '<div class="empty-state">집계 중...</div>';

  var hscfCount = INSTITUTIONS.filter(function (i) { return i.hasData; }).length;

  var totalY26 = 0, totalY25 = 0;
  if (HSCF_INST_ID) {
    var { data: roots } = await db.from('budget_items')
      .select('amt26, amt25')
      .eq('institution_id', HSCF_INST_ID).eq('fund_type', '출연금').eq('level', '팀');
    (roots || []).forEach(function (r) { totalY26 += r.amt26 || 0; totalY25 += r.amt25 || 0; });
  }

  kpiEl.innerHTML =
    '<div class="dash-card"><div class="label">연동된 기관 수</div><div class="value">' + hscfCount + ' / ' + INSTITUTIONS.length + '</div></div>'
    + '<div class="dash-card"><div class="label">화성시문화관광재단 출연금 총액</div><div class="value">' + fmtWon(totalY26) + '천원</div></div>'
    + '<div class="dash-card"><div class="label">전년 대비</div><div class="value">' + (totalY26 - totalY25 >= 0 ? '+' : '') + fmtWon(totalY26 - totalY25) + '천원</div></div>'
    + '<div class="dash-card"><div class="label">데이터 준비 중</div><div class="value">' + (INSTITUTIONS.length - hscfCount) + '개 기관</div></div>';

  listEl.innerHTML = INSTITUTIONS.map(function (inst) {
    return '<div class="row"><span class="name">' + inst.icon + ' ' + inst.name + '</span>'
      + '<span class="status">' + (inst.hasData ? '연동 완료' : '데이터 준비 중') + '</span></div>';
  }).join('');
}

loadInstitutions().then(function () { showDashboard(); });
</script>
</body>
</html>
