    + '<div class="summary-box"><h4>기간제</h4><p>기간제·단시간근로자 규정, 근로계약, 사업기간, 최저임금·생활임금 적용 여부를 확인합니다.</p><p style="color:var(--text-muted);">확인자료: 근로계약서, 사업계획서, 기간제 관리내규</p></div>'
    + '</div>'
    + '<div class="summary-box" style="margin-top:16px;"><h4>기관별 기준값 출처</h4><p><b>화성도시공사:</b> 공사 보수규정·보수규정 시행내규를 1차 기준으로 확인합니다.</p><p><b>인재육성재단:</b> 재단 보수규정과 별표를 1차 기준으로 확인합니다.</p><p><b>문화관광재단:</b> 재단 보수규정과 별표를 우선 확인하고, 조례상 공무원 보수규정 준용 여부를 비교합니다.</p><p><b>화성FC:</b> 자체 보수·인사규정과 공개 규정을 우선 확인하며, 원자료가 없으면 단가를 임의로 채우지 않습니다.</p></div>'

  // ---- 01 보수: 직급별 표 — 기본급(박스1)과 수당(박스2)으로 분리 ----
  var gradeBaseRows = LC.grades.map(function (g, gi) {
    var a = lcGradeAmts(g);
    return '<tr>'
      + '<td>' + g.name + (g.estimated ? ' <span class="lc-warn" title="2026년 정원표엔 있으나 현원 0명(공석)이라 실제 예산서엔 산출식이 없음 — 3·4급 단가 격차 비율로 추정한 값. 실제 채용 시 반드시 검증 필요.">(추정단가)</span>' : '') + '</td>'

function showLaborCalc() {
  nav.view = 'laborcalc'; nav.instKey = null; nav.fund = null;
  switchPanel('panel-laborcalc');
  document.querySelectorAll('.sidebar .side-item').forEach(function (n) { n.classList.remove('active'); });
  renderLaborCalc();
}

function goToSettlement() {
  var target = INSTITUTIONS.filter(function (i) { return SETTLEMENT_DATA[i.key]; })[0] || INSTITUTIONS[0];
  if (target) selectSettlement(target.key);
}

function showDashboard() {
  nav.view = 'dashboard'; nav.instKey = null; nav.fund = null;
  nav.expandedInst = {};
  switchPanel('panel-dashboard');
  renderDashboard();
  renderSidebarNav();
  syncLandingHeroHeight();
}

function syncLandingHeroHeight() {
  var sb = document.querySelector('.sidebar');
  var main = document.querySelector('.main');
  var hero = document.querySelector('.landing-hero');
  if (!sb || !main) return;
  requestAnimationFrame(function () {
    var h = sb.offsetHeight;
    main.style.height = h + 'px';
    if (hero) hero.style.height = h + 'px';
  });
}
window.addEventListener('resize', function () {
  if (nav.view === 'dashboard') syncLandingHeroHeight();
});


async function selectBudget(instKey, fund) {
  var inst = INSTITUTIONS.filter(function (i) { return i.key === instKey; })[0];
  nav.view = 'budget'; nav.instKey = instKey; nav.fund = fund;
  // 아코디언: 어떤 경로로 들어오든(헤더 클릭/하위 항목 클릭) 이 기관만 펼치고 나머지는 닫는다.
  nav.expandedInst = {};
  nav.expandedInst[instKey] = true;
  renderSidebarNav();
  updateTopbarLogo(instKey);

  if (inst.hasData) {
    switchPanel('panel-hscf');
    // 예산 목차의 임시 플레이스홀더 항목(showPlaceholderInst)이 숨겨뒀을 수 있는 요소들을 원상복구
    var deptSelectEl = document.getElementById('dept-select');
    if (deptSelectEl) deptSelectEl.style.display = '';
    var roundRowEl = document.getElementById('round-tabs-row');
    if (roundRowEl) roundRowEl.style.display = '';
    var roundRadioEl = document.getElementById('round-tabs');
    if (roundRadioEl) roundRadioEl.style.display = '';
    var badgeRowEl = document.getElementById('tab-headcount-badge-row');
    if (badgeRowEl) badgeRowEl.style.display = '';
    var summaryTitleElRestore = document.getElementById('summary-title');
    var summaryTitleRowRestore = summaryTitleElRestore ? summaryTitleElRestore.closest('.section-title-row') : null;
    if (summaryTitleRowRestore) summaryTitleRowRestore.style.display = '';
    var summarySlotElRestore = document.getElementById('summary-slot');
    if (summarySlotElRestore) summarySlotElRestore.style.display = '';
    document.getElementById('card-grid').className = '';
    document.getElementById('card-grid').innerHTML = '<div class="empty-state"><div class="loader"><span class="loader-text">loading</span><span class="load"></span></div></div>';
    var cache = await loadInstBudgetData(inst);
    if (!cache) return;

    TEAM_TREES = cache.teamTrees;
    DEFAULT_BUSINESSES = cache.businesses;
    state.businesses = cache.businesses;
    state.departments = cache.departments;

    // 현재 재원(fund)에 카드가 있는 부서 중 첫 번째를 기본 선택
    var deptForFund = cache.businesses.filter(function (b) { return b.fundType === fund; })
      .map(function (b) { return b.dept; }).filter(function (d) { return d; });
    state.dept = deptForFund.length ? deptForFund[0] : (cache.departments[0] || null);

function fmtSettleDiff(budget, settle) {
  var diff = settle - budget;
  var cls = diff >= 0 ? 'up' : 'down';
  var sign = diff >= 0 ? '+' : '';
  return '<span class="diff ' + cls + '">' + sign + fmtWon(diff) + '</span>';
}

function renderSettlementRows(rows) {
  return rows.map(function (r) {
    var rate = r.budget ? Math.round((r.settle / r.budget) * 1000) / 10 : 0;
    return '<tr><td class="settle-col-label">' + r.name + '</td>'
      + '<td class="num settle-col-amt">' + fmtWon(r.budget) + '</td>'
      + '<td class="num settle-col-amt">' + fmtWon(r.settle) + '</td>'
      + '<td class="diff">' + fmtSettleDiff(r.budget, r.settle) + '</td>'
      + '<td class="num settle-col-rate">' + rate + '%</td></tr>';
  }).join('');
}

function renderSettlementTotalRow(rows) {
  var totalBudget = rows.reduce(function (s, r) { return s + r.budget; }, 0);
  var totalSettle = rows.reduce(function (s, r) { return s + r.settle; }, 0);
  var rate = totalBudget ? Math.round((totalSettle / totalBudget) * 1000) / 10 : 0;
  return '<tr class="total"><td class="settle-col-label">합계</td>'
    + '<td class="num settle-col-amt">' + fmtWon(totalBudget) + '</td>'
    + '<td class="num settle-col-amt">' + fmtWon(totalSettle) + '</td>'
    + '<td class="diff">' + fmtSettleDiff(totalBudget, totalSettle) + '</td>'
    + '<td class="num settle-col-rate">' + rate + '%</td></tr>';
}

function settleKpiCard(tone, iconKey, label, valueHtml, subHtml) {
  var iconCls = iconKey === 'shortage' ? ' icon-shortage' : '';
  return '<div class="settle-kpi-card">'
    + '<div class="kpi-body"><div class="label">' + label + '</div>'
    + '<div class="value">' + valueHtml + '</div>'
    + (subHtml ? '<div class="sub">' + subHtml + '</div>' : '')
    + '</div>'
    + '<div class="icon-badge' + iconCls + '">' + SETTLE_KPI_ICONS[iconKey] + '</div>'
    + '</div>';
}

function renderSettleYoyCard(label, curr, prev, unit, accent, unitDivisor) {
  var pct = prev ? Math.round(((curr - prev) / Math.abs(prev)) * 1000) / 10 : null;
  var cls = curr - prev >= 0 ? 'up' : 'down';
  var dv = unitDivisor || 1;
  var dispCurr = dv === 1 ? fmtWon(curr) : fmtMillion(curr);

  return '<article class="halo-stat ' + cls + '" style="--halo-accent:' + accent + ';">'
    + '<header class="halo-stat-head">'
      + '<span class="halo-stat-label">' + label + '</span>'
    + '</header>'
    + '<p class="halo-stat-value">' + dispCurr + unit + '</p>'
    + '<footer class="halo-stat-meta">'
      + '<span class="halo-stat-delta ' + cls + '">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14l5-5 5 5"></path></svg>'
        + (pct === null ? '-' : Math.abs(pct) + '%')
      + '</span>'
      + '<svg class="halo-stat-spark ' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>'
        + '<polyline points="16 7 22 7 22 13"></polyline>'
      + '</svg>'
    + '</footer>'
    + '<div class="halo-stat-sub">전년 ' + (dv === 1 ? fmtWon(prev) : fmtMillion(prev)) + unit + '</div>'
    + '</article>';
}

function renderSettlementYearTabs(instKey, inst) {
  var tabsEl = document.getElementById('settle-year-tabs');
  var meta = SETTLEMENT_DATA[instKey];
  if (!meta) { tabsEl.innerHTML = ''; return; }
  var years = Object.keys(meta.years).map(Number).sort(function (a, b) { return b - a; });
  tabsEl.innerHTML = years.map(function (y) {
    var hasData = !!meta.years[y];
    var selected = y === nav.settleYear;
    if (!hasData) {
      return '<div class="settle-year-tab disabled" title="준비 중">' + y + '</div>';
    }
    return '<div class="settle-year-tab' + (selected ? ' selected' : '') + '" onclick="selectSettlementYear(\'' + instKey + '\',' + y + ')">' + y + '</div>';
  }).join('');
}

function renderSettlementPanel(instKey, inst) {
  var meta = SETTLEMENT_DATA[instKey];
  var bodyEl = document.getElementById('settle-body');

  if (!meta) {
    document.getElementById('settle-year-tabs').innerHTML = '';
    bodyEl.innerHTML = '<div class="placeholder-box">' + inst.name + '의 결산 데이터는 아직 연동되지 않았습니다. 자료를 주시면 동일한 구조로 반영합니다.</div>';
    return;
  }

  var year = nav.settleYear || meta.defaultYear;
  var data = meta.years[year];
  renderSettlementYearTabs(instKey, inst);

  if (!data) {
    bodyEl.innerHTML = '<div class="placeholder-box">' + year + '년 결산 데이터는 아직 준비 중입니다.</div>';
    return;
  }

  var rate = Math.round((data.total.settle / data.total.budget) * 1000) / 10;
  var unused = data.total.budget - data.total.settle;

  var kpiHtml = '<div class="section-title-row"><h2 class="section-heading section-heading-lg">결산총괄(지출)</h2></div>'
    + '<div class="settle-kpi-grid">'
      + settleKpiCard('blue', 'settle-budget', '예산액', fmtMillion(data.total.budget) + '백만원')
      + settleKpiCard('purple', 'settle-settle', '결산액', fmtMillion(data.total.settle) + '백만원')
      + settleKpiCard('mint', 'settle-rate', '집행률', rate + '%', '<div class="settle-rate-bar"><div class="fill" style="width:' + Math.min(rate, 100) + '%;"></div></div>')
      + settleKpiCard('orange', 'settle-unused', '불용액', fmtMillion(unused) + '백만원')
    + '</div>';

  var settleColgroup = '<colgroup><col style="width:26%;"><col style="width:19%;"><col style="width:19%;"><col style="width:18%;"><col style="width:18%;"></colgroup>';

  var fundHtml = '<div class="section-title-row settle-section-gap"><h2 class="section-heading section-heading-lg">재원별 수입 결산</h2></div>'
    + '<div class="summary-box"><div class="table-scroll"><table class="summary" style="table-layout:fixed;width:100%;">' + settleColgroup
      + '<thead><tr><th class="settle-col-label" style="font-size:17px;">재원</th><th class="settle-col-amt" style="font-size:17px;">예산액</th><th class="settle-col-amt" style="font-size:17px;">결산액</th><th style="font-size:17px;">증감</th><th class="settle-col-rate" style="font-size:17px;">집행률</th></tr></thead>'
      + '<tbody>' + renderSettlementTotalRow(data.byFund) + renderSettlementRows(data.byFund) + '</tbody>'
    + '</table></div></div>';

  var natureHtml = '';
  if (data.byNature) {
    natureHtml = '<div class="section-title-row settle-section-gap"><h2 class="section-heading section-heading-lg">지출예산 성질별 결산</h2></div>'
      + '<div class="summary-box"><div class="table-scroll"><table class="summary" style="table-layout:fixed;width:100%;">' + settleColgroup
        + '<thead><tr><th class="settle-col-label" style="font-size:17px;">성질</th><th class="settle-col-amt" style="font-size:17px;">예산액</th><th class="settle-col-amt" style="font-size:17px;">결산액</th><th style="font-size:17px;">증감</th><th class="settle-col-rate" style="font-size:17px;">집행률</th></tr></thead>'
        + '<tbody>' + renderSettlementTotalRow(data.byNature) + renderSettlementRows(data.byNature) + '</tbody>'
      + '</table></div></div>';
  } else {
    natureHtml = '<div class="section-title-row settle-section-gap"><h2 class="section-heading section-heading-lg">지출예산 성질별 결산</h2></div>'
      + '<div class="placeholder-box">이 기관의 성질별 결산 세부 데이터는 아직 준비 중입니다.</div>';
  }

  var yoyHtml = '';
  if (data.yoy) {
    yoyHtml = '<div class="section-title-row settle-section-gap"><h2 class="section-heading section-heading-lg">전년 대비 증감</h2></div>'
      + '<div class="settle-yoy-grid">'
        + renderSettleYoyCard('총수익', data.yoy.totalRevenue.curr, data.yoy.totalRevenue.prev, '백만원', 'var(--accent)', 1000)
        + renderSettleYoyCard('총비용', data.yoy.totalExpense.curr, data.yoy.totalExpense.prev, '백만원', 'var(--danger)', 1000)
        + renderSettleYoyCard('당기순손익', data.yoy.netIncome.curr, data.yoy.netIncome.prev, '백만원', 'var(--success)', 1000)
      + '</div>';
  }

  bodyEl.innerHTML = kpiHtml + yoyHtml + fundHtml + natureHtml;
}

function selectSettlementYear(instKey, year) {
  nav.settleYear = year;
  var inst = INSTITUTIONS.filter(function (i) { return i.key === instKey; })[0];
  renderSettlementPanel(instKey, inst);
}

function selectSettlement(instKey) {
  var inst = INSTITUTIONS.filter(function (i) { return i.key === instKey; })[0];
  nav.view = 'settlement'; nav.instKey = instKey; nav.fund = null;
  var meta = SETTLEMENT_DATA[instKey];
  nav.settleYear = meta ? meta.defaultYear : null;
  document.getElementById('settle-title').textContent = inst.name;
  switchPanel('panel-settlement');
  renderSettlementPanel(instKey, inst);
  renderSidebarNav();
}

function getInstLogoSrc(instKey) {
  if (LANDING_SYMBOLS[instKey]) return LANDING_SYMBOLS[instKey];
  return null;
}

async function renderDashboard() {
  var gridEl = document.getElementById('landing-grid');
  if (!INSTITUTIONS.length) { gridEl.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="loader"><span class="loader-text">loading</span><span class="load"></span></div></div>'; return; }

  gridEl.innerHTML = INSTITUTIONS.map(function (inst) {
    var onclick = (inst.hasData || OV2_DATA[inst.key]) ? "selectInstOverview('" + inst.key + "')" : '';
    var logoSrc = getInstLogoSrc(inst.key);
    var iconInner = logoSrc
      ? '<img src="' + logoSrc + '" alt="' + inst.name + '" class="' + (inst.key === 'hscf' ? 'landing-logo-lg' : '') + '" />'
      : '<span class="landing-card-mono">' + inst.name.charAt(0) + '</span>';
    return '<div class="landing-card" onclick="' + onclick + '">'
      + '<span class="landing-card-tooltip">' + inst.name + '</span>'
      + '<div class="landing-card-icon">' + iconInner + '</div>'
      + '</div>';
  }).join('');
}

function goToBudget() {
  var target = INSTITUTIONS.filter(function (i) { return i.funds && i.funds[0]; })[0];
  if (target) selectBudget(target.key, target.funds[0]);
}

loadInstitutions().then(function () { showDashboard(); });
</script>
